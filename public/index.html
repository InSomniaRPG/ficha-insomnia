      /* Habilidades cujo texto menciona limite por descanso ou por rodada */
      function habsComUso() {
        const out = [];
        Object.keys(ESP).forEach((k) =>
          (CH.esp[k].tal || []).filter(Boolean).forEach((n) => {
            const t = (TALENTOS[ESP[k].cat] || []).find(
              (z) => z.n.trim() === n.trim()
            );
            if (t && /por descanso/i.test(t.d || ""))
              out.push({
                k: "esp:" + k + ":" + n,
                n: t.n,
                ctx: ESP[k].n,
                d: t.d,
              });
          })
        );
        Object.keys(ECO).forEach((k) =>
          (CH.ecos[k].hab || []).filter(Boolean).forEach((n) => {
            const t = (MAESTRIAS[ECO[k].n] || []).find(
              (z) => z.n.trim() === n.trim()
            );
            if (t && /por descanso|por dia/i.test(t.d || ""))
              out.push({
                k: "eco:" + k + ":" + n,
                n: t.n,
                ctx: "Eco de " + ECO[k].n,
                d: t.d,
              });
          })
        );
        return out;
      }
      function maxUsos(txt, d) {
        if (/metade (do|da) (seu |sua )?(atributo de )?psique/i.test(txt))
          return half(d.psique);
        if (/igual ao (seu )?(atributo de )?psique/i.test(txt)) return d.psique;
        const m = txt.match(/(\d+) vez(?:es)? por descanso/i);
        if (m) return +m[1];
        if (/uma vez por descanso|1 vez por descanso/i.test(txt)) return 1;
        if (/duas vezes por descanso/i.test(txt)) return 2;
        return 1;
      }
      function usosBox(d) {
        const ls = habsComUso();
        const orig = Object.keys(USOS[CH.origem] || {}).filter(
          (nv) => CH.nivel >= +nv
        );
        if (!ls.length && !orig.length)
          return `<p class="note">Nenhuma habilidade escolhida tem limite por descanso.</p>`;
        let h = `<div class="chosen">`;
        orig.forEach((nv) => {
          const u2 = USOS[CH.origem][nv],
            tot = limUsos(u2.f, d.psique),
            g = CH.usos[CH.origem + nv] || 0;
          h += linhaUso(
            "org:" + nv,
            u2.l,
            CH.origem + " · nível " + nv,
            g,
            tot,
            "uso"
          );
        });
        ls.forEach((x) => {
          const tot = maxUsos(x.d, d),
            g = (CH.usosHab || {})[x.k] || 0;
          h += linhaUso(x.k, x.n, x.ctx, g, tot, "uso2");
        });
        return h + `</div>`;
      }
      function linhaUso(key, nome, ctx, gasto, tot, tipo) {
        const rest = Math.max(0, tot - gasto);
        return `<div class="chip"><div class="ctxt"><b>${esc(
          nome
        )}</b><span class="bdg">${esc(ctx)}</span>
    <span class="bdg ${rest ? "g" : "r"}">${rest} de ${tot} restante${
          rest === 1 ? "" : "s"
        }</span></div>
    <div style="display:flex;gap:4px;flex:none">
      <button class="btn sm" data-${tipo}delta="-1" data-key="${esc(key)}" ${
          gasto <= 0 ? "disabled" : ""
        }>−</button>
      <button class="btn sm" data-${tipo}delta="1" data-key="${esc(key)}" ${
          rest <= 0 ? "disabled" : ""
        }>usar</button></div></div>`;
      }
      function calcBox(d) {
        const D2 = CH.dano || {};
        const armas = CH.armas.filter((w) => w.n);
        return `<div class="row">
    <div class="grp sm"><label>Sua rolagem de ataque</label><input type="number" data-dano="atk" value="${
      D2.atk || 0
    }"></div>
    <div class="grp sm"><label>Esquiva/defesa do alvo</label><input type="number" data-dano="def" value="${
      D2.def || 0
    }"></div>
    <div class="grp sm"><label>Dano garantido</label><input type="number" data-dano="base" value="${
      D2.base || 0
    }"></div>
    <div class="grp sm"><label>Bônus de dano</label><input type="number" data-dano="bonus" value="${
      D2.bonus || 0
    }"></div>
    <div class="grp sm"><label>Escudo do alvo</label><input type="number" data-dano="esc" value="${
      D2.esc || 0
    }"></div>
    <div class="grp sm"><label>Redução/armadura do alvo</label><input type="number" data-dano="red" value="${
      D2.red || 0
    }"></div>
  </div>
  ${
    armas.length
      ? `<p class="note">Dano garantido das suas armas: ${armas
          .map((w) => {
            const x = acharArma(w.n),
              dn = danoArma(x, w.v);
            return esc(x.n) + " " + (dn.tot ?? dn.txt);
          })
          .join(" · ")}
     · desarmado ${d.danoDes} · ataque psíquico +${d.atqPsi}</p>`
      : ""
  }
  <div id="danoOut">${danoTxt()}</div>`;
      }
      function danoTxt() {
        const D2 = CH.dano || {},
          dif = (+D2.atk || 0) - (+D2.def || 0);
        if (!D2.atk && !D2.base)
          return `<p class="note">Preencha a rolagem e o dano garantido para ver o resultado.</p>`;
        if (dif < 0)
          return `<div class="al e"><i>✕</i><div>Ataque errou por ${Math.abs(
            dif
          )}. Nenhum dano.</div></div>`;
        const tab = [
          [2, 1],
          [4, 2],
          [6, 3],
          [8, 4],
          [10, 5],
          [Infinity, 6],
        ];
        const pd = dif === 0 ? 0 : tab.find((r) => dif <= r[0])[1];
        const bruto = (+D2.base || 0) + (+D2.bonus || 0) + pd;
        const posEsc = Math.max(0, bruto - (+D2.esc || 0));
        const final = Math.max(0, posEsc - (+D2.red || 0));
        const escAbs = Math.min(bruto, +D2.esc || 0);
        return `<div class="al g"><i>✓</i><div>
    <b>Dano final: ${final}</b><br>
    diferença ${dif} → +${pd} de dano pela diferença${
          dif === 0 ? " (empate: só o garantido)" : ""
        }<br>
    ${D2.base || 0} garantido${
          D2.bonus ? " + " + D2.bonus + " de bônus" : ""
        } + ${pd} = <b>${bruto}</b>
    ${escAbs ? ` · escudo absorve ${escAbs} → ${posEsc}` : ""}
    ${D2.red ? ` · redução −${D2.red} → ${final}` : ""}
  </div></div>`;
      }
      function calcDano() {
        const el = document.querySelector("#danoOut");
        if (el) el.innerHTML = danoTxt();
        persist();

    <div class="grp sm"><label>Tipo de dano principal</label><select data-est="tipoDano">

  ${

  ${blocoCustom()}

      : ""
  }
  <div class="hr"></div><p class="sub">Habilidades — ${d.runasUso} de ${
          d.runasDisp
        } runas</p>
  <div class="row" style="margin-bottom:10px"><div class="grp"><div class="slots" style="padding:0">
    ${E.habs
      .map((x) => {

  </div><button class="btn pri" id="bAdd" style="width:100%;margin-top:7px">+ Nova runa</button></div></div>

        o += `<div class="hr"></div><p class="sub">Descrição mecânica / narrativa</p>
    <textarea data-hab="desc" placeholder="Como essa habilidade se manifesta?">${esc(

        if (ar || h.tipo !== "estigma")
          o += `<div style="margin-top:12px;display:flex;justify-content:flex-end"><button class="btn dz" id="bDelHab">Excluir runa</button></div>`;

      function boxFn(h, sf, i) {

          ar = ctxHabs().arte;
        const grupos = ar
          ? Object.keys(CAT)

          : E.arqs
              .map(
                (a) =>

                    .map((x) => opt(x.n, x.id, sf.id === x.id))
                    .join("")}</optgroup>`

      false
    )}</optgroup>
    </select>`;
        if (h.comb && i === 1)
          o += `<button class="btn dz" data-rmfn="1">Remover</button>`;
        o += `</div>`;
        if (!f)
          return (
            o +
            `<p class="fndesc">Escolha uma função para ver custo, requisitos e regras.</p></div>`

        o += `<div class="badges">

    ${f.custom ? '<span class="bdg v">personalizada da mesa</span>' : ""}
  </div>`;
        if (f.custom) {

      <div class="grp sm"><label>Custo base</label><input type="number" min="0" data-cfe="b" data-cix="${ix}" value="${
            f.b
          }"></div>
      <div class="grp sm"><label>Custo de P.A</label><input type="number" min="0" max="6" data-cfe="pa" data-cix="${ix}" value="${
            f.pa
          }"></div>
    </div>
    <div class="row" style="margin-top:9px"><div class="grp"><label>Propriedades</label><div class="chips">
      ${[
        ["dano", "causa dano", !!f.dano],

        ["t", "teste de resistência", f.t === "s"],
        ["rc", "pode ser reação", f.rc === "s"],

      ]

              on ? "checked" : ""
            }> ${l}</label>`
        )
        .join("")}
    </div></div></div>
    <div class="row" style="margin-top:9px"><div class="grp"><label>Descrição</label>
      <textarea data-cfe="d" data-cix="${ix}" style="min-height:52px">${esc(
            f.d
          )}</textarea></div></div>
    <p class="note">Fica salva na ficha e reaparece na lista de funções para outras runas.</p>`;
        } else {
          o += `<p class="fndesc">${f.d}</p>`;
        }
        (f.op || []).forEach((op) => {
          if (op.num) {
            const v = sf.op[op.id] ?? op.def;
            o += `<div class="row" style="margin-top:9px"><div class="grp"><label>${op.l}</label>
        <input type="number" data-fn="${i}" data-op="${op.id}" value="${v}" min="${op.min}" max="${op.max}"></div></div>`;
          } else {

                  s === j

              )
              .join("")}</select></div></div>`;
          }
        });
        if (f.param) {
          const v = (sf.par || {})[f.param.id] || "";
          o += `<div class="row" style="margin-top:9px"><div class="grp"><label>${
            f.param.l
          } — escolha permanente</label>
      <select data-fn="${i}" data-par="${f.param.id}">${opt(
            "— escolha —",
            "",
            !v
          )}
      ${f.param.it
        .map((x) => opt(x, x, v === x))
        .join("")}</select></div></div>`;
          if (!v)
            o += `<p class="note" style="color:var(--warn)">Defina ${f.param.l.toLowerCase()} — sem isso a habilidade fica incompleta na ficha.</p>`;
        }
        if (f.paramN) {
          const arr = (sf.par || {})[f.paramN.id] || [],
            lim = half(D().psique);
          o += `<div class="row" style="margin-top:9px"><div class="grp">
      <label>${f.paramN.l} — ${arr.length} de ${lim} (metade da Psique)</label>
      <div class="chips">${f.paramN.it

          const on = arr.includes(x),
            cheio = !on && arr.length >= lim;
          return `<label class="check sm ${on ? "on" : ""}" ${
            cheio ? 'style="opacity:.4"' : ""

          <input type="checkbox" data-fn="${i}" data-parn="${

        }

          o += `<div style="margin-top:9px"><label class="check ${
            h.marioMult ? "on" : ""

    <input type="checkbox" data-hab="marioMult" ${
      h.marioMult ? "checked" : ""

      /* Resolve as escalas com Psique em número concreto */
      function escTxt(f, h, sf) {
        const ar = ctxHabs().arte;
        const P = ar ? ar.psiOn || 0 : D().psique;
        const fonte = ar
          ? "Psique do Onírico (" + P + ")"
          : "sua Psique (" + P + ")";
        const man = ar ? 0 : D().manBonus;
        const calc = (e) => {
          if (typeof e !== "string") return "";
          if (e.startsWith("+1 até")) return "+1 por acerto, até +" + P;
          let v = e.replace(/P/g, String(P));
          try {
            let n = Function(
              '"use strict";return (' + v.replace("/2", "/2") + ")"
            )();
            n = e.includes("/2")
              ? Math.floor(Math.abs(n)) * (e.startsWith("-") ? -1 : 1)
              : n;
            return String(n);
          } catch (_) {
            return e;
          }
        };
        const rot = {
          dano: "Dano",
          escudo: "Escudo",
          cura: "Cura",
          desloc: "Deslocamento",
          inic: "Iniciativa",
          fluxo: "Fluxo",
          pv: "PV",
        };
        const linhas = [];
        Object.keys(f.esc).forEach((k) => {
          const arr = f.esc[k];
          const ap = (sf.ap || 1) - 1;
          const vals = arr.map((e, i) => {
            let n = calc(e);
            if (k === "dano" && man && !isNaN(+n))
              n = +n + man + " (inclui +" + man + " do Eco)";
            return (
              (arr.length > 1
                ? ["fraco/1 P.A", "médio/2 P.A", "forte/3 P.A"][i] ||
                  "opção " + (i + 1)
                : "") +
              (arr.length > 1 ? ": " : "") +
              n
            );
          });
          linhas.push(
            '<b style="color:var(--txt)">' +
              rot[k] +
              ":</b> " +
              vals.join(" · ")
          );
        });
        return `<p class="note">${linhas.join(
          "<br>"
        )} <em style="color:var(--dim2)">— calculado com a ${fonte}</em></p>`;
      }
      function prolTxt(h, c) {
        if (h.passiva) return "—";
        const esp = h.fns.map((sf) => FN[sf.id]).filter((f) => f && f.pl)[0];
        if (esp)
          return (
            '<span style="font-size:10.5px;line-height:1.25;display:block;font-weight:500">' +
            esc(esp.pl) +
            "</span>"
          );
        return c.prol ? c.prol + "/rod" : "—";
      }
      function paramTxt(h) {
        const out = [];
        h.fns.forEach((sf) => {
          const f = FN[sf.id];
          if (!f) return;
          if (f.param && (sf.par || {})[f.param.id])
            out.push(f.param.l + ": " + (sf.par || {})[f.param.id]);
          if (f.paramN && ((sf.par || {})[f.paramN.id] || []).length)
            out.push(f.paramN.l + ": " + sf.par[f.paramN.id].join(", "));
        });
        return out.join(" · ");
      }
      function ledger() {
        const h = curHab(),
          c = custo(h),
          d = D();
        let l = "";
        c.det.forEach((x) => {
          l += `<div class="lrow"><span>${x.n}${

          l += `<div class="lrow"><span>Passiva — custo base dobrado</span><b>×2 = ${c.base}</b></div>`;

          l += `<div class="lrow ${m.v < 0 ? "neg" : ""}"><span>${

          }</span><b>${m.v > 0 ? "+" : ""}${m.v}</b></div>`;

        if (c.piso)
          l += `<div class="lrow"><span>Piso do sistema — o custo nunca desce abaixo de 1</span><b>= 1</b></div>`;
        l += `<div class="lrow sum"><span>${
          h.passiva ? "Desconto permanente" : "Custo de Fluxo"
        }</span><b>${c.total}</b></div>`;
        $("#side").innerHTML =
          l +
          `<div class="bigrow">
    <div class="big pa"><u>Custo de P.A</u><b>${h.passiva ? 0 : c.pa}</b></div>
    <div class="big pr"><u>Custo prolongado</u><b>${prolTxt(h, c)}</b></div>
    <div class="big"><u>Runas gastas</u><b style="color:var(--runa)">${runasGastas(
      h
    )}</b></div>
    <div class="big"><u>${
      ctxHabs().arte ? "Reserva do artefato" : "Fluxo disponível"
    }</u>
      <b style="color:var(--fluxo)">${

            })
          );

              ROOT = novaFicha();

          d = D();
        CH.fluxoGasto += c.total;
        CH.paGasto = (CH.paGasto || 0) + c.pa;
        if (h.dur === "prol") h.ativa = true;
        render();

      function limparEfeitos() {
        CH.estigma.habs.forEach((h) => {

      const MIGRA_FN = { perfuracao: "perf_escudo" };
      function migrar(f) {
        const avisos = [];
        ((f.estigma && f.estigma.habs) || []).forEach((h) =>
          (h.fns || []).forEach((sf) => {
            if (MIGRA_FN[sf.id]) {
              avisos.push(FN[MIGRA_FN[sf.id]].n);
              sf.id = MIGRA_FN[sf.id];
            }
          })
        );
        if (f.origem && !ORIGENS[f.origem]) {
          avisos.push('origem "' + f.origem + '" não existe mais');
          f.origem = "";
        }
        if (f.cfgArte && f.cfgArte.EX && f.cfgArte.EX.pa === 3) {
          delete f.cfgArte.EX.pa;
          avisos.push('limite de P.A do Rank EX corrigido para "4 ou mais"');

        if (avisos.length)

            () =>
              alert(

                  [...new Set(avisos)].join("\n• ") +

              "<tr><th>" +
              esc(o.l) +
              '</th><td colspan="3">' +
              esc(it.l) +
              "</td></tr>";
        });
        let val = "";
        if (CH.sigilo.v === "transformacao")
          val =
            '<tr><th>PV da transformação</th><td class="c">' +
            d.sigPV +
            '</td><th>Psique ativa</th><td class="c">' +
            (d.p.limAtr + 2) +
            "</td></tr>";
        if (CH.sigilo.v === "territorio")
          val =
            '<tr><th>Raio</th><td class="c">' +
            d.sigRaio +
            ' m</td><th>Limite do totem</th><td class="c">' +
            d.limFluxo +
            "</td></tr>";
        if (CH.sigilo.v === "invocacao")
          val =
            '<tr><th>Fluxo da invocação</th><td class="c">' +
            d.sigInvFluxo +
            '</td><th>Runas</th><td class="c">' +
            Math.floor(d.runasDisp / 2) +
            "</td></tr>";
        return (
          "<h2>Sigilo — " +
          esc(S.n) +
          (CH.sigilo.nome ? ' · "' + esc(CH.sigilo.nome) + '"' : "") +
          "</h2>" +
          '<table><tr><th>Ativação</th><td class="c">' +
          S.pa +
          ' P.A</td><th>Fluxo</th><td class="c">' +
          (c != null ? c : "—") +
          '</td></tr><tr><th>Duração</th><td colspan="3">' +
          esc(S.dur) +
          "</td></tr>" +
          extra +
          val +
          '<tr><th>Colateral</th><td colspan="3">' +
          esc(S.col) +
          "</td></tr></table>"
        );
      }

      /* ---------- boot ---------- */
      function boot() {
        CH = ROOT;
        $("#cNome").value = CH.nome || "";
        render();
      }
      carregar();
      boot();
    </script>
  </body>
</html>
