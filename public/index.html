ção", "d": "Quando você tirar uma falha crítica em uma jogada de ataque com uma arma corpo a corpo, você pode rolar o dado novamente. Essa característica pode ser utilizada duas vezes por descanso longo."}, {"n": "Ataque Preciso", "t": "Ação", "d": "Declarando de forma prévia antes de atacar, você pode aumentar sua concentração, concedendo vantagem na sua próxima jogada de ataque corpo a corpo. Essa característica pode ser utilizada duas vezes por descanso longo"}, {"n": "Retribuição", "t": "[Reação]", "d": "Uma vez por rodada, ao ser bem sucedido em uma jogada de esquiva ou defesa contra um ataque corpo a corpo, você pode realizar um Ataque Reativo imediato contra ele."}, {"n": "Resistir", "t": "[Reação]", "d": "Uma vez por rodada, ao falhar em uma jogada de defesa, você pode reduzir o dano levado em um valor igual ao seu atributo de Força. Essa característica pode ser utilizada duas vezes por descanso longo e não consome pontos de ação."}, {"n": "Lacerar", "t": "Ação", "d": "Uma vez por rodada, quando você atacar fisicamente um alvo que esteja a 1 metro de outra criatura, você pode expandir a área de cobertura do seu golpe para acertar ambos ao mesmo tempo, realizando uma única jogada. Ambos os alvos podem fazer suas jogadas de esquiva/defesa normalmente."}, {"n": "Em Guarda", "t": "Passiva", "d": "Você recebe um bônus de +1 em suas jogadas de esquiva e defesa. Esse bônus se torna +2 a partir do nível 7 e +3 a partir do nível 13. Esse bônus não acumula com habilidades psíquicas e outras especializações que concedam bônus de esquiva ou defesa direta ou indiretamente."}, {"n": "Sentinela", "t": "[Reação]", "d": "Você pode realizar um Ataque Reativo toda vez que uma criatura entrar voluntariamente em seu alcance corpo a corpo."}, {"n": "Interrupção", "t": "Passiva", "d": "Ao atingir um Ataque Reativo em uma criatura, ela não poderá se mover novamente até o final do turno dela."}, {"n": "Fantasma", "t": "Passiva", "d": "Seu primeiro Ataque Reativo ou Movimento Especial com Propriedade de [Reação] não consome Pontos de Ação na primeira vez em que você o utiliza em uma rodada."}, {"n": "Aparo Perfeito", "t": "[Reação]", "d": "Uma vez por rodada, declarando de forma prévia antes de saber o resultado da rolagem de um ataque inimigo, você pode escolher aparar o golpe. Ao utilizar esse recurso, você consome 2 Pontos de Ação, mas reduz o dano levado para zero. Adicionalmente, você pode fazer um Ataque Reativo imediato contra seu oponente como parte desse mesmo recurso. Essa técnica pode ser usada 2 vezes por descanso completo. Essa técnica consome P.A mesmo caso você possua Fantasma."}, {"n": "Contra Ataque", "t": "[Reação]", "d": "Uma vez por rodada, ao ser alvejado por um ataque corpo a corpo, você pode realizar um Ataque Reativo contra seu oponente, em vez de fazer uma jogada de defesa ou esquiva. Caso o resultado do seu ataque seja superior ao do seu oponente, você não recebe nenhum dano e seu ataque atinge o inimigo. Seu golpe não causa nenhum dano pela diferença dos dados e não causa nenhum dano adicional em acertos críticos."}, {"n": "Golpe Estendido", "t": "Passiva", "d": "A partir desse movimento, você aprende a otimizar seus golpes para extrair o máximo do alcance. Ao realizar uma jogada de ataque com uma arma corpo a corpo, o alcance dos seus golpes aumenta em 1m."}, {"n": "Troca Tática", "t": "Ação", "d": "Consumindo 1 P.A no seu turno, você pode trocar de posição com uma criatura aliada que esteja a até 1m de distância da sua posição. Essa troca não provoca ataques reativos e ambos recebem vantagem na próxima jogada de esquiva/defesa que realizarem."}, {"n": "Defletir Projéteis", "t": "[Reação]", "d": "Desde que você esteja empunhando uma arma corpo à corpo, ao ser alvo de um ataque à distância realizado à partir de uma arma de fogo, arremessável ou à distância, você pode realizar um Ataque Reativo contra o projétil. Se o resultado da sua rolagem for superior ao da rolagem inimiga, você não recebe nenhum dano, interrompendo o curso do projétil ou destruindo-o no processo. Se falhar no Ataque Reativo, você ainda pode realizar uma jogada de esquiva ou defesa normalmente."}], "À Distância": [{"n": "Rajada de Tiros", "t": "Ação", "d": "Ao invés de atacar diretamente um alvo, você pode consumir 2 P.A e 10 munições para disparar uma rajada de tiros e cobrir uma área em cone com um alcance igual à metade do alcance ideal da arma utilizada. Você ainda rola uma jogada de ataque normalmente, mas os inimigos dentro da área devem fazer um teste de resistência de Agilidade ao invés de uma jogada de esquiva. A rajada ainda causa metade do dano em alvos que forem bem sucedidos no teste. Apenas algumas armas específicas possuem esse recurso. A jogada de ataque feita dessa forma não pode atingir um acerto crítico."}, {"n": "Aguçado", "t": "Passiva", "d": "Você pode mirar sua arma à distância sem consumir nenhum ponto de ação."}, {"n": "Mãos Leves", "t": "Passiva", "d": "Você pode recarregar sua arma de fogo sem consumir nenhum ponto de ação."}, {"n": "Disparo Acelerado", "t": "Passiva", "d": "Uma vez por rodada, ao atirar em um inimigo com uma arma arremessável ou à distância, você pode realizar um novo disparo contra um alvo adicional que esteja dentro do alcance da arma, sem consumir nenhum ponto de ação adicional no processo."}, {"n": "Proximidade", "t": "Passiva", "d": "Você não recebe desvantagens por realizar disparos com armas à distância de categoria Leve e Média feitos abaixo de 2m. Adicionalmente, seus oponentes não recebem vantagem em jogadas de esquiva ao serem alvos desses mesmos disparos."}, {"n": "Atirador de Elite", "t": "Passiva", "d": "Seu primeiro ataque com uma arma à distância em um combate recebe vantagem."}, {"n": "Tiro de Sorte", "t": "Passiva", "d": "Quando você tirar uma falha crítica em uma jogada de ataque com uma arma à distância, você pode rolar o dado novamente. Essa característica pode ser utilizada duas vezes por descanso longo."}, {"n": "Olhos de Águia", "t": "Passiva", "d": "Declarando de forma prévia, você pode conceder vantagem a si mesmo quando realiza uma jogada de ataque com uma arma arremessável ou à distância.  Essa característica pode ser utilizada duas vezes por descanso longo."}, {"n": "Sangue Frio", "t": "Passiva", "d": "Você não recebe nenhuma desvantagem por disparar uma arma de fogo ou à distância em seu alcance máximo."}, {"n": "Oportuno", "t": "Passiva", "d": "Quando um alvo entra ou sai do alcance da sua arma à distância, você pode fazer um Ataque Reativo."}, {"n": "Reposicionamento", "t": "Passiva", "d": "Uma vez por rodada, ao acertar uma jogada de ataque com uma arma à distância ou arremessável, você pode se mover uma quantidade de metros equivalente 1 + seu atributo de Agilidade. Esse movimento não provoca ataques reativos e não é descontado da quantidade de metros que você pode se mover por rodada."}, {"n": "Disparo de Desarme", "t": "Ação", "d": "Uma vez por rodada, ao acertar um ataque com uma arma à distância ou arremessável em um oponente, você pode fazer um segundo disparo como parte do mesmo ataque, que ainda consome a munição mas mira em um objeto ou arma que esteja na mão do seu alvo. O segundo disparo ainda precisa ser rolado, mas não causa nenhum dano e a criatura alvejada deve fazer um teste de resistência de agilidade ao invés de uma jogada de esquiva. Caso o resultado do seu ataque seja superior ao teste, a criatura deixará o item ou objeto em sua mão cair no chão."}, {"n": "Disparo Perfurante", "t": "Passiva", "d": "Você reconhece os pontos fracos do corpo, sendo capaz de disparar em posições que sempre atravessam o alvo. Quando acertar uma jogada de ataque contra um alvo com uma arma marcial à distância de categoria pesada ou uma de fogo, o projétil pode acertar uma segunda criatura que esteja na mesma linha de disparo do primeiro alvo. A segunda criatura ainda pode fazer uma jogada de esquiva, e caso ela falhe, sofrerá apenas metade do dano base do ataque."}, {"n": "Disparo Atordoante", "t": "Passiva", "d": "O primeiro Ataque com Arma à Distância que você acertar no seu turno reduz o deslocamento do alvo atingido em um valor igual ao seu atributo de Agilidade em metros até o final do próximo turno dele."}, {"n": "Mira Perfeita", "t": "Passiva", "d": "Você não recebe nenhuma desvantagem ao realizar ataques com armas à distância contra alvos sob a condição de Caído."}]};
const MAESTRIAS={"Revestimento": [{"n": "Reforço Defensivo", "t": "Passiva", "d": "Você adquire a capacidade de fazer a energia psíquica fluir defensivamente pelo seu corpo, aumentando a resistência da sua pele. Uma vez por rodada, ao sofrer dano, você consumir fluxo para reduzir o dano levado em um valor igual a 1 + seu atributo de Psique. Essa característica não consome nenhum P.A e o fluxo consumido é equivalente ao dano reduzido."}, {"n": "Resistência", "t": "Passiva", "d": "Passivamente, suas reservas de energia psíquica passam a circular pelo seu corpo, infiltrando seus músculos e tecidos, lhe concedendo resistência à todo dano causado por fontes desprovidas de Fluxo [incluindo ataques desarmados feitos sem um Eco de Revestimento e armas comuns que não façam parte de um Eco de Vínculo]."}, {"n": "Absorção", "t": "Reação", "d": "Ao ser alvo de um ataque, você pode consumir 1 Ponto de Ação para ampliar sua defesa, reduzindo o dano levado pela metade. Essa habilidade pode ser utilizada 2 vezes por Descanso Completo. Caso seja utilizada para reduzir o dano de um acerto crítico, o dano causado pelo d12 adicional não é reduzido, mas você não sofre nenhum efeito que possa desencadear em um ferimento crítico."}, {"n": "Queda Suave", "t": "Passiva", "d": "Passivamente, uma bolha de fluxo envolve-se em torno do seu corpo sempre que você despenca de um local alto, tornando-o imune a danos de queda."}, {"n": "Movimentação Fluída", "t": "Passiva", "d": "Passivamente, o fluxo flui pelo seu corpo sempre que você precisa se esforçar para se movimentar, fazendo com que seu deslocamento não sofra nenhuma redução ao Nadar, Escalar ou Rastejar."}, {"n": "Impulso", "t": "Passiva", "d": "Você se torna capaz de concentrar fluxo na sola dos seus pés, liberando-o como um pequeno propulsor. Uma vez por rodada, ao realizar a ação de saltar/pular, você pode consumir Fluxo para aumentar a distância percorrida em um valor igual ao seu atributo de Psique em metros. A quantidade de Fluxo consumido é igual à distância aprimorada. Isso não aumenta a quantidade de deslocamento gasta para saltar/pular."}, {"n": "Celeridade", "t": "Passiva", "d": "Concentra energia nos músculos das pernas, aprimorando seu movimento. Uma vez por rodada, ao utilizar a ação de deslocamento pela primeira vez, você pode consumir Fluxo para se mover uma quantidade de metros adicionais igual ao seu atributo de Psique. A quantidade de Fluxo consumido é igual ao deslocamento adicional obtido."}, {"n": "Dopagem Psíquica", "t": "Passiva", "d": "Aumenta a circulação de Fluxo no cérebro, aprimorando seus reflexos. Passivamente você recebe um bônus de +1 em suas jogadas de esquiva e defesa. Esse bônus se torna +2 a partir do nível 7 e +3 a partir do nível 13. Esse bônus não acumula com habilidades psíquicas e outras especializações que concedam bônus de esquiva ou defesa direta ou indiretamente."}, {"n": "Impacto", "t": "Passiva", "d": "Uma vez por rodada, ao acertar um ataque desarmado em um oponente, você pode consumir Fluxo para liberar uma onda de energia a partir do ataque, arremessando seu oponente em linha reta na direção do golpe, em uma quantidade de metros igual ao 1 + seu atributo de Psique. Se o alvo atingir um construto no caminho, ele e a estrutura sofrerão dano contundente equivalente aos metros percorridos. A quantidade de Fluxo consumida também é igual ao atributo de Psique."}, {"n": "Liberação Crítica", "t": "Passiva", "d": "Ao atingir um acerto crítico em uma rolagem de ataque desarmado ou com uma arma corpo a corpo, você pode rolar 1d12 adicional e somar o resultado ao valor do dano causado."}, {"n": "Negação Crítica", "t": "Passiva", "d": "Uma vez por rodada, ao sofrer um acerto crítico em um ataque, você pode tratar o golpe como um acerto normal, não sofrendo nenhum dano adicional proveniente do d12 extra e não sofrendo nenhum ferimento crítico no processo. O atacante também não recebe nenhum benefício que ele originalmente teria por atingir um acerto crítico. Essa habilidade pode ser usada uma vez por descanso completo."}, {"n": "Moldar Fluxo", "t": "Passiva", "d": "Você aprende a moldar o fluxo em torno dos seus ataques desarmados, criando deformações de energia capazes de alterar as propriedades dos seus golpes. Sempre que fizer uma jogada de ataque desarmado revestida com fluxo, você pode escolher se o dano total do golpe será contundente, perfurante ou cortante."}, {"n": "Esforço Máximo", "t": "Passiva", "d": "Ao ser atingido por um ataque ou habilidade que causaria dano o suficiente para te reduzir a 0 PV, você pode consumir uma quantidade de Fluxo igual ao dano que te nocautearia para permanecer consciente e com 1 PV."}, {"n": "Atadura Psíquica", "t": "Ação", "d": "Consumindo 2 pontos de ação no seu turno, você pode infiltrar determinados ferimentos críticos com Fluxo, neutralizando temporariamente seus efeitos. Uma atadura psíquica permanece por uma quantidade de horas iguais à metade do seu atributo de Psique, e não pode ser refeita após exceder esse período. O custo de Fluxo varia de acordo com cada ferimento:\n\n1. Ferimentos entre as rolagens 2 e 7: custam 5 de Fluxo\n\n2. Ferimentos entre as rolagens 8 e 15: custam 10 de Fluxo\n\n3. Ferimentos entre as rolagens 16 e 24: custam 15 de Fluxo\n\n4. Ferimentos que não podem ser neutralizados: Hemorragia interna, ferimentos de membros/órgãos esmagados, decepados, arrancados ou destroçados, traumatismo craniano, lesão cerebral e lesão na coluna."}], "Manipulação": [{"n": "Canalização Rápida", "t": "Passiva", "d": "Uma vez por rodada, você pode reduzir o custo em Pontos de Ação de uma habilidade psíquica em -1 (mínimo 0)."}, {"n": "Precisão Psíquica", "t": "Passiva", "d": "Declarando de forma prévia, você pode conceder vantagem a si mesmo quando realiza uma jogada de ataque com uma habilidade psíquica ou rola o seu nível de dificuldade. Essa característica pode ser utilizada duas vezes por descanso completo."}, {"n": "Recuperação Crítica", "t": "Passiva", "d": "Depois de atingir um acerto crítico em uma jogada de ataque com uma Habilidade Psíquica, você restaura seu limite de Fluxo em um valor equivalente ao dano total causado."}, {"n": "Restauração v1", "t": "Ação", "d": "Você pode consumir 1 Ponto de Ação para se concentrar em reduzir sua carga cerebral, restaurando seu Limite de Fluxo em um valor igual ao seu atributo de Psique x4. Essa característica pode ser utilizada uma quantidade de vezes igual à metade do seu atributo de Psique por descanso completo."}, {"n": "Restauração v2", "t": "Passiva", "d": "Desde que você possua a versão anterior, o limite de usos aumenta, possibilitando que você utilize uma quantidade de vezes igual ao seu atributo de Psique."}, {"n": "Limite Expandido (pode ser adquirida até 3x)", "t": "Passiva", "d": "Seu Limite de Fluxo aumenta em 40 pontos."}, {"n": "Runa Adicional (pode ser adquirida até 3x)", "t": "Passiva", "d": "Você adquire uma Runa Adicional sempre que escolhe essa maestria."}, {"n": "Foco Absoluto", "t": "Passiva", "d": "Você pode ativar uma habilidade psíquica sem consumir nenhum Fluxo na ativação. Essa maestria pode ser utilizada duas vezes por descanso completo. O efeito não ao utilizar um Sigilo."}, {"n": "Fluxo Eficiente", "t": "Passiva", "d": "O consumo passivo de Fluxo de todas as suas habilidades de Duração Prolongada é reduzido em um valor igual à 1 + metade do seu atributo de Psique."}, {"n": "Concentração", "t": "Passiva", "d": "Uma única habilidade de duração prolongada à sua escolha entre o seu Estigma ou suas runas deixa de consumir fluxo por rodada ao ser ativada. Ela pode ser mantida sem consumo por uma quantidade de horas equivalente ao seu atributo de Psique por dia. Após esse período, ela voltará a consumir normalmente."}, {"n": "Fluxo Reativo", "t": "Passiva", "d": "Na primeira vez que você ativar seu estigma ou uma runa de forma reativa em uma rodada, nenhum ponto de ação será consumido. Essa habilidade só é válida caso o custo de pontos de ação da habilidade em questão seja de 2 P.A ou menos. Essa maestria pode ser utilizada uma quantidade de vezes igual à metade do seu atributo de Psique. O uso não inclui habilidades que tenham reduzido o custo a partir de Canalização Rápida."}, {"n": "Otimização", "t": "Passiva", "d": "Você pode reduzir o custo base de uma habilidade psíquica pela metade no momento em que ela é ativada. Essa característica pode ser utilizada uma quantidade de vezes igual à metade do seu atributo de Psique por descanso completo."}, {"n": "Alcance Amplificado", "t": "Passiva", "d": "Suas habilidades psíquica de alvo único/múltiplos alvos que tenham um alcance diferente de corpo a corpo recebem um bônus de alcance igual ao seu atributo de Psique em metros."}, {"n": "Área Amplificada", "t": "Passiva", "d": "Suas habilidades em área recebem um bônus de largura/comprimento/raio iguais à metade do seu atributo de psique em metros."}, {"n": "Refinamento", "t": "Passiva", "d": "Ao utilizar uma habilidade que cause danos em área, você pode escolher quais alvos dentro da região sofrerão dano e quais não serão afetados pela habilidade, permitindo que você utilize a habilidade sem prejudicar seus aliados."}, {"n": "Vínculo Psíquico", "t": "Passiva", "d": "Ao escolher essa maestria, você ganha acesso ao Eco de Vínculo."}], "Detecção": [{"n": "Revelação", "t": "Passiva", "d": "Permite que a Psique Expandida revele fontes ocultas por um Eco de Ocultação. Nesse caso, ambos devem realizar uma rolagem com seus atributos de Psique. Se o rastreador conseguir um resultado igual ou superior, saberá da localização do alvo, caso contrário, o alvo oculto não será revelado. Esse teste deve ser continuamente repetido no início de cada uma das rodadas."}, {"n": "Medidor de Runas", "t": "Passiva", "d": "Permite identificar automaticamente a quantidade de Runas gravadas no Estigma de um alvo dentro do alcance, sem a necessidade de vê-los. Caso um alvo esteja utilizando um Eco de Ocultação, ambos devem realizar uma rolagem com seus atributos de Psique. Se o rastreador conseguir um resultado igual ou superior, saberá da quantidade, caso contrário, as runas ocultas não serão revelado."}, {"n": "Leitura de Fluxo", "t": "Passiva", "d": "Lê através do limite de Fluxo de uma criatura. O mestre deve lhe informar apenas o percentual (x%) de quanta energia um alvo utilizou em relação ao seu Limite Máximo (100%), nunca passando valores numéricos exatos."}, {"n": "Rastreador Preciso", "t": "Passiva", "d": "Permite diferenciar a assinatura individual gravada em cada fonte ou rastro de Fluxo, revelando se ele pertence a um Médium, Onírico ou Artefato. Adicionalmente, identifica se o Fluxo pertence a alguém conhecido (e sua identidade) ou não."}, {"n": "Análise Residual", "t": "Passiva", "d": "Detecta resíduos deixados pelo uso de habilidades psíquicas, determinando a direção exata pela qual o rastro de Fluxo seguiu, como se fosse uma trilha visível para seus sentidos."}, {"n": "Datação de Fluxo", "t": "Passiva", "d": "Desde que você possua a habilidade anterior, determina com precisão há quanto tempo um rastro de fluxo foi deixado."}, {"n": "Reconstrução de Rastro", "t": "Passiva", "d": "Você consegue perceber quando um rastro de Fluxo foi escondido por um Eco de Ocultação. Você pode fazer uma rolagem com seu atributo de Psique para tentar restaurá-la. Caso seu resultado seja igual superior ao resultado do alvo durante a ocultação, você obtém um sucesso."}, {"n": "Sinapse Acelerada", "t": "Passiva", "d": "Você recebe vantagem em jogadas de Iniciativa, permanecendo constantemente ligado no ambiente ao seu redor."}], "Ocultação": [{"n": "Ocultação Acelerada", "t": "Passiva", "d": "Sua habilidade básica de ocultação ganha a Propriedade de Reação."}, {"n": "Runas Falsas", "t": "Ação", "d": "Consumindo 1 Ponto de Ação no seu turno, você pode falsificar a quantidade de Runas gravadas no seu Estigma, aumentando ou reduzindo livremente a quantidade de runas visíveis dentre todas as que você possui, escondendo o seu verdadeiro poder."}, {"n": "Fluxo Nulificado", "t": "Passiva", "d": "Torna seu limite de fluxo difícil de se medir, mesmo para aqueles com um Eco de Detecção, tornando impossível que uma criatura saiba o seu percentual restante de energia psíquica."}, {"n": "Assinatura Replicada", "t": "Ação", "d": "Permite que você copie a assinatura individual do Fluxo de uma criatura que você tenha observado pessoalmente por pelo menos 1 minuto. Uma vez que realize a cópia, você pode sobrepor a sua assinatura pessoal pela réplica utilizando 1 Ponto de Ação, escondendo sua identidade energética. Isso afeta a presença das suas reservas de Fluxo internas e os rastros deixados pelas suas habilidades psíquicas. Um oponente com a Habilidade de Rastreamento: Rastreador Preciso pode realizar uma rolagem de Psique para tentar ver através da réplica. Nesse caso, você também deve fazer a rolagem, obtendo um sucesso caso seu resultado seja superior."}, {"n": "Sopro Vazio", "t": "Passiva", "d": "Você pode ativar habilidades psíquicas sem expor sua presença ou deixar rastros de Fluxo. O nível de dificuldade necessário para que uma criatura consiga reconstruir o rastro deve ser rolado por você utilizando seu atributo de Psique."}, {"n": "Sombra Mental", "t": "Passiva", "d": "Criaturas que tentem ler seu alinhamento ou sua mente falham automaticamente."}, {"n": "Zona Morta", "t": "Ação", "d": "Você pode consumir 2 pontos de ação no seu turno para expandir temporariamente sua ocultação, criando uma aura em forma de esfera, com um raio igual ao seu atributo de Psique. Qualquer criatura à sua escolha dentro do alcance recebe todos os benefícios concedidos pelo seu Eco de Ocultação. Essa aura consome 1 de Fluxo a cada 10 minutos ativa."}, {"n": "Silêncio Psíquico", "t": "Passiva", "d": "Você recebe vantagem em todos os testes feitos para se Esconder."}, {"n": "Inércia", "t": "Passiva", "d": "Se você permanecer por uma rodada inteira sem se mover ou ativar habilidades psíquicas, Ecos de Detecção não podem revelar sua localização."}]};

      'Esses PV absorvem todo o dano sofrido enquanto não zerarem; ao zerar, o Sigilo se desfaz.',
      'Enquanto ativo, +2 em Psique e na Afinidade — e o bônus se estende a qualquer função que conceda aumento de +1 a +3 a um valor numérico (dano, atributo, esquiva, etc.).'],
  col:'Depois de desativar, você não pode usar Estigma nem Runas até um Descanso Completo.',
  op:[{id:'runas',l:'Uso das Runas',it:[
    {l:'Manter as Runas originais do Estigma, fortalecidas'},
    {l:'Substituir por Runas Temporárias gravadas no Sigilo'}]}],
  opNota:'Com Runas Temporárias, a habilidade original do Estigma não pode ser usada e a quantidade de runas é a mesma de fora do Sigilo. Não é possível usar runas do Sigilo e do Estigma ao mesmo tempo.'},

 territorio:{n:'Território',pa:2,fx:100,
  dur:'1 minuto, ou até você ser nocauteado ou o Fluxo atingir o Limite',
  conceito:'Manifestação externa da Paisagem Mental: isola uma área que reflete o ambiente da sua mente.',
  ef:['Surge um Totem Psíquico acima de você, ligando a Paisagem à sua mente; a forma é à sua escolha.',
      'Ao sofrer dano, o totem gasta Fluxo igual ao dano. A 100% do limite, o Território se desfaz — roubar ou absorver Fluxo não restaura esse gasto.',
      'Dentro do Território, as habilidades do Estigma e das Runas têm custo de Fluxo zerado (Cura ainda consome).',
      'Alcance amplificado: corpo a corpo, toque e à distância podem se manifestar de qualquer ponto da esfera; áreas em esfera afetam todo o interior de uma vez.',
      'Criaturas com Fluxo na área são puxadas para dentro e retornam à posição original quando encerra.',
      'Território formado dentro de uma Ruptura a substitui. Dois Territórios na mesma área misturam as Paisagens.',
      'Ninguém sai voluntariamente até você desfazer — teleporte e translocação para escapar ficam bloqueados.'],
  col:'Depois de desativar, sem Estigma nem Runas até um Descanso Completo.',
  raio:5},

 invocacao:{n:'Invocação',pa:2,
  dur:'até os PV da invocação zerarem ou você desativar',
  conceito:'Materializa o "eu interior" com corpo próprio, aparência e consciência.',
  ef:['Criatura separada, com ficha própria de nível igual ao seu: mesmos pontos de aprimoramento, P.A e limite de atributo, com acesso a Ecos e Especializações.',
      'Tem o mesmo Estigma que você, mas com metade das runas. Pode ter runas próprias e não tem Sigilo.',
      'Metade do seu Limite de Fluxo, aumentável por Ecos.',
      'Sem Origem; mesma Afinidade que você.',
      'Não recupera PV nem pode ser curada. Ao zerar, se desfaz e não é reconjurada até um Descanso Completo.',
      'Surge ao seu lado e permanece mesmo se você dormir ou desmaiar.',
      'Recupera PV ao descansar ou enquanto desativada (Psique a cada 10 minutos) e recupera Fluxo passivamente.',
      'Vínculo mental telepático ilimitado, age por instruções ou de forma autônoma, e é imune a controle mental.'],
  col:'Enquanto ativa, o seu Limite de Fluxo é reduzido pelo valor gasto para conjurá-la.',
  op:[{id:'tam',l:'Tamanho da invocação',it:[
    {l:'Pequena — 50 de Fluxo, -1 PV por nível',fx:50,pv:-1},
    {l:'Média — 60 de Fluxo, sem alteração',fx:60,pv:0},
    {l:'Grande — 70 de Fluxo, +1 PV por nível',fx:70,pv:1}]}]},

 maximizacao:{n:'Maximização',pa:1,
  dur:'até o início do próximo turno, ou até ativar uma habilidade psíquica',
  conceito:'Leva o Estigma e as Runas ao potencial máximo por um instante; o corpo se cobre de marcas de Fluxo.',
  ef:['A próxima habilidade do Estigma ou de uma Runa não consome Fluxo.',
      'Escolha um dos efeitos abaixo ao ativar.'],
  col:'O Estigma ou Runa usado fica esgotado até um Descanso Completo, nem fora do Sigilo. Usos além do primeiro por dia exigem 1d12: 6 ou menos falha e ainda gasta o Fluxo; acima de 6 ativa, mas você sofre 4d12 de [In]Sanidade.',
  op:[{id:'ef',l:'Efeito da maximização',it:[
    {l:'Acerto Garantido — 40 de Fluxo',fx:40,d:'O ataque psíquico acerta automaticamente, com dano máximo pela diferença, ignorando resistências, escudos e imunidades. Não pode ser neutralizado, absorvido nem reduzido.'},
    {l:'Falha Garantida — 40 de Fluxo',fx:40,d:'O alvo falha automaticamente no primeiro teste de resistência. Se a habilidade aplica condição de nível 3, só concede desvantagem.'},
    {l:'Proteção Completa — 40 de Fluxo',fx:40,d:'Se a habilidade concede escudo, resistência, armadura ou redução, os afetados não sofrem dano algum na primeira vez que forem atingidos.'},
    {l:'Cura Completa — 100 de Fluxo',fx:100,d:'Dobra os PV curados em todos os alvos e levanta criaturas a 0 PV inconscientes, não estabilizadas ou mortas há menos de 10 minutos.'}]}]},

 sobreposicao:{n:'Sobreposição',pa:1,fx:15,
  dur:'até você voltar à personalidade principal',
  conceito:'Materializa o "alter ego": a contraparte interna, geralmente o oposto do que o Médium aparenta.',
  ef:['Substitui completamente a ficha por uma segunda personalidade.',
      'Cria-se uma segunda ficha de nível equivalente e mesmos recursos: mesma Origem; atributos, especializações e ecos podem diferir; a Afinidade pode mudar.',
      'Estigma novo, com forma, conceito e especificação diferentes — a função mecânica pode ser nova ou a mesma reidealizada. Runas adaptadas ao novo Estigma. Sem Sigilo.',
      'As duas fichas compartilham o mesmo Limite Base de Fluxo: gasto numa afeta a outra.',
      'Ambas sofrem dano simultâneo equivalente. Ferido e Gravemente Ferido são calculados individualmente, mas ferimentos críticos, condições e enfraquecimentos são compartilhados.',
      'Os traços de personalidade das duas fichas devem ser opostos.'],
  col:'Nenhum efeito colateral de uso. A única desvantagem: se uma das fichas morrer, a outra morre também.'}
};
const SIGILO_NV = 12;

</script>
<script>
/* ============================================================
   Estado do personagem
   ============================================================ */
const half = n => Math.floor(n/2);
const uid  = () => 'h'+Math.random().toString(36).slice(2,9);
const ATR  = ['corpo','agilidade','forca','carisma','instinto','mente'];
const ATRN = {corpo:'Corpo',agilidade:'Agilidade',forca:'Força',carisma:'Carisma',instinto:'Instinto',mente:'Mente'};
const ATRS = {corpo:'COR',agilidade:'AGI',forca:'FOR',carisma:'CAR',instinto:'INS',mente:'MEN'};
/* nome da Afinidade (como vem do banco) -> chave do atributo */
const AF2ATR = {'Corpo':'corpo','Força':'forca','Agilidade':'agilidade','Carisma':'carisma','Instinto':'instinto','Mente':'mente'};
const CUSTO_NV   = [0,1,3,6];   // custo cumulativo de nível de Especialização/Eco
const CUSTO_NV_V = [0,1,2,4];   // idem, com a redução do Veratem
const ESP = {desarmado:{n:'Combate Desarmado',cat:'Desarmado',lista:'Técnicas de Combate'},
             cac:{n:'Armas Corpo a Corpo',cat:'Corpo a Corpo',lista:'Movimentos Especiais'},
             dist:{n:'Armas à Distância',cat:'À Distância',lista:'Manobras de Disparo'}};
const ECO = {revestimento:{n:'Revestimento',lista:'Habilidades de Reforço'},
             manipulacao:{n:'Manipulação',lista:'Maestrias Psíquicas'},
             deteccao:{n:'Detecção',lista:'Habilidades de Rastreamento'},
             ocultacao:{n:'Ocultação',lista:'Habilidades Furtivas'}};

function novaHab(tipo){
  return {k:uid(),tipo:tipo,nome:'',desc:'',comb:false,fns:[{id:'',op:{},ap:1}],
    mira:'unico',area:'esfera',tam:'p',alc:'pessoal',dur:'inst',
    verbal:false,gestual:false,passiva:false,modo:'ataque',combOpt:'unico',
    testeFim:false,attr:'',marioMult:false};
}
function novaFicha(){
  const est = {arqs:[],tipoDano:'Psíquico',trade:0,habs:[novaHab('estigma')],sel:null};
  est.sel = est.habs[0].k;
  return {
    nome:'',jogador:'',nivel:7,origem:'',afinidade:'',
    attrs:{corpo:0,agilidade:0,forca:0,carisma:0,instinto:0,mente:0},
    pvAtual:null,fluxoGasto:0,insanidade:0,escudo:0,reforco:0,fluxoTemp:0,
    esp:{desarmado:{nv:0,tal:[]},cac:{nv:0,tal:[],prof:[]},dist:{nv:0,tal:[],prof:[]}},
    ecos:{revestimento:{nv:0,hab:[]},manipulacao:{nv:0,hab:[]},deteccao:{nv:0,hab:[]},ocultacao:{nv:0,hab:[]}},
    veratemEco:'',armas:[{n:'',v:false},{n:'',v:false},{n:'',v:false},{n:'',v:false},{n:'',v:false}],
    subs:{},usos:{},sigilo:{nome:'',v:'',op:{},ativo:false},
    estigma:est,historia:'',inventario:'',notas:'',tab:'personagem'
  };
}
let CH = novaFicha();

/* ============================================================
   Motor de valores derivados — segue o Guia de Referência
   ============================================================ */
function temTalento(nome){
  return Object.keys(ESP).some(k=>(CH.esp[k].tal||[]).some(t=>t&&t.startsWith(nome)));
}
function contaMaestria(eco,nome){
  return (CH.ecos[eco].hab||[]).filter(t=>t&&t.startsWith(nome)).length;
}
function custoEsp(k){
  const s=CH.esp[k], perm=s.nv*2;
  const gratis = CH.origem==='Mercenário' ? subSel('gratis') : [];
  const esc=(s.tal||[]).filter(t=>t && !gratis.includes(t)).length;
  return CUSTO_NV[s.nv] + Math.max(0,esc-perm)*2;
}
function custoEco(k){
  const s=CH.ecos[k], perm=s.nv*2, esc=(s.hab||[]).filter(Boolean).length;
  const tab = (CH.origem==='Veratem' && CH.veratemEco===k) ? CUSTO_NV_V : CUSTO_NV;
  return tab[s.nv] + Math.max(0,esc-perm)*2;
}

function mercLim(base){ return base+(CH.nivel>=6?1:0)+(CH.nivel>=11?1:0)+(CH.nivel>=16?1:0); }
function limSub(s,psi){
  if(s.ref) return Infinity;
  if(typeof s.lim==='number') return s.lim;
  if(s.lim==='psique')  return psi;
  if(s.lim==='1+half')  return 1+half(psi);
  if(s.lim==='half')    return half(psi);
  if(s.lim==='merc4')   return mercLim(1);
  if(s.lim==='merc3')   return mercLim(0);
  return 0;
}
function limUsos(f,psi){ return f==='1'?1 : f==='half'?half(psi) : f==='psique'?psi : 1+half(psi); }
function subsDaOrigem(){ return (SUBS[CH.origem]||[]).filter(s=>CH.nivel>=s.nv); }
function subSel(id){
  const sb=(SUBS[CH.origem]||[]).find(x=>x.id===id);
  if(sb && sb.especial==='veratemEco') return CH.veratemEco?[CH.veratemEco]:[];
  return CH.subs[id]||[];
}
function listaSub(s){
  if(s.fonte==='talentos'){
    const out=[];
    Object.keys(TALENTOS).forEach(c=>TALENTOS[c].forEach(t=>out.push({n:t.n,cat:c,c:t.t,d:t.d})));
    return out;
  }
  return s.lista||[];
}

function D(){
  const p = PROG[CH.nivel], a = CH.attrs, af = CH.afinidade;
  const afd = AFIN[af] || {hp:0,dmg:0,desl:1,carga:1,esq:0,atk:0,eco:0,txt:''};
  /* Sigilo de Transformação ativo: +2 em Psique e na Afinidade */
  const sigLib   = CH.nivel>=SIGILO_NV;
  const sigAtivo = sigLib && CH.sigilo.ativo && CH.sigilo.v==='transformacao';
  const bonusSig = sigAtivo ? 2 : 0;
  const psique   = p.limAtr + bonusSig;
  const aE = Object.assign({},a);
  if(bonusSig && AF2ATR[af]) aE[AF2ATR[af]] = (a[AF2ATR[af]]||0) + bonusSig;

  /* mutações do Mestiço com efeito numérico */
  const mut = subSel('mut');
  const mEsq = mut.includes('Antena')?1:0;
  const mDef = mut.includes('Pele Escamosa')?1:0;
  const mDesl= mut.includes('Pernas Superdesenvolvidas')?3:0;
  const mRed = mut.includes('Pele Endurecida')?1:0;

  /* pontos de atributo (sempre pelos valores brutos) */
  const gastoAtr = ATR.reduce((s,k)=>s+(a[k]||0),0);

  /* pontos de aprimoramento */
  const gEsp = Object.keys(ESP).reduce((s,k)=>s+custoEsp(k),0);
  const gEco = Object.keys(ECO).reduce((s,k)=>s+custoEco(k),0);
  const bonusEco = (af==='Mente' ? 3 : 0);
  const usadosApr = gEsp + Math.max(0, gEco - bonusEco);
  const aprSobra  = p.apr - usadosApr;
  const ecoSobra  = Math.max(0, bonusEco - gEco);

  /* maestrias que mexem em recursos globais */
  const limExp  = contaMaestria('manipulacao','Limite Expandido');
  const runaAd  = contaMaestria('manipulacao','Runa Adicional');
  const temVinc = contaMaestria('manipulacao','Vínculo Psíquico')>0;
  const nvVinculo = temVinc ? CH.ecos.manipulacao.nv : 0;

  /* Veratem — mestre no eco escolhido */
  const veratemMestre = CH.origem==='Veratem' && CH.veratemEco && CH.ecos[CH.veratemEco].nv===3;

  /* PV */
  const pvTotal = CH.nivel<1 ? 0 :
    Math.floor((10+aE.corpo) + (CH.nivel-1)*(5+half(aE.corpo)) + CH.nivel*afd.hp);
  const pvAtual = (CH.pvAtual==null ? pvTotal : Math.min(CH.pvAtual,pvTotal));
  const sit = pvAtual<=0 ? 'INCONSCIENTE'
            : pvAtual <= pvTotal*0.25 ? 'GRAVEMENTE FERIDO'
            : pvAtual <= pvTotal*0.5  ? 'FERIDO' : 'NORMAL';
  const penFerido = sit==='GRAVEMENTE FERIDO' ? -4 : sit==='FERIDO' ? -2 : 0;
  const ignoraFerido = af==='Corpo';

  /* defesas */
  const guarda = temTalento('Em Guarda') ? p.guarda : 0;
  const inic   = Math.max(aE.agilidade+half(aE.instinto), aE.instinto+half(aE.agilidade));
  const esquiva= inic + afd.esq + guarda + mEsq;
  const defesa = aE.forca + half(Math.max(aE.agilidade,aE.instinto)) + guarda + mDef;

  /* ataque psíquico / ND */
  const atqPsi = psique + half(aE[AF2ATR[af]]||0) + afd.atk;

  /* combate desarmado */
  const versatil = (CH.esp.desarmado.tal||[]).some(t=>t&&t.startsWith('Versátil'));
  const atrDes   = versatil ? Math.max(aE.forca,aE.agilidade) : aE.forca;
  const atqDes   = atrDes + p.bonusEsp;
  const danoDes  = CH.esp.desarmado.nv + half(atrDes);

  /* ecos */
  const revBonus = CH.ecos.revestimento.nv>0
      ? (veratemMestre && CH.veratemEco==='revestimento' && CH.ecos.revestimento.nv===3 ? 4 : CH.ecos.revestimento.nv) : 0;
  const revTeste = CH.ecos.revestimento.nv>0 ? half(psique) : 0;
  const manBonus = CH.ecos.manipulacao.nv>0
      ? (veratemMestre && CH.veratemEco==='manipulacao' && CH.ecos.manipulacao.nv===3 ? 4 : CH.ecos.manipulacao.nv) : 0;
  const detMult  = CH.ecos.deteccao.nv>0
      ? (veratemMestre && CH.veratemEco==='deteccao' && CH.ecos.deteccao.nv===3 ? 10 : CH.ecos.deteccao.nv*2+1) : 0;
  const detAlc   = psique * detMult;

  /* fluxo */
  const descPass = CH.estigma.habs.filter(h=>h.passiva).reduce((s,h)=>s+custo(h).total,0);
  const limFluxo = p.fluxo + 40*limExp;
  const fluxoDisp= limFluxo - descPass;
  const sobrecarga = Math.max(0, CH.fluxoGasto - fluxoDisp);

  /* runas e passivas */
  const runasDisp = p.runas + runaAd;
  const runasUso  = CH.estigma.habs.reduce((s,h)=>s+runasGastas(h),0) + (+CH.estigma.trade||0);
  const passLim   = 1 + half(psique);
  const passUso   = CH.estigma.habs.filter(h=>h.passiva).length;

  return {p,a,aE,af,afd,psique,sigLib,sigAtivo,bonusSig,mRed,mEsq,mDef,mDesl,
    gastoAtr, atrDisp:p.ptsAtr-gastoAtr, limAtr:p.limAtr,
    gEsp,gEco,bonusEco,usadosApr,aprSobra,ecoSobra,
    limExp,runaAd,temVinc,nvVinculo,veratemMestre,
    pvTotal,pvAtual,sit,penFerido,ignoraFerido,
    inic,esquiva,defesa,guarda,atqPsi,
    versatil,atrDes,atqDes,danoDes,
    revBonus,revTeste,manBonus,detAlc,detMult,
    limFluxo,fluxoDisp,descPass,sobrecarga,
    runasDisp,runasUso,passLim,passUso,
    desloc:10 + aE.agilidade*afd.desl + mDesl,
    levant:(120+50*aE.forca)*afd.carga,
    carga:(60+10*aE.forca)*afd.carga,
    detPassiva:3*aE.instinto, ndPassiva:6+aE.instinto, idiomas:1+half(aE.mente),
    insAcum:Math.ceil(sobrecarga/5),
    sigPV:(p.limAtr+2)*10, sigRaio:psique*5, sigInvFluxo:half(p.fluxo+40*limExp)
  };
}

/* ============================================================
   Armas
   ============================================================ */
function acharArma(n){ return ARMAS.find(x=>x.n===n); }
function alcanceArma(x){
  if(!x) return '—';
  const a=CH.attrs, al=x.alc||{};
  if(al.calc==='agi') return (al.base+2*a.agilidade)+' m';
  if(al.calc==='for') return (al.base+2*a.forca)+' m';
  if(al.calc==='maxAgiFor') return (al.base+2*Math.max(a.agilidade,a.forca))+' m';
  return al.txt || '—';
}
function proficiente(x){
  if(!x) return false;
  if(CH.origem==='Mercenário') return true;                       // Senhor da Guerra
  if(x.tipo==='Desarmado' || x.tipo==='Explosivos Arremessáveis') return true;
  if(x.tipo==='Corpo a Corpo') return (CH.esp.cac.prof||[]).includes(x.cat);
  if(x.tipo==='Marciais Arremessáveis' || x.tipo==='Armas à Distância') return CH.esp.dist.nv>=1;
  if(x.tipo==='Armas de Fogo') return CH.esp.dist.nv >= ({'Leve':1,'Média':2,'Pesada':3}[x.cat]||1);
  return false;
}
function atqArma(x){
  const d=D(), a=CH.attrs;
  if(!x) return {mod:0,base:'—'};
  if(x.tipo==='Desarmado') return {mod:d.atqDes,base:(d.versatil?'FOR/AGI':'FOR')+' + '+d.p.bonusEsp,prof:true};
  if(x.tipo==='Explosivos Arremessáveis') return {mod:a.agilidade,base:'AGI (ND do explosivo)',prof:true};
  const prof = proficiente(x);
  let attr=0, base='';
  if(x.tipo==='Corpo a Corpo'){
    if(x.cat==='Leve'){attr=a.agilidade;base='AGI'}
    else if(x.cat==='Média'){attr=Math.max(a.agilidade,a.forca);base='AGI ou FOR'}
    else {attr=a.forca;base='FOR'}
  } else if(x.tipo==='Marciais Arremessáveis'){
    if((x.alc||{}).calc==='for'){attr=a.forca;base='FOR'} else {attr=a.agilidade;base='AGI'}
  } else { attr=a.agilidade; base='AGI'; }
  const esp = (x.tipo==='Corpo a Corpo') ? CH.esp.cac.nv : CH.esp.dist.nv;
  const bonus = (esp>0 || CH.origem==='Mercenário') ? d.p.bonusEsp : 0;
  if(!prof) return {mod:0,base:'sem proficiência',prof:false};
  return {mod:attr+bonus,base:base+(bonus?' + '+bonus:''),prof:true,attr,bonus};
}
function danoArma(x,vinculada){
  const d=D();
  if(!x) return {txt:'—',comp:[]};
  const comp=[];
  if(x.tipo==='Desarmado'){
    comp.push({l:'Especialização (nível '+CH.esp.desarmado.nv+')',v:CH.esp.desarmado.nv});
    comp.push({l:'metade de '+(d.versatil?'FOR/AGI':'FOR'),v:half(d.atrDes)});
    const punho = CH.armas.some(w=>{const q=acharArma(w.n); return q&&(q.car||'').includes('Arma de Punho');});
    if(punho) comp.push({l:'Arma de Punho equipada',v:1});
    if(d.revBonus) comp.push({l:'Revestimento (golpe revestido)',v:d.revBonus});
    if(CH.afinidade==='Força') comp.push({l:'Afinidade Força',v:1});
  }else{
    if(typeof x.dano==='number') comp.push({l:'Dano base da arma',v:x.dano});
    else return {txt:String(x.dano||'—')+' '+(x.dtipo||''),comp:[]};
    const cc = x.tipo==='Corpo a Corpo' || x.tipo==='Marciais Arremessáveis';
    if(CH.afinidade==='Força' && cc) comp.push({l:'Afinidade Força',v:1});
    if(vinculada && d.nvVinculo) comp.push({l:'Eco de Vínculo (nível '+d.nvVinculo+')',v:d.nvVinculo});
  }
  const tot = comp.reduce((s,c)=>s+c.v,0);
  return {txt:tot+' '+(x.dtipo||''),tot,comp};
}

/* ============================================================
   Motor de custo do Estigma
   ============================================================ */
function fnPA(hab,i){
  const f = FN[hab.fns[i].id]; if(!f) return 0;
  let pa = f.pa;
  (f.op||[]).forEach(o=>{
    if(o.num) return;
    const it = o.it[hab.fns[i].op[o.id] ?? 0];
    if(it && it.pa!=null) pa = it.pa;
  });
  if(pa==null) pa = 0;
  if(f.id==='cura' && hab.fns[i].ap>=2) pa = 1;
  return pa;
}
function ignoraAlcance(hab){ return hab.fns.some(sf=>FN[sf.id]&&FN[sf.id].ig); }
const fazAtaque = r => r==='ataque'||r==='ambos';
const fazTeste  = r => r==='teste' ||r==='ambos';
function mostraCombOpt(hab){
  if(!hab.comb || hab.mira==='area') return false;
  const fs = hab.fns.map(sf=>FN[sf.id]).filter(Boolean);
  if(fs.length<2) return false;
  return fs.some(f=>f.dano) && fs.some(f=>f.cond||f.arq==='enfraquecimento');
}
function resolucao(hab){
  const fs = hab.fns.map(sf=>FN[sf.id]).filter(Boolean);
  if(!fs.length) return 'nenhuma';
  if(hab.mira==='area') return 'teste';
  if(mostraCombOpt(hab)) return hab.combOpt==='ataque_teste' ? 'ambos' : 'teste';
  if(fs.some(f=>f.ataque)) return 'ataque';
  if(fs.some(f=>f.t==='s')) return 'teste';
  if(fs.some(f=>f.t==='o')) return hab.modo==='teste'?'teste':'ataque';
  return 'nenhuma';
}
function attrsTeste(hab){
  const set=[];
  hab.fns.forEach(sf=>{const f=FN[sf.id]; if(f&&f.ta) f.ta.forEach(x=>{if(!set.includes(x))set.push(x)})});
  return set;
}
function runasGastas(hab){
  if(!hab.fns.some(sf=>sf.id)) return 0;
  let extra=0;
  hab.fns.forEach(sf=>{const f=FN[sf.id]; if(f&&f.ap) extra=Math.max(extra,(sf.ap||1)-1);});
  if(hab.marioMult && hab.fns.some(sf=>FN[sf.id]&&FN[sf.id].apRunas)) extra += 2;
  if(hab.tipo==='estigma') return extra;
  return (hab.comb?2:1) + extra;
}
function custo(hab){
  let base=0, pa=0, det=[];
  hab.fns.forEach((sf,i)=>{
    const f = FN[sf.id]; if(!f) return;
    let sub = f.b ?? 0, rot = [];
    if(f.b!=null) rot.push('base '+f.b);
    else if(f.bv && !(f.op||[]).length) rot.push(f.bv);
    (f.op||[]).forEach(o=>{
      if(o.num){
        const v = sf.op[o.id] ?? o.def;
        let m = o.mult || 1;
        if(f.calc==='cura')  m = (sf.ap>=3 ? 1 : 2);
        if(f.calc==='fluxo') m = 1;
        sub += v*m; rot.push(v+' × '+m);
      }else{
        const it = o.it[sf.op[o.id] ?? 0];
        if(it && it.c){ sub += it.c; rot.push((it.c>0?'+':'')+it.c+' '+o.l.toLowerCase()); }
      }
    });
    base += sub;
    det.push({n:f.n,v:sub,r:rot.join(' · ')});
    pa = Math.max(pa, fnPA(hab,i));
  });
  const baseBruta = base;
  if(hab.passiva) base = base*2;

  let mods=[]; const add=(l,v)=>{ if(v) mods.push({l,v}); };
  if(hab.mira==='multiplos') add('Múltiplos alvos',5);
  if(hab.mira==='area'){
    const ar = AREA[hab.area];
    add('Área — '+ar.l, ar.c);
    if(ar.tam) add('Tamanho — '+TAM[hab.tam].l.split(' —')[0], TAM[hab.tam].c);
  }
  if(!ignoraAlcance(hab)) add('Alcance — '+ALC[hab.alc].l, ALC[hab.alc].c);
  if(!hab.passiva) add('Duração — '+DUR[hab.dur].l, DUR[hab.dur].c);
  if(hab.testeFim && hab.dur==='prol' && fazTeste(resolucao(hab))) add('Teste no fim do turno',5);
  if(hab.comb && mostraCombOpt(hab) && hab.combOpt==='ataque_teste') add('Ataque + Teste separados',-3);
  if(!hab.passiva){
    if(hab.verbal)  add('Requisito Verbal',-1);
    if(hab.gestual) add('Requisito Gestual',-3);
  }
  const modSum = mods.reduce((s,m)=>s+m.v,0);
  let total = Math.max(0, base + modSum);
  const prol = (hab.dur==='prol' && !hab.passiva) ? 10 : 0;
  return {det,baseBruta,base,mods,modSum,total,pa:hab.passiva?0:pa,prol};
}

/* ============================================================
   Validação
   ============================================================ */
const LISTA = {al:{unico:'Alvo único',multiplos:'Múltiplos alvos',area:'Área'},
  ac:{pessoal:'Pessoal',corpo:'Corpo a corpo/Toque',curto:'Curto',medio:'Médio',longo:'Longo'},
  du:{inst:'Instantânea',inicio:'Até o início do próximo turno',fim:'Até o fim do próximo turno',prol:'Prolongada'},
  ar:{esfera:'Esfera',cubo:'Cubo',cilindro:'Cilindro',linha:'Linha',cone:'Cone'}};
const nmL = (k,v)=>v.map(x=>LISTA[k][x]).join(' ou ');

function validaHab(hab){
  const A=[], e=t=>A.push({l:'e',t}), w=t=>A.push({l:'w',t}), i=t=>A.push({l:'i',t});
  const fs = hab.fns.map(sf=>FN[sf.id]).filter(Boolean);
  if(!fs.length){ i('Escolha uma Função Mecânica para começar.'); return A; }
  const d=D();

  fs.forEach(f=>{
    if(!CH.estigma.arqs.includes(f.arq))
      e(f.n+': o arquétipo '+CAT[f.arq].n+' não está entre os 4 atribuídos ao Estigma.');
    if(f.se && hab.tipo!=='estigma') e(f.n+' só pode ser atribuída ao Estigma (marca principal), nunca como Runa.');
    if(f.sc && !hab.comb) e(f.n+' só existe dentro de uma Runa Combinada, junto de outra função.');
    if(hab.comb && f.nc) e(f.n+' não pode ser atribuída a Runa Combinada.');
    if(f.r&&f.r.al && !f.r.al.includes(hab.mira))
      e(f.n+' exige '+nmL('al',f.r.al)+' — está como '+LISTA.al[hab.mira]+'.');
    if(f.r&&f.r.ac && !f.ig && !f.r.ac.includes(hab.alc))
      e(f.n+' exige alcance '+nmL('ac',f.r.ac)+' — está como '+LISTA.ac[hab.alc]+'.');
    if(f.r&&f.r.du && !hab.passiva && !f.r.du.includes(hab.dur))
      e(f.n+' exige duração '+nmL('du',f.r.du)+' — está como '+LISTA.du[hab.dur]+'.');
    if(f.r&&f.r.ar && hab.mira==='area' && !f.r.ar.includes(hab.area))
      e(f.n+' exige área em '+nmL('ar',f.r.ar)+'.');
    if(hab.passiva && f.ps!=='s' && f.ps!=='x') e(f.n+' não pode ser atribuída como Passiva.');
    if(f.ps==='x' && !hab.passiva) e(f.n+' só funciona como Passiva — marque Uso Passivo.');
    if(f.ataque && hab.mira==='area')
      e(f.n+' exige Jogada de Ataque, e toda habilidade em área usa Teste de Resistência.');
    if(f.ataque && resolucao(hab)==='teste' && !mostraCombOpt(hab))
      e(f.n+' exige Jogada de Ataque, mas a habilidade resolve por Teste de Resistência.');
    if(f.exigeReq && !hab.verbal && !hab.gestual)
      e(f.n+' exige sempre requisito Verbal ou Gestual para poder ser ativada.');
    if(f.dano && !hab.passiva && DUR[hab.dur].semDano)
      w(f.n+' causa dano direto, e a duração "'+DUR[hab.dur].l+'" não vale para dano direto.');
    if(f.id==='aumento_dano' && hab.passiva && hab.mira==='area')
      e('Aumento de Dano como passiva não pode ser em área.');
    const sf = hab.fns.find(x=>x.id===f.id) || {};
    if(f.id==='ampliar_musc' && hab.passiva && (sf.ap||1)>1)
      e('Ampliar Musculatura só pode ser Passiva na opção de 1 runa.');
    if((f.id==='visao_aprim'||f.id==='pulmao') && hab.passiva && (sf.ap||1)>1)
      w(f.n+' passiva: cada runa adicional ocupa uma passiva a mais no seu limite.');
  });

  if(hab.comb){
    if(hab.tipo==='estigma') e('A marca principal do Estigma nunca pode ser fundida em Runa Combinada.');
    if(fs.length<2) w('Runa Combinada precisa de duas funções.');
    if(fs.length>2) e('Uma habilidade nunca pode ter mais de duas funções.');
    hab.fns.forEach(sf=>{const f=FN[sf.id];
      if(f&&f.ap&&(sf.ap||1)>1) e(f.n+': runas Aprimoráveis não entram em Runa Combinada.');});
    if(fs.length===2){
      const [x,y]=fs;
      if(x.id===y.id) e('As duas funções da Runa Combinada são idênticas.');
      [[x,y],[y,x]].forEach(([m,o])=>{
        if(m.semArq && m.semArq.includes(o.arq))
          e(m.n+' não pode ser combinada com uma função do arquétipo '+CAT[o.arq].n+'.');
        if(m.conflita && m.conflita.includes(o.id)) e(m.n+' não combina com '+o.n+'.');
      });
      const ctr = fs.filter(f=>f.arq==='controle'||f.arq==='enfraquecimento');
      if(ctr.length===2 && ctr[0].ta && ctr[1].ta)
        i('Duas funções de Controle/Enfraquecimento: o atributo do teste deve ser o mesmo para as duas.');
      if(x.exigeDano||y.exigeDano){
        const outra = x.exigeDano?y:x;
        if(!outra.dano) e((x.exigeDano?x.n:y.n)+' exige estar combinada com uma função que cause dano.');
      }
      if((x.id==='roubo_fluxo'||y.id==='roubo_fluxo') && resolucao(hab)==='nenhuma')
        e('Roubo de Fluxo exige que a habilidade faça jogada de ataque ou peça teste de resistência.');
    }
    if(hab.passiva) e('Funções passivas não podem entrar em Runas Combinadas.');
  }
  if(fs.some(f=>f.id==='red_desloc_fixa') && !fazAtaque(resolucao(hab)))
    e('Redução Fixa de Deslocamento exige uma habilidade que faça jogadas de ataque.');
  if(fs.some(f=>f.id==='corta_cura') && resolucao(hab)==='nenhuma')
    e('Corta Cura exige jogada de ataque ou teste de resistência.');
  if(fs.some(f=>f.id==='escudo') && hab.dur==='prol')
    i('Em Duração Prolongada o escudo se reestabelece sozinho no início do seu turno — a tabela de esforço extra vale para durações menores.');

  const c = custo(hab);
  if(hab.passiva)
    i('Passiva: sempre ativa, não gasta P.A e não consome Fluxo por rodada. Custo dobrado e descontado permanentemente do Limite de Fluxo.');
  else if(c.total > d.fluxoDisp)
    w('Custo de '+c.total+' acima do Fluxo disponível ('+d.fluxoDisp+'). Ativar assim gera sobrecarga: 1 de [In]Sanidade a cada 5 de Fluxo além do limite.');
  if(!A.some(x=>x.l==='e')) A.push({l:'g',t:'Habilidade válida pelas regras do Guia.'});
  return A;
}

function validaFicha(){
  const A=[], e=t=>A.push({l:'e',t}), w=t=>A.push({l:'w',t}), i=t=>A.push({l:'i',t});
  const d=D();

  if(d.atrDisp<0) e('Atributos: '+d.gastoAtr+' pontos distribuídos, o nível '+CH.nivel+' dá '+d.p.ptsAtr+'.');
  ATR.forEach(k=>{ if(CH.attrs[k]>d.limAtr)
    e(ATRN[k]+' está em '+CH.attrs[k]+', acima do Limite de Atributo do nível ('+d.limAtr+').'); });
  if(!CH.afinidade) w('Escolha a Afinidade do Fluxo — ela entra no Ataque Psíquico e nos derivados.');
  if(!CH.origem) w('Escolha a Origem para liberar as habilidades de origem.');
  if(d.aprSobra<0) e('Pontos de Aprimoramento: '+d.usadosApr+' usados, o nível dá '+d.p.apr+'.');

  Object.keys(ESP).forEach(k=>{
    const s=CH.esp[k], esc=(s.tal||[]).filter(Boolean).length, perm=s.nv*2;
    if(esc>perm && s.nv===0)
      e(ESP[k].n+': só é possível comprar '+ESP[k].lista.toLowerCase()+' avulsos com pelo menos 1 nível na especialização.');
    else if(esc>perm)
      i(ESP[k].n+': '+(esc-perm)+' habilidade(s) além das '+perm+' do nível, a 2 pontos cada.');
    const dup=(s.tal||[]).filter(Boolean).filter((t,ix,ar)=>ar.indexOf(t)!==ix);
    if(dup.length) e(ESP[k].n+': "'+dup[0]+'" aparece mais de uma vez.');
  });
  if(CH.esp.cac.nv>0 && (CH.esp.cac.prof||[]).length!==CH.esp.cac.nv)
    w('Armas Corpo a Corpo nível '+CH.esp.cac.nv+' dá proficiência em '+CH.esp.cac.nv+' categoria(s) — '+(CH.esp.cac.prof||[]).length+' marcada(s).');

  Object.keys(ECO).forEach(k=>{
    const s=CH.ecos[k], esc=(s.hab||[]).filter(Boolean).length, perm=s.nv*2;
    if(esc>perm && s.nv===0)
      e('Eco de '+ECO[k].n+': só é possível comprar habilidades avulsas com pelo menos 1 nível no Eco.');
    else if(esc>perm)
      i('Eco de '+ECO[k].n+': '+(esc-perm)+' habilidade(s) além das '+perm+' do nível, a 2 pontos cada.');
    const dup=(s.hab||[]).filter(Boolean).filter((t,ix,ar)=>ar.indexOf(t)!==ix)
              .filter(t=>!t.includes('até 3x'));
    if(dup.length) e('Eco de '+ECO[k].n+': "'+dup[0]+'" aparece mais de uma vez.');
  });
  if(contaMaestria('manipulacao','Limite Expandido')>3) e('Limite Expandido pode ser adquirida no máximo 3 vezes.');
  if(contaMaestria('manipulacao','Runa Adicional')>3) e('Runa Adicional pode ser adquirida no máximo 3 vezes.');
  if(CH.origem==='Veratem' && !CH.veratemEco)
    w('Veratem: escolha o Eco que recebe a redução de custo (Grão-Mestre Psíquico).');
  if(CH.afinidade==='Mente' && d.ecoSobra>0)
    i('Afinidade Mente: '+d.ecoSobra+' dos 3 pontos bônus de Eco ainda não foram usados (só valem para Ecos).');

  /* sub-opções da origem */
  subsDaOrigem().forEach(sb=>{
    const sel=subSel(sb.id), lim=limSub(sb,d.psique);
    if(sb.ref) return;
    if(sel.length>lim)
      e(sb.n+': '+sel.length+' escolhida(s) de '+lim+' permitida(s) — '+sb.limTxt+'.');
    else if(sel.length<lim && lim!==Infinity)
      i(sb.n+': '+(lim-sel.length)+' escolha(s) ainda disponível(is) de '+lim+'.');
  });
  Object.keys(SUBS).forEach(o=>{ if(o===CH.origem) return;
    SUBS[o].forEach(sb=>{ if(subSel(sb.id).length)
      w('Há escolhas guardadas em "'+sb.n+'", da origem '+o+'. Elas não valem para '+(CH.origem||'a origem atual')+'.'); });
  });
  (SUBS[CH.origem]||[]).filter(sb=>CH.nivel<sb.nv && subSel(sb.id).length).forEach(sb=>
    e(sb.n+' só é liberada no nível '+sb.nv+' e já tem escolhas marcadas.'));
  if(CH.origem==='Mercenário'){
    const g=subSel('gratis');
    const jaTem=g.filter(t=>Object.keys(ESP).some(k=>(CH.esp[k].tal||[]).includes(t)));
    if(jaTem.length) w('"'+jaTem[0]+'" está marcada como habilidade gratuita e também comprada numa Especialização — vale só uma vez.');
  }

  /* Sigilo */
  if(CH.sigilo.v && !d.sigLib)
    e('Sigilo escolhido, mas o acesso só é liberado no nível '+SIGILO_NV+'.');
  else if(d.sigLib && !CH.sigilo.v)
    w('Nível '+CH.nivel+': o Sigilo já está liberado e nenhuma variação foi escolhida.');
  if(d.sigAtivo)
    i('Sigilo de Transformação ativo: +2 em Psique e na Afinidade já aplicados nos derivados. Ao desativar, sem Estigma nem Runas até um Descanso Completo.');
  if(CH.sigilo.v && SIGILOS[CH.sigilo.v] && SIGILOS[CH.sigilo.v].op){
    SIGILOS[CH.sigilo.v].op.forEach(o=>{ if(CH.sigilo.op[o.id]==null)
      i('Sigilo de '+SIGILOS[CH.sigilo.v].n+': defina "'+o.l+'".'); });
  }

  if(!CH.estigma.arqs.length) w('O Estigma ainda não tem arquétipos atribuídos.');
  else if(CH.estigma.arqs.length<4) w('Arquétipos do Estigma: '+CH.estigma.arqs.length+' de 4 atribuídos.');
  if(d.runasUso>d.runasDisp)
    e('Runas: '+d.runasUso+' gastas de '+d.runasDisp+' disponíveis'+(d.runaAd?' (inclui +'+d.runaAd+' de Runa Adicional)':'')+'.');
  if(d.passUso>d.passLim)
    e('Passivas do Estigma: '+d.passUso+' em uso, o limite é '+d.passLim+' (1 + metade da Psique).');
  Object.values(FN).filter(f=>f.unica).forEach(f=>{
    const n = CH.estigma.habs.filter(h=>h.fns.some(sf=>sf.id===f.id)).length;
    if(n>1) e(f.n+' não pode ser escolhida mais de uma vez no mesmo Estigma/Runas ('+n+' usos).');
  });
  const ass={};
  CH.estigma.habs.forEach(h=>h.fns.filter(sf=>sf.id).forEach(sf=>{
    const key=sf.id+'|'+h.mira+'|'+h.alc+'|'+h.area+'|'+h.dur;
    ass[key]=(ass[key]||0)+1;
    if(ass[key]===2) w(FN[sf.id].n+' aparece duas vezes com as mesmas regras mecânicas — funções idênticas não acumulam.');
  }));

  if(d.sobrecarga>0)
    w('Sobrecarga de Fluxo: '+d.sobrecarga+' além do limite → '+d.insAcum+' acúmulo(s) de [In]Sanidade.');
  if(d.sit==='FERIDO' || d.sit==='GRAVEMENTE FERIDO'){
    if(d.ignoraFerido) i(d.sit+': a Afinidade Corpo ignora as penalidades deste estado.');
    else w(d.sit+': '+d.penFerido+' em ataque, ND, esquiva e defesa.');
  }
  const vinc = CH.armas.filter(w2=>w2.v && w2.n).length;
  if(vinc>d.nvVinculo)
    e('Eco de Vínculo: '+vinc+' arma(s) vinculada(s), o limite é '+d.nvVinculo+
      (d.temVinc?'':' (o Eco exige a maestria Vínculo Psíquico em Manipulação)')+'.');
  if(d.revBonus && vinc)
    i('Revestimento não acumula com o Eco de Vínculo em armas leves de punho — prevalece o maior.');
  CH.armas.forEach(w2=>{ const x=acharArma(w2.n);
    if(x && !proficiente(x)) w('Sem proficiência com '+x.n+' ('+x.tipo+', '+x.cat+'): o ataque não recebe bônus de atributo.'); });

  if(!A.length) A.push({l:'g',t:'Ficha consistente com as regras do Guia.'});
  return A;
}

</script>
<script>
/* ============================================================
   Interface
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opt = (label,v,sel,dis)=>`<option value="${esc(String(v))}" ${sel?'selected':''} ${dis?'disabled':''}>${esc(label)}</option>`;
const TABS=[
  {k:'personagem',n:'Personagem'},{k:'atributos',n:'Atributos'},{k:'origem',n:'Origem'},
  {k:'esp',n:'Especializações'},{k:'ecos',n:'Ecos Psíquicos'},{k:'estigma',n:'Estigma e Runas'},
  {k:'sigilo',n:'Sigilo'},{k:'combate',n:'Combate'},{k:'notas',n:'Notas e Inventário'}
];
const curHab = () => CH.estigma.habs.find(h=>h.k===CH.estigma.sel) || CH.estigma.habs[0];

function render(){
  vitals(); nav(); budget(); view(); side(); alerts(); persist();
}

/* ---------- topo ---------- */
function vitals(){
  const d=D();
  const v=(c,l,val,t)=>`<div class="vital ${c}" title="${t||''}"><u>${l}</u><b>${val}</b></div>`;
  $('#vitals').innerHTML =
    v('','Nível','<span class="mono">'+CH.nivel+'</span> <small>'+d.p.cl+'</small>','Classificação do nível')+
    v('','Psique',d.psique,'Igual ao Limite de Atributo do nível')+
    `<div class="vital pv ${d.sit!=='NORMAL'?'bad':''}" title="${d.sit}"><u>PV — ${d.sit.toLowerCase()}</u>
      <b><input type="number" id="pvAtual" value="${d.pvAtual}"><small>/ ${d.pvTotal}</small></b></div>`+
    `<div class="vital fx ${d.sobrecarga>0?'bad':''}" title="Limite ${d.limFluxo}${d.descPass?' − '+d.descPass+' de passivas':''}">
      <u>Fluxo gasto</u><b><input type="number" id="fluxoGasto" value="${CH.fluxoGasto}"><small>/ ${d.fluxoDisp}</small></b></div>`+
    v('pa','P.A',d.p.pa,'Pontos de Ação por turno')+
    v('','Atq. Psíquico / ND','+'+d.atqPsi,'Psique + metade da Afinidade'+(d.afd.atk?' + '+d.afd.atk+' (Carisma)':''))+
    `<div class="vital ins"><u>[In]Sanidade</u><b><input type="number" id="insan" value="${CH.insanidade}"></b></div>`;
}

/* ---------- navegação ---------- */
function nav(){
  const d=D();
  const mark={
    atributos:[d.gastoAtr+'/'+d.p.ptsAtr, d.atrDisp<0?'bad':d.atrDisp===0?'ok':'warn'],
    esp:[d.gEsp+'p',''],
    ecos:[d.gEco+'p',''],
    estigma:[d.runasUso+'/'+d.runasDisp+'r', d.runasUso>d.runasDisp?'bad':'ok'],
    origem:[CH.origem?(subsDaOrigem().filter(x=>!x.ref).length
              ? subsDaOrigem().filter(x=>!x.ref).reduce((a2,x)=>a2+subSel(x.id).length,0)+'/'+
                subsDaOrigem().filter(x=>!x.ref).reduce((a2,x)=>a2+limSub(x,d.psique),0)
              : '✓'):'—', CH.origem?'ok':'warn'],
    sigilo:[d.sigLib?(CH.sigilo.v?SIGILOS[CH.sigilo.v].n.slice(0,6):'—'):'nv 12',
            d.sigLib?(CH.sigilo.v?'ok':'warn'):'']
  };
  $('#nav').innerHTML = TABS.map((t,ix)=>{
    const m=mark[t.k];
    return `<button class="nb ${CH.tab===t.k?'on':''}" data-tab="${t.k}">
      <i>${ix+1}</i><span>${t.n}</span>${m?`<b class="${m[1]}">${m[0]}</b>`:''}</button>`;
  }).join('');
}
function budget(){
  const d=D();
  const r=(l,a,b,c)=>`<div class="lrow"><span>${l}</span><b class="${c||''}" style="${
    c==='bad'?'color:var(--err)':c==='ok'?'color:var(--ok)':''}">${a}<em style="color:var(--dim2)"> / ${b}</em></b></div>`;
  $('#budget').innerHTML =
    r('Atributos',d.gastoAtr,d.p.ptsAtr,d.atrDisp<0?'bad':'ok')+
    r('Aprimoramento',d.usadosApr,d.p.apr,d.aprSobra<0?'bad':'ok')+

function side(){
  const d=D();
  if(CH.tab==='estigma'){ $('#sideTitle').innerHTML='Balanço de custo <em>'+esc(curHab().nome||'sem nome')+'</em>'; return ledger(); }

  $('#sideTitle').textContent='Valores derivados';
  const L=(l,v,t)=>`<div class="lrow" title="${t||''}"><span>${l}</span><b>${v}</b></div>`;
  $('#side').innerHTML=
    L('Pontos de Vida',d.pvTotal,'10 + Corpo + (nível−1) × (5 + metade do Corpo)'+(d.afd.hp?' + '+d.afd.hp+'/nível pela Afinidade':''))+
    L('Iniciativa','+'+d.inic,'Agilidade + metade do Instinto, ou o inverso')+
    L('Esquiva','+'+d.esquiva,'Iniciativa'+(d.afd.esq?' + '+d.afd.esq+' (Afinidade)':'')+(d.guarda?' + '+d.guarda+' (Em Guarda)':''))+
    L('Defesa','+'+d.defesa,'Força + metade do maior entre Agilidade e Instinto'+(d.guarda?' + '+d.guarda+' (Em Guarda)':''))+
    L('Ataque Psíquico / ND','+'+d.atqPsi)+
    L('Ataque Desarmado','+'+d.atqDes+' · dano '+d.danoDes)+
    L('Deslocamento',d.desloc+' m'+(d.afd.desl>1?' (dobrado)':''))+
    L('Levantamento de peso',d.levant+' kg'+(d.afd.carga>1?' (dobrado)':''))+
    L('Carga geral',d.carga+' kg'+(d.afd.carga>1?' (dobrada)':''))+

function sideDano(){
  const rows=[['1–2','+1'],['3–4','+2'],['5–6','+3'],['7–8','+4'],['9–10','+5'],['11 ou mais','+6']];
  $('#side').innerHTML = rows.map(r=>`<div class="lrow"><span>Diferença ${r[0]}</span><b>${r[1]}</b></div>`).join('')
    +`<div class="cbody" style="border-top:1px solid var(--line)"><p class="note">Dano Total = Dano Garantido (o valor da arma/habilidade) + Dano por Diferença (só quando houve Jogada de Ataque). Efeitos que pedem Teste de Resistência não somam a diferença.</p></div>`;
}
function alerts(){
  const a = CH.tab==='estigma' ? [...validaFicha().filter(x=>x.l==='e'), ...validaHab(curHab())] : validaFicha();
  $('#alerts').innerHTML = a.map(x=>`<div class="al ${x.l}"><i>${
    x.l==='e'?'✕':x.l==='w'?'!':x.l==='g'?'✓':'i'}</i><div>${x.t}</div></div>`).join('');
}

function vOrigem(){
  if(!CH.origem) return `<div class="row"><div class="grp"><label>Origem</label><select data-ch="origem">

function blocoSub(sb,d){
  const lib = CH.nivel>=sb.nv;
  const sel = subSel(sb.id), lim = limSub(sb,d.psique), lista = listaSub(sb);
  let h = `<div class="blk" style="border-color:${lib?'var(--runa)':'var(--line)'}"><div class="blkh">
    <h4>${esc(sb.n)}</h4>
    <span class="bdg ${lib?'v':'r'}">Nível ${sb.nv}${lib?'':' · bloqueado'}</span>
    ${sb.ref?'<span class="bdg">lista de consulta — acesso a todas</span>'
            :`<span class="bdg ${sel.length>lim?'r':sel.length===lim?'g':'y'}">${sel.length} de ${lim}</span>
              <span class="bdg">${esc(sb.limTxt||'')}</span>`}</div>`;
  if(!lib) return h+`<p class="note">Liberada no nível ${sb.nv}.</p></div>`;
  if(sb.nota) h += `<p class="note" style="margin:0 0 9px">${esc(sb.nota)}</p>`;
  h += `<div class="slotlist">`;
  lista.forEach(it=>{
    const on = sb.especial==='veratemEco' ? CH.veratemEco===it.k : sel.includes(it.n);
    const cheio = !sb.ref && !on && sel.length>=lim;
    h += `<div class="subrow ${on?'on':''} ${cheio?'off':''}">
      <label class="subhead">
        ${sb.ref?'<span class="dot"></span>'
          :`<input type="checkbox" data-sub="${sb.id}" data-item="${esc(it.k||it.n)}" ${on?'checked':''} ${cheio?'disabled':''}>`}
        <b>${esc(it.n)}</b>
        ${it.cat?`<span class="bdg">${esc(it.cat)}</span>`:''}
        ${it.c?`<span class="bdg t">${esc(it.c)}</span>`:''}
      </label>
      ${it.d?`<div class="tdesc">${esc(it.d)}</div>`:''}</div>`;
  });
  return h+`</div></div>`;
}

function ecoBadges(k,d){

      <td><small>${x?x.cat:'—'}</small></td><td><small>${alcanceArma(x)}</small></td>
      <td class="n">${x?(at.prof?'+'+at.mod:'—'):'—'}<br><small style="font-weight:400">${x?at.base:''}</small></td>
      <td class="n">${x?dn.txt:'—'}${x&&dn.comp&&dn.comp.length>1?'<br><small style="font-weight:400">'+dn.comp.map(c=>(c.v>=0?'+':'')+c.v).join(' ')+'</small>':''}</td>
      <td class="n"><input type="checkbox" data-vinc="${i}" ${w.v?'checked':''} ${d.nvVinculo?'':'disabled'}></td></tr>`;
  });
  h += `</tbody></table>
  <p class="note">O Dano Garantido das armas é o valor fixo da lista; o resto do dano vem da diferença entre a sua rolagem e a defesa do alvo. Sem proficiência não há bônus de atributo na jogada.</p>

  h += cars.length?cars.map(c=>`<div class="tdesc">• ${esc(c)}</div>`).join(''):'<p class="note">Nenhuma arma equipada.</p>';

}

function vSigilo(){

  let h = `<div class="row">
    <div class="grp"><label>Nome do Sigilo</label>

      style="--ac:#3a2b56;--acb:var(--runa)">${SIGILOS[k].n}</button>`).join('')}</div>`;

  h += `<div class="hr"></div><div class="blk" style="border-color:var(--runa)">
    <div class="blkh"><h4>${S.n}</h4>

    <ul class="rules">${S.ef.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>`;
  (S.op||[]).forEach(o=>{
    h += `<div class="row" style="margin-top:11px"><div class="grp"><label>${esc(o.l)}</label>
      <select data-sigop="${o.id}">${opt('—','',CH.sigilo.op[o.id]==null)}
      ${o.it.map((it,j)=>opt(it.l,j,CH.sigilo.op[o.id]===j)).join('')}</select></div></div>`;
    const sel=o.it[CH.sigilo.op[o.id]];
    if(sel&&sel.d) h += `<div class="tdesc" style="padding-left:2px">${esc(sel.d)}</div>`;
  });
  if(S.opNota) h += `<p class="note">${esc(S.opNota)}</p>`;
  h += `<p class="note" style="margin-top:11px"><b style="color:var(--err)">Colateral:</b> ${esc(S.col)}</p></div>`;

  h += `<p class="sub">Valores do seu Sigilo</p><table class="t"><tbody>`;
  const L=(a,b,c)=>`<tr><td>${a}</td><td class="n">${b}</td><td><small>${c||''}</small></td></tr>`;
  if(v==='transformacao'){
    h += L('PV da transformação',d.sigPV,'Psique '+(d.p.limAtr+2)+' (já com o +2 do Sigilo) × 10')
      +  L('Psique enquanto ativo',d.p.limAtr+2,'+2 sobre '+d.p.limAtr)
      +  L('Afinidade enquanto ativa',CH.afinidade?((d.a[AF2ATR[CH.afinidade]]||0)+2):'—','+2 em '+(CH.afinidade||'—'))
      +  L('Ataque Psíquico / ND com o Sigilo em pé','+'+(d.sigAtivo?d.atqPsi:d.atqPsi+2+(CH.afinidade?1:0)),
            'Psique +2 e metade da Afinidade +2');
  }
  if(v==='territorio')
    h += L('Raio da esfera',d.sigRaio+' m','Psique × 5')
      +  L('Fluxo consumido pelo totem','igual ao dano sofrido','a 100% do Limite ('+d.limFluxo+') o Território se desfaz');
  if(v==='invocacao'){
    const it=(S.op[0].it||[])[CH.sigilo.op.tam];
    h += L('Limite de Fluxo da invocação',d.sigInvFluxo,'metade do seu Limite base')
      +  L('Runas da invocação',Math.floor(d.runasDisp/2),'metade das suas')
      +  L('Modificador de PV',it?(it.pv>0?'+':'')+it.pv+' por nível':'—','ficha própria no nível '+CH.nivel)
      +  L('Redução do seu Limite',it?it.fx:'—','enquanto a invocação estiver ativa');
  }
  if(v==='maximizacao'){
    const it=(S.op[0].it||[])[CH.sigilo.op.ef];
    h += L('Custo do efeito',it?it.fx+' de Fluxo':'escolha o efeito','a habilidade em si não consome Fluxo')
      +  L('Usos por dia sem risco',1,'a partir do 2º: 1d12, 6 ou menos falha e ainda gasta o Fluxo');
  }
  if(v==='sobreposicao')
    h += L('Limite base compartilhado',d.limFluxo,'o gasto de uma ficha afeta a outra')
      +  L('Nível da segunda ficha',CH.nivel,'mesmos recursos, Afinidade e atributos podem diferir');
  return h+`</tbody></table>`;
}
function custoSigilo(){
  const S=SIGILOS[CH.sigilo.v]; if(!S) return null;
  if(S.fx!=null) return S.fx;
  const o=(S.op||[])[0]; if(!o) return null;
  const it=o.it[CH.sigilo.op[o.id]];
  return it&&it.fx!=null?it.fx:null;
}

function boxFn(h,sf,i){
  const f=FN[sf.id], E=CH.estigma;
  let o=`<div class="fnbox b${i+1}"><div class="fnhead"><select data-fn="${i}" data-hab="id">
    ${opt('— escolha a função —','',!sf.id)}
    ${E.arqs.map(a=>`<optgroup label="${CAT[a].n}">${CAT[a].fns.map(x=>opt(x.n,x.id,sf.id===x.id)).join('')}</optgroup>`).join('')}
    <optgroup label="${E.arqs.length?'— outros arquétipos, não atribuídos —':'— todos os arquétipos —'}">
      ${Object.keys(CAT).filter(a=>!E.arqs.includes(a)).map(a=>CAT[a].fns.map(x=>opt(CAT[a].n+' · '+x.n,x.id,sf.id===x.id)).join('')).join('')}</optgroup>
    </select>`;
  if(h.comb&&i===1) o+=`<button class="btn dz" data-rmfn="1">Remover</button>`;
  o+=`</div>`;
  if(!f) return o+`<p class="fndesc">Escolha uma função para ver custo, requisitos e regras.</p></div>`;
  o += `<div class="badges">
    <span class="bdg t">Fluxo ${f.b!=null?f.b:(f.bv||'variável')}</span>
    <span class="bdg y">P.A ${fnPA(h,i)}</span>
    ${f.rc==='s'?'<span class="bdg g">Reação</span>':''}${f.rc==='x'?'<span class="bdg g">Só por reação</span>':''}
    ${f.ps==='s'?'<span class="bdg v">Pode ser passiva</span>':''}${f.ps==='x'?'<span class="bdg v">Só por passiva</span>':''}
    ${f.t==='s'?'<span class="bdg">Teste de resistência</span>':''}${f.t==='o'?'<span class="bdg">Ataque ou teste</span>':''}
    ${f.dano?'<span class="bdg">Causa dano</span>':''}${f.cond?'<span class="bdg">Aplica condição</span>':''}
    ${f.nc?'<span class="bdg">Não combina</span>':''}${f.se?'<span class="bdg">Só no Estigma</span>':''}
    ${f.sc?'<span class="bdg">Só combinada</span>':''}
  </div><p class="fndesc">${f.d}</p>`;
  (f.op||[]).forEach(op=>{
    if(op.num){
      const v=sf.op[op.id]??op.def;
      o+=`<div class="row" style="margin-top:9px"><div class="grp"><label>${op.l}</label>
        <input type="number" data-fn="${i}" data-op="${op.id}" value="${v}" min="${op.min}" max="${op.max}"></div></div>`;
    }else{
      const s=sf.op[op.id]??0;
      o+=`<div class="row" style="margin-top:9px"><div class="grp"><label>${op.l}</label>
        <select data-fn="${i}" data-op="${op.id}">${op.it.map((it,j)=>
          opt(it.l+(it.c?'  ('+(it.c>0?'+':'')+it.c+' Fluxo)':'  (0)'),j,s===j)).join('')}</select></div></div>`;
    }
  });
  if(f.ap) o+=`<div class="row" style="margin-top:9px"><div class="grp"><label>Aprimoramento — runas investidas</label>
    <select data-fn="${i}" data-hab="ap">${f.ap.map((t,j)=>opt((j+1)+' runa'+(j?'s':'')+' — '+t,j+1,(sf.ap||1)===j+1)).join('')}</select></div></div>`;
  if(f.apRunas) o+=`<div style="margin-top:9px"><label class="check ${h.marioMult?'on':''}">
    <input type="checkbox" data-hab="marioMult" ${h.marioMult?'checked':''}> Múltiplas marionetes (+2 runas)</label></div>`;
  if(f.db) o+=`<p class="note"><b style="color:var(--txt)">Dano base:</b> ${f.db}${D().manBonus?' · +'+D().manBonus+' do Eco de Manipulação':''}</p>`;
  if(f.pl) o+=`<p class="note"><b style="color:var(--txt)">Custo prolongado:</b> ${f.pl}.</p>`;
  if(f.ta_nota) o+=`<p class="note">${f.ta_nota}</p>`;
  if(f.rg) o+=`<details class="more"><summary>Regras específicas</summary><ul class="rules">${f.rg.map(r=>'<li>'+r+'</li>').join('')}</ul></details>`;
  return o+`</div>`;
}
