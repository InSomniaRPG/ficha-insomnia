<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[In]somnia — Ficha do Médium</title>
<style>
:root{
  --ink:#0b0a11; --panel:#14121d; --panel2:#1c1929; --panel3:#241f34;
  --line:#2c2740; --line2:#403859;
  --txt:#eae6f5; --dim:#9c94b6; --dim2:#6d6689;
  --fluxo:#4fd1c5; --pa:#f5b544; --runa:#a78bfa; --pass:#f28bc1; --pv:#ff7a8a;
  --ok:#5fd48f; --warn:#f0b34a; --err:#ff6b81;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--txt);font-family:var(--ui);font-size:14px;line-height:1.5;
  background-image:radial-gradient(circle at 12% -8%,rgba(167,139,250,.10),transparent 55%),
                   radial-gradient(circle at 92% 0%,rgba(79,209,197,.055),transparent 50%);
  background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--runa);outline-offset:2px}
select,input[type=text],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:5px 8px}
select:hover,input:hover{border-color:var(--line2)}
textarea{width:100%;resize:vertical;line-height:1.45}
.mono{font-family:var(--mono)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(11,10,17,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.hwrap{max-width:1680px;margin:0 auto;padding:9px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:15px;letter-spacing:.02em}
.brand b i{color:var(--runa);font-style:normal}
.brand span{font-family:var(--mono);font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim2)}
.hsep{width:1px;align-self:stretch;background:var(--line)}
.who{display:flex;flex-direction:column;gap:2px;min-width:150px}
.who input{background:transparent;border:none;border-bottom:1px solid var(--line);border-radius:0;
  padding:2px 0;font-size:15px;font-weight:600}
.who input:focus{border-color:var(--runa)}
.who span{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2)}
.vitals{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:stretch}
.vital{display:flex;flex-direction:column;gap:1px;padding:4px 9px;border-radius:6px;background:var(--panel2);
  border:1px solid var(--line);min-width:62px}
.vital u{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);
  text-decoration:none;white-space:nowrap}
.vital b{font-family:var(--mono);font-size:15px;font-weight:600;display:flex;align-items:baseline;gap:3px}
.vital b small{font-size:10px;color:var(--dim2);font-weight:400}
.vital input{width:44px;background:transparent;border:none;padding:0;font-family:var(--mono);font-size:15px;
  font-weight:600;color:inherit}
.vital.pv b,.vital.pv input{color:var(--pv)} .vital.fx b,.vital.fx input{color:var(--fluxo)}
.vital.pa b{color:var(--pa)} .vital.ins b,.vital.ins input{color:var(--pass)}
.vital.bad{border-color:var(--err)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.btn:hover{border-color:var(--line2);color:var(--txt);background:var(--panel3)}
.btn.pri{background:linear-gradient(180deg,#6d4fd8,#5a3fbd);border-color:#7d5ff0;color:#fff}
.btn.pri:hover{background:linear-gradient(180deg,#7d5ff0,#6849cf)}
.btn.dz{color:var(--err);border-color:#4b2434}
.btn.dz:hover{background:#2a1520;border-color:var(--err)}
.btn.sm{padding:3px 7px;font-size:9px}

/* ---------- layout ---------- */
main{max-width:1680px;margin:0 auto;padding:14px 16px 60px;display:grid;gap:14px;
  grid-template-columns:212px minmax(0,1fr) 330px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card>h3{margin:0;padding:9px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);background:var(--panel2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600}
.card>h3 em{font-style:normal;color:var(--dim2);letter-spacing:.05em;text-transform:none;font-size:10.5px}
.cbody{padding:12px}
.sticky{position:sticky;top:62px}

/* ---------- nav ---------- */
.nav{display:flex;flex-direction:column;gap:3px;padding:7px}
.nb{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:6px;cursor:pointer;
  border:1px solid transparent;background:transparent;text-align:left;width:100%}
.nb:hover{background:var(--panel2)}
.nb.on{background:#241d3d;border-color:var(--runa)}
.nb i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--dim2);width:13px;flex:none}
.nb.on i{color:var(--runa)}
.nb span{flex:1;font-size:13px;font-weight:500}
.nb b{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--dim2);white-space:nowrap}
.nb b.ok{color:var(--ok)} .nb b.bad{color:var(--err)} .nb b.warn{color:var(--warn)}

/* ---------- comuns ---------- */
.row{display:flex;gap:10px;flex-wrap:wrap}
.grp{flex:1;min-width:150px;display:flex;flex-direction:column;gap:4px}
.grp.sm{min-width:110px;flex:0 1 130px}
.grp>label,.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
.grp select,.grp input{width:100%}
.hr{height:1px;background:var(--line);margin:14px -12px}
.sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  margin:0 0 9px;display:flex;align-items:center;gap:8px}
.sub:before{content:"";width:3px;height:11px;background:var(--runa);border-radius:2px;flex:none}
.note{font-size:11.5px;color:var(--dim2);margin:5px 0 0}
.check{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel2);cursor:pointer;font-size:12.5px;user-select:none}
.check:hover{border-color:var(--line2)}
.check.on{border-color:var(--runa);background:#241d3d}
.check.on.p{border-color:var(--pass);background:#301d2b}
.check input{accent-color:#7d5ff0;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
details.more{margin-top:8px}
details.more>summary{cursor:pointer;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim2);list-style:none}
details.more>summary:hover{color:var(--txt)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary:before{content:"▸ ";color:var(--runa)}
details.more[open]>summary:before{content:"▾ "}
.bdg{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2.5px 6px;
  border-radius:4px;background:var(--panel3);color:var(--dim);border:1px solid var(--line);display:inline-block}
.bdg.y{color:var(--pa);border-color:#4a3a1c} .bdg.g{color:var(--ok);border-color:#22482f}
.bdg.v{color:var(--runa);border-color:#3a2f5e} .bdg.t{color:var(--fluxo);border-color:#1c4a46}
.bdg.r{color:var(--err);border-color:#4b2434}
.longtext{font-size:12.5px;color:var(--dim);white-space:pre-wrap;line-height:1.5;max-height:340px;overflow:auto;
  padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}

/* ---------- atributos ---------- */
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.attr{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px;text-align:center}
.attr.af{border-color:var(--runa);background:#241d3d}
.attr u{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim2);text-decoration:none;margin-bottom:5px}
.attr .st{display:flex;align-items:center;justify-content:center;gap:6px}
.attr .st button{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--panel3);
  cursor:pointer;color:var(--dim);font-family:var(--mono);line-height:1;padding:0}
.attr .st button:hover:not(:disabled){color:var(--txt);border-color:var(--line2)}
.attr .st button:disabled{opacity:.3;cursor:not-allowed}
.attr .st b{font-family:var(--mono);font-size:22px;min-width:26px}
.attr.over .st b{color:var(--err)}
.attr small{display:block;color:var(--dim2);font-size:10.5px;margin-top:4px;font-family:var(--mono)}

/* ---------- blocos de especialização/eco ---------- */
.blk{border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:11px;margin-bottom:10px}
.blkh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.blkh h4{margin:0;font-size:14px;flex:1;min-width:120px}
.nvsel{display:flex;gap:3px}
.nvsel button{padding:4px 9px;border:1px solid var(--line);background:var(--panel3);border-radius:5px;
  cursor:pointer;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.nvsel button:hover{border-color:var(--line2);color:var(--txt)}
.nvsel button.on{background:#3a2b56;border-color:var(--runa);color:#fff}
.slotlist{display:flex;flex-direction:column;gap:6px}
.slotrow{display:flex;gap:7px;align-items:flex-start}
.slotrow select{flex:1;min-width:0}
.slotrow .tp{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 6px;border-radius:4px;background:var(--panel3);color:var(--dim2);white-space:nowrap;
  border:1px solid var(--line)}
.tdesc{font-size:11.5px;color:var(--dim2);padding:2px 0 4px 2px;line-height:1.45}
.subrow{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:7px 9px}
.subrow.on{border-color:var(--runa);background:#241d3d}
.subrow.off{opacity:.42}
.subhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;user-select:none}
.subrow.off .subhead{cursor:not-allowed}
.subhead input{accent-color:#7d5ff0;margin:0;flex:none}
.subhead b{font-size:12.5px;font-weight:600}
.subhead .dot{width:5px;height:5px;border-radius:50%;background:var(--runa);flex:none}
.subrow .tdesc{padding:4px 0 0 22px}

/* ---------- tabela ---------- */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);
  text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.t td{padding:5px 7px;border-bottom:1px solid rgba(44,39,64,.55);vertical-align:middle}
table.t td.n{font-family:var(--mono);font-weight:600;text-align:center;white-space:nowrap}
table.t tr:hover td{background:rgba(255,255,255,.02)}
table.t td small{color:var(--dim2);font-size:11px}

/* ---------- painel direito ---------- */
.ledger{display:flex;flex-direction:column}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:4.5px 12px;font-size:12.5px;align-items:baseline}
.lrow:nth-child(odd){background:rgba(255,255,255,.017)}
.lrow span{color:var(--dim)}
.lrow span em{font-style:normal;color:var(--dim2)}
.lrow b{font-family:var(--mono);font-weight:600;white-space:nowrap}
.lrow.neg b{color:var(--ok)}
.lrow.sum{border-top:1px solid var(--line2);background:var(--panel2);padding:9px 12px}
.lrow.sum span{color:var(--txt);font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase}
.lrow.sum b{font-size:20px;color:var(--fluxo)}
.bigrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.big{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.big u{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim2);text-decoration:none;margin-bottom:2px}
.big b{font-family:var(--mono);font-size:18px}
.big.pa b{color:var(--pa)} .big.pr b{color:var(--fluxo)}
.alerts{display:flex;flex-direction:column;gap:6px;padding:12px}
.al{display:flex;gap:8px;padding:8px 10px;border-radius:6px;font-size:12.5px;line-height:1.45;border:1px solid}
.al i{font-style:normal;flex:none;font-family:var(--mono);font-weight:700}
.al.e{background:#2a1219;border-color:#5c2434;color:#ffc6cf} .al.e i{color:var(--err)}
.al.w{background:#2a2211;border-color:#5c4a1e;color:#ffe4b3} .al.w i{color:var(--warn)}
.al.i{background:#111f2a;border-color:#1e455c;color:#c3e6f5} .al.i i{color:#5fc4f0}
.al.g{background:#122a1c;border-color:#22522f;color:#c4f0d4} .al.g i{color:var(--ok)}
.sheet{font-family:var(--mono);font-size:11.5px}
.srow{display:flex;justify-content:space-between;gap:8px;padding:3.5px 12px;border-bottom:1px solid rgba(44,39,64,.5)}
.srow u{color:var(--dim2);text-decoration:none;white-space:nowrap}
.srow b{text-align:right;font-weight:500}
.srow b.y{color:var(--ok)} .srow b.n{color:var(--dim2)}
pre.out{margin:0;padding:12px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;color:var(--dim);
  max-height:240px;overflow:auto;background:var(--panel2)}

/* ---------- habilidades do estigma (lista) ---------- */
.slots{display:flex;flex-direction:column;gap:5px;padding:8px}
.slot{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border-radius:6px;cursor:pointer;
  border:1px solid transparent;background:var(--panel2);text-align:left;width:100%}
.slot:hover{background:var(--panel3)}
.slot.on{border-color:var(--runa);background:#241d3d}
.slot .nm{flex:1;min-width:0}
.slot .nm b{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .nm small{color:var(--dim2);font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .cost{font-family:var(--mono);font-size:12px;color:var(--fluxo);white-space:nowrap;text-align:right}
.slot .cost.bad{color:var(--err)}
.slot .ic{width:6px;height:6px;border-radius:50%;background:var(--dim2);margin-top:6px;flex:none}
.slot.ok .ic{background:var(--ok)} .slot.err .ic{background:var(--err)}
.arqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.arqbtn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:7px 4px;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim2)}
.arqbtn:hover{border-color:var(--line2);color:var(--txt)}
.arqbtn.on{background:var(--ac,#3a2b56);border-color:var(--acb,var(--runa));color:#fff}
.arqbtn:disabled{opacity:.32;cursor:not-allowed}
.fnbox{border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:11px;margin-bottom:10px}
.fnbox.b1{border-left:3px solid var(--runa)} .fnbox.b2{border-left:3px solid var(--fluxo)}
.fnhead{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.fnhead select{flex:1;min-width:0}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.fndesc{color:var(--dim);font-size:12.5px;margin:8px 0 0}
.rules{margin:8px 0 0;padding-left:15px;color:var(--dim2);font-size:11.5px;line-height:1.5}
.rules li{margin-bottom:2px}
.empty{padding:40px 20px;text-align:center;color:var(--dim2)}
.empty b{display:block;color:var(--dim);margin-bottom:6px;font-size:15px}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}

@media(max-width:1300px){
  main{grid-template-columns:200px minmax(0,1fr)}
  .col3{grid-column:1/-1} .sticky{position:static}
}
@media(max-width:820px){
  main{grid-template-columns:1fr}
  .vitals{width:100%;margin-left:0}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nb{width:auto;flex:1 1 130px}
  .arqgrid{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:no-preference){
  .nb,.btn,.arqbtn,.check,.nvsel button{transition:background .12s,border-color .12s,color .12s}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><b>[<i>In</i>]somnia</b><span>Ficha do Médium</span></div>
    <div class="hsep"></div>
    <div class="who"><span>Personagem</span><input type="text" id="cNome" placeholder="nome do médium"></div>
    <div class="vitals" id="vitals"></div>
    <div class="chips">
      <button class="btn" id="bNew">Nova</button>
      <button class="btn" id="bSave">Salvar</button>
      <button class="btn" id="bLoad">Abrir</button>
      <button class="btn pri" id="bFolha">Folha</button>
      <input type="file" id="fIn" accept=".json" hidden>
    </div>
  </div>
</header>

<main>
  <div class="col col1">
    <div class="card"><h3>Etapas</h3><div class="nav" id="nav"></div></div>
    <div class="card noprint"><h3>Orçamentos</h3><div class="ledger" id="budget"></div></div>
  </div>
  <div class="col col2">
    <div class="card"><h3 id="tabTitle">—</h3><div class="cbody" id="view"></div></div>
  </div>
  <div class="col col3">
    <div class="sticky col" style="gap:12px">
      <div class="card"><h3 id="sideTitle">Painel</h3><div id="side"></div></div>
      <div class="card"><h3>Verificação de regras</h3><div class="alerts" id="alerts"></div></div>
    </div>
  </div>
</main>

const ORIGENS={"Caçador": [{"nv": 1, "n": "Compêndio de Presas e Rito de Caça", "t": "Compêndio de Presas\nLogo no 1º nível, você adquire acesso a um Compêndio de Presas, que pode ser um Livro de Pesquisas, Diário ou Enciclopédia. Esse compêndio é herdado pelas gerações da sua família, pelo caçador que lhe ensinou a arte da caçada ou foi encontrado por você em alguma de suas aventuras. O compêndio armazena inúmeras informações sobre todos os tipos de Oníricos, agindo como um guia que lhe permite identificar as características de uma presa. \n\nAo observar um Onírico dentro ou fora de um combate que esteja a no máximo 15m de distância, você pode consumir 1 Ponto de Ação no seu turno e rolar 1d12 para procurar informações sobre ele no seu Compêndio. Se seu resultado for superior a 6, você obtém as seguintes informações:\n\nA Classificação do Onírico. Caso a classificação seja Imaginária, você  sabe se ele é um onírico específico entre as listas de Fantasmas, Demônios, Monstros, Feéricos e Deidades.\n\nResistências, imunidades ou vulnerabilidades a danos e condições [caso ele possua].\n\nMétodos efetivos de purificação [caso ele possua].\n\nTipos de ataques, danos, condições ou efeitos que ela é capaz de causar [caso ele seja Imaginário].\n\nCuriosidades específicas como padrões alimentares, comportamentos, ambientes favoráveis ou desfavoráveis e interações específicas que ele possa ter com determinados materiais, objetos e substâncias [caso ele seja Imaginário].\n\nAo falhar em encontrar informações sobre um Onírico no Compêndio, você pode tentar novamente consumindo mais pontos de ação.\n\nSempre que você é bem sucedido em encontrar dados sobre um Onírico no seu Compêndio, você memoriza as páginas nas quais as informações estão registradas. Caso você eventualmente encontre um Onírico que pertença à mesma Classificação, você é capaz de identificá-lo automaticamente sem a necessidade de rolar 1d12 no processo. Caso o Onírico seja Imaginário, você sempre reconhecerá se ele é um Fantasma, Demônio, Monstro, Feérico ou Deidade, além de qual Onírico específico ele é entre os tipos.  \n\nRito da Caça\nTambém no 1º nível, o conhecimento herdado pelas tradições dos caçadores que vieram antes você lhe permitem utilizar táticas especiais para abater suas presas de forma mais efetiva, transformando cada caçada em um ritual simbólico. \n\nNo seu turno, você pode consumir 1 P.A e 10 de Fluxo para realizar um pequeno ritual que lhe permite marcar um Onírico que esteja a uma quantidade de metros igual ao dobro do seu atributo de Psique, desde que você já o tenha identificado através do seu Compêndio de Presas. \n\nEnquanto o alvo estiver marcado, você aprimora seu corpo e mente para lidar com a criatura, recebendo os seguintes benefícios: \n\nVocê recebe um bônus de +1 em jogadas de ataque, esquiva, defesa e testes de resistências rolados contra o Onírico. Esse bônus acumula com outros valores que também lhe concedam bônus nessas rolagens.\n\nSempre que ele te atingir com um ataque ou habilidade que cause dano, você pode reduzir o dano levado em -1. Esse efeito acumula com outros valores que também lhe concedam reduções de dano.\n\nSe ele possuir resistência ao tipo de dano causado pelos seus golpes, você pode ignorar essa resistência. \n\nMúltiplas criaturas podem ser marcadas pelo rito através de uma única ativação, dependendo de quantos usos restantes da habilidade você ainda possui. A quantidade de P.A e Fluxo continua a mesma, mas você consome um uso individual da habilidade para cada criatura marcada.\n\nEssa habilidade pode ser utilizada uma quantidade de vezes igual a 1 + metade do seu atributo de Psique por descanso completo."}, {"nv": 6, "n": "Predador Alfa", "t": "Alcançando o 6º nível, sua superioridade como caçador pode ser usada para subjugar uma presa em combate. Ao enfrentar um Onírico, você pode consumir 1 Ponto de Ação e 10 pontos de Fluxo para intensificar sua presença, liberando uma aura ameaçadora que lhe concede os seguintes efeitos: \n\nOníricos em um raio equivalente ao seu atributo de Psique x4 devem ser bem sucedidos em um teste de Mente contra o ND geral das suas habilidades. Em uma falha, eles ficarão sob a condição de Intimidado até o final de seus próximos turnos. Uma criatura bem sucedida fica imune a esse efeito pelas próximas 24 horas. \n\nSeus ataques se tornam capazes de explorar os pontos vulneráveis de cada Onírico, recebendo um bônus de +2 no dano causado contra essas criaturas. Esse bônus pode acumular com outras habilidades que concedam aumento de dano.\n\nSua margem de acerto crítico é reduzida em -1 contra suas presas Oníricas, permitindo que seus golpes sejam capazes de atingir pontos vitais com mais facilidade. Esse efeito pode acumular com outros efeitos iguais, no máximo uma vez.\n\nEssa habilidade pode ser utilizada uma quantidade de vezes igual a 1 + metade do seu atributo de Psique por descanso completo."}, {"nv": 11, "n": "Caçador de Lendas", "t": "A partir do 11º nível, sua experiência em caçadas lhe concede uma percepção aguçada para rastrear suas presas. Você recebe os seguintes benefícios:\n\nConsumindo 2 Pontos de Ação e 20 de Fluxo no seu turno, você pode focar sua Psique em detectar a presença de Oníricos em um raio igual ao seu atributo de Psique x100 em metros. A habilidade pode ser mantida de forma prolongada e para cada minuto ativo, ela consome 1 de Fluxo. \n\nVocê sabe a quantidade e a localização exata das criaturas, sendo capaz de perceber e seguir a direção de qualquer rastro deixado por elas dentro do alcance, mesmo que eles tenham sido escondidos por um Eco de Ocultação.\n\nEssa habilidade pode ser utilizada uma quantidade de vezes igual a 1 + metade do seu atributo de Psique por descanso completo."}, {"nv": 16, "n": "Adaptação Predatória", "t": "No 16º nível, suas habilidades como caçador atingem o ápice, permitindo que você se adapte para caçar qualquer tipo de Onírico. Ao enfrentar um Onírico marcado pelo seu Rito de Caça, você recebe os seguintes benefícios:\n\nSe ele possuir imunidade ao tipo de dano causado pelos seus golpes, você pode tratá-la como se fosse apenas uma resistência [essa resistência não é ignorada pelo Rito].\n\nUma vez por rodada, ao ser atingido por um ataque do alvo, você pode reduzir o dano levado pela metade. Esse efeito acumula com outros valores que também lhe concedam reduções de dano.\n\nAo provocar um Ferimento Crítico no alvo, você pode escolher qual ferimento será causado, escolhendo uma opção entre as rolagens de número 2 e 21 na lista de ferimentos críticos."}], "Exorcista": [{"nv": 1, "n": "Runas Sagradas", "t": "Começando no 1º nível, a Igreja lhe concede o conhecimento secreto para forjar runas sagradas imbuídas com sua fé e Fluxo. As runas possuem formas variadas, que unem símbolos sagrados para a fé católica da Santa Igreja.\n\nElas podem ser gravadas em objetos, estruturas ou até sob a pele de uma pessoa. Cada runa contém uma pequena habilidade psíquica, construída a partir de segredos guardados pelo alto clero. \n\nEstudos externos apontam que as runas sagradas funcionam de forma semelhante aos Ecos, mas por alguma razão, somente os Médiuns treinados pela Santa Igreja conseguem utilizá-las. \n\nAs runas seguem as seguintes regras:\n\nVocê conhece uma quantidade de runas igual ao seu atributo de Psique. \n\nElas são invisíveis para aqueles incapazes de perceber Fluxo. \n\nTodas são conjuradas a partir do toque de suas mãos, utilizando seu fluxo como tinta e seus dedos como pincéis.\n\nRunas marcadas como instantâneas consomem 1 ponto de ação imediato para serem conjuradas.\n\nRunas marcadas com um tempo de conjuração em minutos não consomem pontos de ação, mas exigem que você não realize nenhuma outra ação enquanto a conjura. \n\nO custo de Fluxo de uma runa só é cobrado no momento em que ela é conjurada, indicado entre colchetes. \n\nA maior parte das runas dura por até 7 dias depois de ser conjurada, se dissipando automaticamente no último dia. Algumas runas específicas se dissipam em um espaço menor de tempo, indico em suas descrições.\n\nDuas runas iguais não podem ser colocadas no mesmo espaço.\n\nRunas com efeitos em áreas tem como ponto central o local que você marcou com a runa.\n\nVocê deve rolar o ND sempre que uma runa pedir um teste de resistência."}, {"nv": 6, "n": "Domínio Sagrado", "t": "A partir do 6º nível, sua conexão com o divino é amplificada, transformando seu próprio corpo em um Domínio Sagrado capaz de expressar o poder de sua fé. Uma runa sagrada única se manifesta em uma parte do corpo à sua escolha, simbolizando a sua comunhão com Deus. \n\nPassivamente, essa runa sagrada emite uma aura imperceptível que cobre uma área em esfera centralizada em você, com um raio igual ao dobro do seu atributo de Psique. Essa área é tratada como um Domínio Sagrado, no qual sua fé é capaz de realizar pequenos milagres. \n\nVocê recebe uma quantidade de Dados de Intervenção equivalente à 1 + metade do seu atributo de Psique; esses dados são d6 [dados de seis lados]. De forma reativa, sempre que você ou uma criatura ao seu redor agir dentro do alcance do seu Domínio Sagrado, você pode consumir 1 ponto de ação e rolar um Dado de Intervenção para criar um dos seguintes efeitos:\n\nReduzir o resultado de uma rolagem qualquer feita por uma criatura.\n\nAumentar o resultado de uma rolagem qualquer feita por uma criatura.\n\nReduzir o dano causado por um único ataque ou habilidade psíquica. \n\nAumentar o dano causado por um único ataque ou habilidade psíquica.\n\nVocê recupera todos os seus dados ao realizar um Descanso Completo. Apenas um dado pode ser rolado separadamente para cada intervenção."}, {"nv": 11, "n": "Exorcismo", "t": "No 11º nível, sua autoridade sobre as forças do mal é ainda mais ampliada, permitindo que você exerça sua vontade sobre aqueles que estão possuídos por forças malignas. Você aprende a executar o ritual de exorcismo: \n\nConsumindo 2 pontos de ação e 10 de Fluxo no seu turno, você pode começar a recitar uma oração, que leva 3 turnos para se completar. Novos pontos de ação não são necessários nos turnos subsequentes.\n\nCaso você diga outras palavras fora do ritual, ou caso sofra uma condição ou efeito que o impeça de falar antes de completar a oração, seu efeito é cortado e você deve recomeçar, consumindo 2 pontos de ação novamente. \n\nSe criaturas afetadas por Possessores, Encostos, Invasores ou quaisquer outros Oníricos com habilidades de possessão ouvirem o ritual até o fim, os Oníricos serão expulsos de volta para a fenda, sendo enviado de volta para as profundezas do limbo e libertando os humanos afetados. \n\nUma pessoa liberta dessa forma não pode ser afetada pelo mesmo onírico novamente pelos próximos 7 dias.\n\nEssa habilidade pode ser utilizada uma quantidade de vezes igual a 1 + metade do seu atributo de Psique por descanso completo."}, {"nv": 16, "n": "Vontade Divina", "t": "Sua fé se torna absoluta e incontestável, ampliando a efetividade dos Milagres que você é capaz de operar. Você recebe a autoridade para executar a vontade de Deus na terra, melhorando as capacidades gerais do seu Domínio Sagrado. \n\nPassivamente, você recebe os seguintes benefícios: \n\nO valor base dos Dados de Intervenção aumenta de d6 para d10.\n\nO raio do seu Domínio Sagrado é expandido para 4x seu atributo de Psique.\n\nVocê pode gravar runas sagradas em qualquer ponto dentro do alcance do Domínio, sem a necessidade de tocar diretamente em uma criatura ou construto."}], "Veratem": [{"nv": 1, "n": "Grão-Mestre Psíquico", "t": "Ao ingressar na Ordem, você compreende que a única forma de alcançar a verdadeira essência do Fluxo é lapidando seus talentos até que alcancem a perfeição.\n\nLogo no 1º nível, você sabe como otimizar todo o processo de aprendizado e controle sobre as formas básicas de manipulação do Fluxo, conhecendo os caminhos mais eficazes para alcançar a mais alta mestria nessas capacidades.\n\nEscolha um Eco Psíquico entre: Revestimento, Manipulação, Detecção ou Ocultação. O custo de Pontos de Aprimoramento necessários para aumentar o nível do Eco é reduzido em -1, até no mínimo 1 de custo por nível. Graças a essa capacidade, a quantidade total de pontos de aprimoramento usados para se tornar Mestre em um Eco é reduzido de 6 para 4. \n\nAdicionalmente, ao aprimorar o eco selecionado para o Nível 3 - Mestre, você recebe uma habilidade especial com base no Eco escolhido, demonstrando seu domínio completo sobre ele.\n\nRevestimento: O bônus de dano do seu ataque revestido aumenta para +4.\n\nManipulação: O bônus de dano das suas habilidades psíquicas/eco de vínculo aumenta para +4.\n\nDetecção: A esfera da área de detecção é expandida para 10x seu atributo de psique. Adicionalmente, o Eco não consome mais nenhum Fluxo por permanecer ativo por longos períodos de tempo.\n\nOcultação: O custo de P.A necessário para ativar o Eco é reduzido para 0. Adicionalmente, ele não consome mais nenhum Fluxo por permanecer ativo por longos períodos de tempo."}, {"nv": 6, "n": "Desvio de Fluxo", "t": "Sua busca incansável pela Verdade Absoluta encontrou no desconhecido a resposta para todas as suas perguntas. \n\nNo 6º nível, você entende que a forma como a energia psíquica flui por debaixo da fenda não é muito diferente da forma como ela flui pelas mentes humanas. Em um movimento arriscado no seu turno, você pode consumir 1 ponto de ação para desviar parte do fluxo que permeia o Limbo, utilizando-o como se fosse seu, recebendo os seguintes benefícios:\n\nVocê adquire uma reserva temporária de Fluxo, que sempre é consumida antes do seu próprio Limite de Fluxo quando você utiliza uma habilidade psíquica.\n\nEssa reserva temporária possui um valor igual ao seu atributo de Psique x10.\n\nA reserva dura até que seja totalmente gasta ou até que você faça um descanso completo. \n\nEnquanto a reserva estiver ativa, você não pode ser receber mais fluxo temporário a partir de outras fontes.\n\nVocê recebe 1d6 de [In]Sanidade ao utilizar essa habilidade. \n\nEssa habilidade pode ser utilizada uma única vez por descanso completo."}, {"nv": 11, "n": "Zona de Entropia", "t": "A partir do 11º nível, o conhecimento adquirido ao longo da sua jornada lhe permite interagir com a camada inferior da Fenda de formas impossíveis para outros Médiuns, fornecendo-lhe um uso controlado daquilo que é naturalmente incontrolável. Ao ativar um Eco de Ruptura, sem consumir nenhum ponto de ação adicional, você pode escolher utilizar o próprio Limbo como ponte para conectar o mundo físico e a superfície da fenda, canalizando a desordem dessa dimensão para dentro do espaço isolado de sua ruptura.\n\nEsse recurso permite que você manifeste sua ruptura mesmo quando já está dentro da ruptura de outra criatura, sobrepondo-a automaticamente no processo. Se a outra criatura também for um Veratem que esteja utilizando essa habilidade, ambos devem realizar uma jogada com seus atributos de Psique. Aquele que obtiver o melhor resultado mantém sua ruptura de pé. \n\nAdicionalmente, ao utilizar essa habilidade, sempre que uma nova rodada de combate for iniciada dentro da sua ruptura, você deve rolar 1d12. Seu resultado definirá qual dos efeitos abaixo serão aplicados nessa rodada em questão:\n\n[1] - Você pode reorganizar a ordem das iniciativas, definindo a sequência nas quais os turnos irão ocorrer até o início da próxima rodada. \n\n[2] - Você identifica a localização exata de cada criatura dentro da ruptura, podendo inverter a posição de duas delas à sua escolha [mesmo que essas criaturas estejam ocultas por alguma habilidade]. \n\n[3] - Uma habilidade de Duração Prolongada que esteja sendo usada por uma criatura à sua escolha é desativada até o início da próxima rodada. Caso mais de uma habilidade esteja em uso, role um dado com uma quantidade de lados igual à quantidade de habilidades ativas para definir qual será desativada.\n\n[4] - Uma criatura à sua escolha consegue um Acerto Crítico na próxima rolagem que realizar até o início da próxima rodada [esse efeito não aplica ferimentos críticos e nem aumenta o dano, afetando apenas o resultado final da rolagem]. \n\n[5] - Uma criatura à sua escolha consegue uma Falha Crítica na próxima rolagem que realizar até o início da próxima rodada [esse efeito não reduz o dano, afetando apenas o resultado final da rolagem]. \n\n[6] - Uma criatura à sua escolha recebe o efeito de Intangibilidade até o início da próxima rodada.\n\n[7] - Uma criatura à sua escolha recebe o efeito de Invisibilidade até o início da próxima rodada.\n\n[8] - Todas as criaturas dentro da Ruptura recebem 1 Ponto de Ação adicional até o início da próxima rodada. \n\n[9] - Todas as criaturas dentro da Ruptura perdem 1 Ponto de Ação até o início da próxima rodada.\n\n[10] - Uma criatura à sua escolha dentro da Ruptura é congelada no espaço tempo até o início da próxima rodada. Ela não pode falar, se mover ou realizar ações, mas também se torna imune a todos tipos de ataques e habilidades psíquicas.\n\n[11] - A próxima habilidade utilizada ou ataque realizado por uma criatura à sua escolha dentro da ruptura é tem sua ativação duplicada. Isso não consome mais pontos de ação ou fluxo. A duplicata da habilidade/ataque é direcionada ao mesmo alvo da versão original.\n\n[12] - Você pode escolher qual das habilidades anteriores será utilizada. \n\nEssa habilidade pode ser utilizada uma vez por descanso completo."}, {"nv": 16, "n": "Axioma do Limbo", "t": "Já no 16º nível, seus estudos em torno do Limbo alcançaram o ápice do desenvolvimento. Suas pesquisas em torno daquilo que existe embaixo da Fenda te levaram a alcançar os Segredos Fundamentais dessa dimensão, permitindo que seu domínio sobre ela alcance um novo patamar.\n\nA descoberta desses segredos lhe concedem os seguintes benefícios:  \n\nVocê não sofre mais nenhum acúmulo de [In]Sanidade ao utilizar o Desvio de Fluxo.\n\nA Zona de Entropia é ativada automaticamente sempre que você utiliza um eco de ruptura, expandindo sua quantidade diária de usos.\n\nApós ativar uma ruptura, consumindo 2 Pontos de Ação e 10 de Fluxo no seu turno, você pode reposicionar a esfera da ruptura, utilizando o próprio Limbo como canal para saltar pelo espaço em tempo real, junto com todas as criaturas dentro dela. \n\nA distância máxima na qual uma ruptura pode ser movida é igual ao seu atributo de Psique x100 em quilômetros.\n\nO reflexo espacial dentro da Ruptura é apagado enquanto ela se move pelo Limbo, tornando uma zona de Escuridão Total. Quando ela chega ao seu destino, o espaço é atualizado e refletido novamente em seu interior.\n\nQuando a Ruptura se encerra, todos os que estavam dentro dela são imediatamente transportados para as novas coordenadas no mundo físico, com base na posição em que estava dentro do reflexo."}], "Sensitivo": [{"nv": 1, "n": "Zona de Empatia", "t": "Já no 1º nível, o mundo inteiro pulsa dentro de sua mente, como se seus sentimentos estivessem intrinsecamente ligados àqueles próximos de você. Passivamente, sua Psique é capaz de detectar toda a carga emocional que preenche o ambiente em torno de você, sentindo as emoções predominantes em humanos, médiuns e Oníricos ao seu redor.\n\nSua sensibilidade emocional se estende por um raio igual ao dobro do seu atributo de Psique em metros, lhe concedendo os seguintes benefícios:\n\nSe você possuir um Eco de Detecção, o alcance de ambas as habilidades são somados ao ativar o Eco. \n\nVocê sempre detecta a localização de fontes de Fluxo automaticamente dentro do alcance da sua empatia, além de receber vantagem para detectar qualquer fonte que tenha sido suprimida ou escondidas a partir de de um Eco de Ocultação ou habilidade parecida. Isso permite que você detecte com precisão a localização criaturas vivas sem depender de seus sentidos básicos [como visão e audição], não recebendo nenhum malefício ao lidar com outros seres invisíveis ou em lugares escuros ou que atrapalhem sua audição.\n\nVocê identifica com precisão a emoção predominante em um Onírico, rastro ou fonte de Fluxo, determinando se ele foi criado a partir de uma emoção primária dentre Medo, Raiva, Tristeza e Nojo, ou se ela vem um Médium.\n\nVocê sente automaticamente as emoções manifestadas na mente de um humano, recebendo informações constantes que te ajudam a identificar quando uma pessoa está com medo, cansada, triste ou alegre, mesmo que ela não demonstre essas informações de forma explícita."}, {"nv": 6, "n": "Vislumbres do Passado", "t": "Todo lugar guarda cicatrizes emocionais de quem já passou por ele, e você aprendeu a lê-las.\n\nA partir do 6º nível, ao consumir 10 de Fluxo e se concentrar por pelo menos 1 minuto em uma área dentro do alcance da sua Zona de Empatia, você pode captar fragmentos de memórias emocionais deixadas por seres que ali estiveram. Durante esse período, você não pode executar nenhuma outra ação, nem mesmo as de custo 0. \n\nAo final da ativação, você recebe vislumbres sensoriais deixados pelos resquícios emocionais de cada criatura que passou pela região. Esses vislumbres são como memórias vagas, gravadas no próprio ambiente. Eles são formados por:\n\nImagens borradas das pessoas que passaram por ali, incluindo as cores de suas roupas, cabelo e pele\n\nTraços superficiais de aparência, como formato do penteado e das roupas \n\nVozes e frases que tenham sido ditas durante momentos de elevação emocional [como um grito de socorro, uma discussão ou debate, um choro de tristeza, um discurso de ódio, uma declaração de amor, etc]\n\nInformações referentes as emoções mais fortes que preencheram aquela região dentro do período analisado\n\nEsses vislumbres abrangem qualquer evento que tenha ocorrido dentro de uma quantidade de horas igual ao dobro do seu atributo de Psique antes da habilidade ser ativada. \n\nVocê pode utilizar essa habilidade uma quantidade de vezes igual à 1 + metade do seu atributo de Psique por descanso completo."}, {"nv": 11, "n": "Por Trás da Máscara", "t": "No 11º nível, você se torna capaz de sondar mais do que apenas as emoções de uma pessoas, ouvindo e enxergando coisas que se escondem muito além do que outras pessoas são capazes de ver.\n\nConsumindo 10 de Fluxo no seu turno, você expande ainda mais a eficácia sensorial da sua Zona de Empatia.  \n\nAo final da ativação, você consegue realizar uma leitura profunda da Psique analisada, adquirindo as seguintes informações:\n\nVocê descobre o alinhamento de cada criatura dentro da área, sabendo se são más, boas ou neutras.\n\nVocê pode ouvir os pensamentos de cada criatura dentro da área (ao mesmo tempo ou não), sendo capaz de filtrar apenas as informações que forem do seu interesse. \n\nSempre que a criatura falar em sua presença, você sabe se ela está dizendo a verdade ou mentindo.\n\nVocê identifica a forma como as emoções internas dela estão fluindo, percebendo com clareza as suas verdadeiras intenções (ex: sem nenhum objetivo de cumprir com a palavra, tramando uma traição, omitindo informações, prestes a executar um ato que vai contra o que foi dito, etc). \n\nVocê pode utilizar essa habilidade uma quantidade de vezes igual à 1 + metade do seu atributo de Psique por descanso completo."}, {"nv": 16, "n": "Indução Emocional", "t": "No 16º nível, você deixa de ser apenas um observador das emoções, tornando-se capaz de ditar o ritmo com que elas fluem.\n\nConsumindo 2 P.A e 30 de Fluxo no seu turno, você pode interferir diretamente na carga emocional de criaturas dentro da área da sua Zona de Empatia, manipulando os sentimentos que sustentam suas ações. A quantidade de criaturas que podem ser afetadas simultaneamente é igual à metade do seu atributo de Psique.\n\nAo ativar essa habilidade, você deve escolher entre uma das emoções à seguir, que terá seu efeito aplicado sobre os alvos.\n\nMedo: o alvo fica perturbado por uma sensação constante de medo. Na próxima vez que iniciar um turno dentro da Zona de Empatia, ele entrará em pânico, ficando sob a condição de Intimidado até o fim da primeira rodada. Você é a fonte da intimidação.\n\nRaiva: o alvo é inflamado por um ódio descontrolado. Na próxima vez que iniciar um turno dentro da Zona de Empatia, ele entrará em fúria, consumindo todos seus pontos de ação para atacar a criatura mais próxima dele.\n\nTristeza: o alvo é tomado por um breve colapso emocional. Na próxima vez que iniciar um turno dentro da Zona de Empatia, ele não será capaz de ativar seu Estigma, Runas Derivadas, Anátema ou suas Variações até que encerre o turno.\n\nNojo: o alvo é tomado por sensações viscerais de repulsa. Na próxima vez que iniciar um turno dentro da Zona de Empatia, ele receberá desvantagem em todas as jogadas realizadas até que encerre o turno.\n\nEssa habilidade pode ser utilizada uma vez por descanso completo. \n\nOníricos são imunes a Induções Emocionais equivalentes à emoção que os formou."}], "Navegador": [{"nv": 1, "n": "Assincronia", "t": "Sua mente está enraizada na Fenda, fazendo com que seu Reflexo Psíquico esteja constantemente projetado do outro lado. Ele permanece invulnerável enquanto não for acessado diretamente a partir de um Eco de Projeção, mas se move de acordo com seu corpo no mundo físico quando você está acordado.\n\nNo 1º nível, você adquire os seguintes benefícios:\n\nPassivamente, seu reflexo e seu corpo real se movem sem nenhum atraso dentro e fora da fenda, ignorando o atraso normalmente causado pela diferença entre a passagem de tempo.\n\nUma vez por rodada, sem consumir nenhum ponto de ação ou fluxo, você pode compartilhar sua consciência entre a fenda e o mundo real até o início do seu próximo turno. Durante esse período, você não fica inconsciente, mas enxerga, ouve e percebe a fenda e o mundo material simultaneamente, adaptando seu cérebro à diferença no fluxo temporal entre as duas dimensões, como se você estivesse além do tempo.\n\nVocê não recebe nenhum acúmulo de [In]Sanidade quando utiliza um Eco de Projeção.\n\nDurante uma Projeção, você pode interagir fisicamente de forma responsiva com os reflexos do mundo na Fenda. Os reflexos de portas, torneiras e outros objetos podem ser movidos diretamente pela Fenda, sem que suas versões originais no mundo material precisem se mover primeiro. Portas e janelas podem ser abertas mesmo que estejam trancadas no mundo real, desde suas fechaduras não possuam nenhum mecanismo complexo que exija mais do que uma simples chave.\n\nAo interromper o contato com o reflexo de um objeto movido dentro da Fenda, ele retorna para o ponto onde estava antes de ser tocado caso você não interaja novamente com ele dentro do próximo minuto."}, {"nv": 6, "n": "Arquiteto Psíquico", "t": "A partir do 6º nível você se torna capaz de moldar o espaço da Fenda, distorcendo sua geometria através da força de vontade da sua Psique. Durante um Eco de Projeção, a influência dos seus poderes pode provocar os seguinte efeitos: \n\nVocê pode abrir passagens em paredes, muros ou outras obstruções que interrompam seu caminho, simplesmente tocando nessas estruturas. As passagens possuem um diâmetro ajustável, de acordo com as necessidades da situação. \n\nVocê pode modelar o espaço tocado pelas suas mãos, moldando-o de acordo com sua vontade. Isso pode ser usado para alterar a aparência de um local, reposicionar corredores, portas ou paredes, ou até mesmo unir dois cômodos separados em um só [não é possível desconectar partes de estruturas e movê-las de forma ofensiva para ferir um alvo através da capacidade de modelar o espaço]. \n\nVocê consome 3 de Fluxo e leva 1 minuto para cada metro quadrado de ambiente manipulado, no qual nenhuma outra ação pode ser realizada, incluindo as de custo 0. Caso outras ações sejam realizadas nesse intervalo, o processo é interrompido e você deve recomeçar.\n\nEssas alterações não mudam a realidade do mundo físico, mas permanecem estáveis dentro da Fenda enquanto sua Projeção estiver ativa, permitindo explorar atalhos, encurtar caminhos ou confundir qualquer perseguidor que ouse segui-lo."}, {"nv": 11, "n": "Entre Dois Mundos", "t": "Seguindo para o 11º nível, sua ligação com a Fenda se torna ainda maior, permitindo suas interações simultâneas entre ambas as dimensões sejam amplificadas.\n\nConsumindo 1 ponto de ação e 10 de Fluxo no seu turno, você amplifica a conexão entre seu corpo físico e o seu Reflexo na Fenda ao longo do próximo minuto no mundo material [1 hora na fenda]. Esse efeito te concede os seguintes benefícios: \n\nSeu Instinto Passivo/Ativo e Seus Ecos de Detecção captam fluxo dentro e fora da fenda simultaneamente. \n\nSuas capacidades de mover objetos refletidos [Assincronia] e moldar o espaço [Arquiteto Psíquico] dentro da fenda podem ser utilizadas sem a necessidade de tocar diretamente nos construtos, como uma telepatia com um raio igual ao dobro do seu atributo de Psique. \n\nA quantidade de objetos com os quais você pode interagir simultaneamente durante essa habilidade é igual ao seu atributo de Psique. As interações podem ser realizadas uma vez por rodada. Esses objetos ainda voltam às suas posições originais caso excedam o limite de tempo sem interações.\n\nA quantidade de metros quadrados manipulados por minuto para moldar o espaço também é amplificada durante essa habilidade, sendo igual ao seu atributo de Psique.\n\nAo mover um objeto dentro da fenda durante o uso dessa habilidade, você pode fazer com que esse movimento seja refletido no objeto original presente no mundo físico [apenas objetos soltos sofrem esse efeito, não sendo válido para construtos inteiros].  \n\nCaso essa habilidade seja ativada enquanto você ainda está acordado, seus ataques, estigma e runas podem ser ativados dentro e fora da fenda ao mesmo tempo, permitindo que você enfrente um Onírico na fenda sem usar um Eco de Projeção.\n\nEssa habilidade pode ser utilidade uma quantidade de veze igual a metade do seu atributo de Psique por descanso completo,"}, {"nv": 16, "n": "Pontos de Salto", "t": "Já no 16º nível, a Fenda é quase como seu verdadeiro lar. Enquanto utiliza um Eco de Projeção, você aprende a identificar cada detalhe gravado em sua estrutura, reconhecendo a existência de Fissuras Espaciais, pequenos pontos frágeis e instáveis que estão espalhados pelo solo de toda a Fenda, mas invisíveis para outros Médiuns. \n\nEsses pontos funcionam como pequenos túneis dimensionais capazes de encurtar o espaço para percorrer muitos quilômetros em poucos segundos. Você sempre sabe onde encontrar uma Fissura. No seu turno, sem consumir nenhum ponto de ação, você pode realizar as seguintes rolagens para encontrar a fissura mais próxima:\n\n1d100 para definir a distância em metros entre você e a fissura.\n\n1d8 para definir a direção na qual ela está:\n\n[1] Norte\n\n[2] Nordeste\n\n[3] Leste\n\n[4] Sudeste \n\n[5] Sul\n\n[6] Sudoeste\n\n[7] Oeste \n\n[8] Noroeste\n\nUma vez que acesse uma Fissura Espacial, você pode levar um número de criaturas voluntárias igual ao seu atributo de Psique, ligando-as ao seu Fluxo.\n\nConsumindo 2 pontos de ação e 20 de Fluxo no seu turno, você pode ajustar as coordenadas da fissura para saltar pelo espaço, abrindo um caminho instantâneo que te leva até um ponto à sua escolha dentro de um alcance igual ao seu atributo de Psique x100 em quilômetros. \n\nPara chegar a um destino específico, você deve conhecer a localização de forma precisa ou pelo menos já tê-la visto ou visitado. Caso contrário, você pode apenas escolher uma direção e a distância que quer percorrer por ela, saltando para um ponto não especificado dentro dessas especificações.\n\nVocê pode utilizar essa habilidade uma quantidade de vezes igual ao seu atributo de Psique por descanso completo."}], "Mercenário": [{"nv": 1, "n": "Senhor da Guerra e Efeito Passivo - Rede da Meia Noite", "t": "✦ EFEITO PASSIVO - REDE DA MEIA NOITE\n\nNo 1º nível, sempre que chegar em uma cidade com um Bar da Meia-Noite, você sabe onde e a quem procurar para obter contratos exclusivos, mercadorias, serviços ou informações. Esses informantes são chamados de Canais, pessoas diretamente ligadas aos Bares de cada região e seus respectivos Diretores. \n\nVocê possui um nível de Credibilidade em cada cidade visitada que possua um bar da meia noite, que começa em 1 e pode aumentar até 100. Sua credibilidade sobe à medida que você cumpre um contrato fornecido por um Canal ou uma missão importante da campanha principal, que tenha ocorrido dentro de um território monitorado por um Bar da Meia-Noite. A quantidade de Credibilidade ganha depende do nível de dificuldade atribuído pelo mestre ao contrato/missão em específico, da seguinte maneira: \n\n• Fácil: +1 de credibilidade \n\n• Equilibrado: +5 de credibilidade\n\n• Difícil: +10 de credibilidade\n\n• Mortal: +20 de credibilidade \n\nNarrativamente, seu nível de Credibilidade influencia sua relação com os Canais da seguinte forma:\n\n• Nível 1 a 25: seus primeiros passos ainda estão sendo dados, as pessoas podem não te ver com muito potencial. Você conhece Canais que podem te fornecer documentos falsos, informações de endereços, nomes e locais frequentados por um alvo. Você pode comprar equipamentos e artefatos de Rank C. \n\n• Nível 26 a 50: seu nome começa a circular entre algumas bocas nos Bares da Meia-Noite. Os canais agora te oferecem serviços médicos exclusivos, com médiuns habilitados em técnicas de cura. Além disso, você agora pode comprar equipamentos e artefatos de Rank B. \n\n• Nível 51 a 75: seu nome e seus feitos agora são conhecidos por algumas figuras relevantes nos Bares da Meia-Noite. Você pode receber contratos exclusivos, que oferecem recompensas superiores ao de um contrato comum.\n\n• Nível 75 a 99: os Bares da Meia-Noite te reconhecem como um mercenário excepcional no que faz. Seu canais te fornecem informações privilegiadas sobre seu alvo, como imagens de câmeras públicas, registros de compras online e transações bancárias de referentes a um alvo. Você agora pode comprar equipamentos e artefatos de Rank A.  \n\n• Nível 100: todos sabem que você sempre cumpre um contrato, independente das circunstâncias. Você recebe um desconto de 50% em todo serviço ou equipamento fornecido em um bar da Meia-Noite. \n\n✦ SENHOR DA GUERRA\n\nTambém no 1º nível, você aprendeu que a diferença entre viver e morrer é saber usar tudo o que está ao seu alcance para sobreviver, seja seu corpo, suas armas, suas habilidades de luta, um objeto largado perto de você ou até mesmo as técnicas de combate demonstradas pelos seus inimigo. \n\nVocê adquire o seguinte recurso:\n\n• Você adquire proficiência com todos os tipos de armas, mesmo que não ainda não tenha uma Especialização específica para usá-las. Isso te concede os bônus em jogadas de ataque concedidos pelas especializações.\n\n• Você pode usar objetos improvisados [canos, cadeiras, pedras ou pedaços de ferro] como armas; o mestre determina a categoria [leve, média, pesada] e o tipo de dano [cortante, perfurante, contundente]. Você é proficiente com essas armas. \n\n• Você adquire uma habilidade gratuita pertencente a qualquer uma das Especializações, mesmo que não tenha nenhum nível nela. Você ganha uma habilidade adicional nos níveis 6, 11 e 16."}, {"nv": 6, "n": "Arma de Assinatura", "t": "Apesar de ser capaz de transformar qualquer objeto na sua mão em uma arma mortal, com o tempo, você desenvolveu afinidade e maestria com alguns tipos específicos de armas, que se tornaram a sua assinatura pessoal. Parte da sua fama no submundo está relacionada ao quão proficiente você é quando utiliza essas armas para eliminar seus alvos. \n\nNo 6º nível, você pode escolher entre Combate Desarmado ou um tipo de arma entre Armas de Fogo ou Armas Marciais Corpo a Corpo, Arremessáveis ou à distância, além de uma categoria entre Leve, Médio e Pesado para o tipo de arma selecionado. Essa se tornará sua Arma de Assinatura. Você pode escolher uma nova arma no nível 11 e uma no nível 16. \n\nEnquanto empunhar uma Arma de Assinatura, você recebe um Talento de Assinatura, com base no tipo e categoria da arma escolhida. A lista de talentos pode ser conferida abaixo."}, {"nv": 11, "n": "Matador de Aluguel", "t": "Você se tornou um especialista em eliminar outros Médiuns. Você entende perfeitamente como o fluxo circula pelo corpo de seus alvos, e sabe muito bem como atrapalhar essa circulação de forma desonesta, utilizando técnicas sujas que você aprendeu depois de muitos anos nessa vida.\n\nA partir do 11º nível, você ganha acesso a uma lista de Pontos de Supressão, locais que você pode atingir para atrapalhar o fluxo de um alvo quando acertá-lo com um ataque. Pontos de Supressão podem ser atingidos apenas uma vez por rodada, como parte de uma jogada de ataque desarmado ou com arma marcial ou de fogo, ao custo de 1 PA adicional que pode ser gasto após verificar se o ataque acertou ou errou. Eles só são eficazes contra Médiuns ou contra alguém possuído por um Possessor.\n\nTodos os Pontos de Supressão pedem um teste de resistência de Corpo. O ND para os testes pode ser equivalente ao resultado da sua rolagem para acertar o ataque ou pode ser rolado separadamente após atingir o inimigo, utilizando seu atributo de Força ou Agilidade [escolha apenas entre os dois, que será definido como o atributo permanente para esses testes]."}, {"nv": 16, "n": "Mestre das Armas e Efeito Passivo - Lenda do Submundo", "t": "Efeito Passivo - Lenda do Submundo\nSua credibilidade se espalha por toda a Associação da Meia-Noite. Todo Diretor ou figura importante da Associação já ouviu falar do seu nome pelo menos uma vez na vida. \n\nSeus feitos e conquistas são comentados por todos os locais afiliados à Associação, fazendo com que a sua Credibilidade de maior nível se torne um recurso em escala global. \n\nA partir disso, seus níveis de Credibilidade deixam de ser separados para cada cidade visitada, fazendo com seus talentos como mercenário sejam reconhecidos em qualquer região do mundo. \n\nMestre das Armas\nVocê alcançou o domínio absoluto sobre sua Arma de Assinatura. O aço, o gatilho ou a lâmina não são mais ferramentas — são extensões do seu próprio corpo, instrumentos moldados pela sua vontade.\n\nA partir do 16º nível, você recebe os seguintes benefícios:\n\nSeus ataques com a Arma de Assinatura ignoram qualquer resistência relacionada ao tipo de dano que ela causa [físico, cortante, perfurante, etc]. Além disso, quando enfrenta criaturas que possuam imunidade a esse tipo de dano, elas passam a receber metade do dano em vez de anulá-lo completamente [não se aplica ao tentar ferir um onírico com um ataque sem Fluxo]. \n\nUma vez por combate, ao realizar uma jogada de ataque com sua Arma de Assinatura, você pode declarar um Golpe Perfeito antes de rolar os dados. Esse ataque acerta automaticamente [sem necessidade de rolagem]. Ele não causa dano pela diferença dos dados, mas ativa todos os efeitos adicionais do ataque [Pontos de Supressão, habilidades de Especialização, runas ligadas à arma, ou qualquer outro efeito de impacto em acerto."}], "Andarilho": [{"nv": 1, "n": "Passiva - Invasor Invisível e Autoimagem Psíquica", "t": "Passiva - Invasor Invisível\nComeçando pelo 1º nível, sua presença não é detectada ao acessar uma Paisagem Mental através um Reflexo Psíquico, mesmo em caso de falha durante a rolagem de Invasão. Você permanece oculto, invisível e com seu fluxo em um estado indetectável, não chamando a atenção do subconsciente nem sendo revelado como invasor. \n\nSempre que invade uma paisagem mental, recebe um “relatório psíquico” imediato contendo:\n\nO mapa mental do sonho em andamento, que detalha a estrutura e extensão de cada ambiente formado dentro da Paisagem Mental (incluindo suas subcamadas, caso existam).\n\nA quantidade e direção aproximada de Oníricos invasores (se houver).\n\nA quantidade e direção aproximada de Médiuns invasores (se houver, não inclui outros Andarilhos).\n\nA quantidade e direção aproximada de armadilhas psíquicas e mecanismos de defesa mental que possam atrapalhar o seu caminho.\n\nAutoimagem Psíquica\nTambém no 1º nível, sua consciência é constantemente dividida em duas partes quando você está acordado. Uma delas permanece ativa no mundo físico, mantendo o controle sobre seu corpo e sobre a ações tomadas nesse plano. A outra permanece projetada no interior de sua paisagem mental, como uma eterna guardiã da sua Psique. Ambas as partes da sua consciência permanecem interconectadas. \n\nGraças a sua dupla consciência, você se torna capaz de projetar sua Autoimagem Psíquica sobre a mente de um alvo, interferindo na Paisagem Mental de um Médium ou no Núcleo Psíquico de um Onírico para gerar determinados efeitos. Essas capacidades te dão acesso à lista de Ações Psíquicas, um grupo específico de ações que podem ser executadas consumindo P.A e Fluxo.\n\nEssas ações podem ser utilizadas contra alvos únicos que estejam dentro do seu campo de visão em um alcance igual ao seu dobro do seu atributo de Psique. Uma mesma Ação Psíquica não pode ser realizada mais de uma vez por rodada. \n\nDeterminadas Ações Psíquicas solicitam testes de resistência. Você pode rolar os testes utilizando o mesmo modificador definido para o ND do Seu Estigma e Runas derivadas."}, {"nv": 6, "n": "Extração Psíquica", "t": "A partir do 6º Nível, as habilidades Invasor Invisível e Autoimagem Psíquica são fortalecidas, recebendo benefícios adicionais quando são utilizadas.\n\nInvasor Invisível: \n\nAo acessar Paisagem Mental de um Médium durante um sonho, você pode consumir 2 P,A no seu turno para identificar uma rota que te leve até o Núcleo do Inconsciente, a região mais profunda da mente. Uma vez que alcance esse local, você pode localizar e copiar informações específicas gravadas na memória do sonhador, especificando para o Mestre o que exatamente você deseja procurar.\n\nA quantidade de informações que podem ser copiadas é iguais à metade do seu atributo de Psique. A clareza do que é extraído depende da objetividade da sua busca. Quanto mais direto for o pedido, mais precisa será a resposta.\n\nAutoimagem Psíquica \n\nConsumindo 2 P.A e 15 de Fluxo no seu turno, você pode utilizar uma Ação Psíquica para invadir momentaneamente a psique de um alvo, extraindo informações sobre seu Estigma [caso seja um Médium] ou Anátema [caso seja um Onírico], recebendo os seguintes dados:\n\nA função mecânica do Estigma ou Anátema.\n\nA quantidade de Runas do Estigma ou variações do Anátema, além das funções mecânicas de cada uma.\n\nAs seguintes regras específicas de cada uma das habilidades: propriedades de reação/passiva, área de efeito, quantidade de alvos, alcance e duração.\n\nCada uma das habilidades anteriores pode ser utilizada uma única vez por descanso completo."}, {"nv": 11, "n": "Ladrão de Memórias", "t": "No 11º, as habilidades adicionais concedidas pela Extração Psíquica são fortalecidas.\n\nInvasor Invisível\n\nAo utilizar a Extração Psíquica para copiar uma informação gravada na memória de um Médium ao acessar seu Núcleo do Inconsciente, você opcionalmente removê-la da psique do alvo, apagando a informação no processo.\n\nSe o alvo for humano comum, a exclusão é automática.\n\nSe o alvo for um médium, você e ele fazem uma rolagem de Psique.\n\nSe seu resultado for superior, a exclusão é bem-sucedida.\n\nSe seu resultado for inferior, a exclusão falha e sua presença é revelada imediatamente ao alvo.\n\nNão é possível apagar memórias que sustentam habilidades ou mecanismos essenciais do médium.\n\nAutoimagem Psíquica \n\nAo utilizar a Extração Psíquica para obter informações sobre um Estigma ou Anátema, você pode consumir 20 de Fluxo adicional para tentar apagar temporariamente uma habilidade que pertença a uma Runa derivada do Estigma ou variação do Anátema [não inclui suas habilidades primárias]. Você e o alvo fazem uma rolagem de Psique.\n\nSe seu resultado for superior, a exclusão é bem-sucedida.\n\nSe seu resultado for inferior, a exclusão.\n\nA runa ou variação apagada volta ao normal assim que o alvo afetado termina um descanso completo.\n\nCada uma das habilidades anteriores pode ser utilizada uma única vez por descanso completo."}, {"nv": 16, "n": "O Autor de Sonhos", "t": "Já no 16º nível, ao utilizar a habilidade Ladrão de Memórias, ao apagar uma memória depois de copiá-la, você pode substituí-la por uma memória falsa, plantada diretamente no Núcleo do Inconsciente do alvo. \n\nA memória inserida é indistinguível de uma verdadeira, sendo aceita pela psique como fato vivido. Emoções podem ser acopladas para reforçar sua autenticidade. Você deve ser o mais específico possível na criação dessa memória.\n\nContra humanos comuns, a implantação é automática.\n\nContra médiuns: é feita a mesma rolagem de Psique da habilidade anterior.\n\nEm caso de falha, a memória não é implantada e você revelado ao alvo.\n\nEssa aplicação só é válida ao utilizar o recurso de Invasor Invisível, não se aplicando à Autoimagem Psíquica."}], "Mestiço": [{"nv": 1, "n": "Aura Negativa e Mutação Onírica", "t": "Aura Negativa\nLogo no 1º nível, sua presença distorce as emoções daqueles ao seu redor, fazendo com que o seu Fluxo se espalhe e infiltre a Psique de um humano comum à medida que ele passa mais tempo perto de você. Esse é um processo inconsciente e impossível de ser controlado, causando os seguintes efeitos:\n\nSempre que um humano comum dormir em um raio de até 1km de você, ele terá um pesadelo angustiante. Role 1d4 para definir uma emoção primária vinculada ao pesadelo, sendo: [1 - medo, 2 - raiva, 3 - tristeza ou 4 - nojo].\n\nUma vez por noite, caso haja no mínimo 1 Reflexo Nebuloso projetado na fenda em um raio de até 1km da sua posição, você deve fazer uma rolagem com seu atributo de Psique contra um ND igual a 8 + Seu estágio de [In]sanidade para tentar controlar sua fome de Fluxo. \n\nEm uma falha, você deve se alimentar antes do amanhecer, tocando em uma pessoa que esteja passando por um pesadelo ou em um Reflexo Nebuloso manifestado na Fenda, A partir desse processo, você se conecta à Paisagem Mental do indivíduo até que ele acorde, presenciando seus sonhos ruins e se alimentando de toda a negatividade produzida dentro deles. O Fluxo negativo tem um ótimo gosto para você. \n\nEsse processo restaura 100% das suas reservas de Fluxo caso já não estejam completas.  \n\nUma pessoa que tenha seus pesadelos devorados sofre sintomas que podem durar por várias horas após o despertar. Esses sintomas incluem: dores no corpo, enjoo, enxaquecas e fadiga mental.\n\nSe você se recusar a devorar um pesadelo após falhar no rolagem, você sofre 1d4 de [In]sanidade. \n\nMutação Onírica\nTambém no 1º nível, seu lado Onírico gera mutações visíveis no seu corpo, que te tornam fisicamente diferente de um ser humano comum. À medida que você progride, novas mutações podem se manifestar no seu corpo, alterando ainda mais a sua fisiologia.\n\nVocê possui uma quantidade de mutações igual a 1 + metade do seu atributo de Psique.\n\nOs bônus concedidos pelas mutações acumulam com outros bônus iguais."}, {"nv": 6, "n": "O Outro Lado", "t": "Seu lado Onírico desperta em razão do crescimento de seu poder. Uma figura com aspectos similares ao Possessor que te trouxe ao mundo se manifesta dentro da sua paisagem mental toda vez que você dorme, sussurrando na sua mente, te oferecendo poderes além da compreensão. Mesmo sendo capaz de controlar seu sonho lúcido, você nunca consegue se livrar dessa figura.\n\nNo 6º nível, quando se sentir sem saída em um combate, você pode clamar pela sua contraparte onírica, pegando o poder dela emprestado em troca de degradar sua própria mente, permitindo que você use as seguintes habilidades: \n\nRegeneração: Consumindo 1 ponto de ação no seu turno, você recupera uma quantidade de vida igual ao seu atributo de psique x5.\n\nRestauração: Consumindo 1 ponto de ação no seu turno, você recupera uma quantidade de fluxo igual ao seu atributo de Psique x10. \n\nLibertação [propriedade reativa]: Consumindo 1 ponto de ação, você se liberta de uma condição ou efeito de controle/enfraquecimento. \n\nAtaque Maximizado: Consumindo 1 ponto de ação adicional ao acertar um ataque no seu turno, o dano dele é dobrado mas ele não pode atingir um acerto crítico. \n\nProteção [propriedade reativa]: Consumindo 1 ponto de ação, você pode neutralizar o dano causado por um ataque antes que o mestre te diga o valor do dano. Se o ataque for um acerto crítico, o dano adicional não é negado. \n\nSempre que utilizar uma dessas habilidades, você sofre 1d6 de [In]Sanidade automaticamente. \n\nEsse recurso pode ser utilizado uma quantidade de vezes igual à metade do seu atributo de Psique por descanso completo. Uma mesma opção de habilidade não pode ser utilizada mais de uma vez por combate."}, {"nv": 11, "n": "Pesadelo Vivo", "t": "Sua Psique se torna cada vez mais ligada ao seu lado Onírico, que constantemente exerce uma influência maior sobre a sua humanidade. É como se uma parte de você estivesse constantemente tentando devorar a outra. Mas ainda assim, você persiste, você não pode se dar ao luxo de ceder... Ou será que pode? \n\nA partir do 11º nível, você pode consumir 2 pontos de ação e 40 de Fluxo no seu turno para liberar seu Onírico Interior, manifestando-o como uma transformação parcial que cobre seu corpo até que você atinja seu Limite de Fluxo ou fique inconsciente. Durante esse período de tempo, você fica sob os seguintes efeitos:\n\nVocê consome 10 de Fluxo passivamente a cada rodada [não pode ser reduzido]\n\nVocê regenera uma quantidade de PV igual ao seu atributo de Psique sempre inicia um turno\n\nSeus atributos físicos [corpo, força e agilidade] recebem um bônus de +2 [pode acumular com outros bônus, também aumenta atributos derivados temporariamente]\n\nUma vez por rodada, você tem vantagem um teste de resistência contra um efeito qualquer\n\nNos turnos subsequentes após a ativação da habilidade, você possui 50% de chance de perder o controle para o outro lado. Sempre que iniciar seu turno, role 1d12 para saber o que irá acontecer.\n\nSe seu resultado for igual ou menor a 6, você perde o controle, deixando de diferenciar amigos e inimigos e atacando a criatura mais próxima do seu alcance. Se seu resultado for superior a 6, você mantem o controle sobre si mesmo.\n\nCaso você esteja sob o controle da transformação, você pode desativá-la voluntariamente no seu turno. Essa habilidade não pode ser utilizada novamente até que você faça um descanso completo."}, {"nv": 16, "n": "Autocontrole", "t": "Seu domínio sobre sua parte onírica cresce à medida que sua Psique se sobressai contra o outro lado.\n\nUma vez por descanso completo, você pode utilizar uma das habilidades listadas no 6º nível dessa origem sem sofrer nenhum acúmulo de [In]Sanidade. Adicionalmente, você não corre mais nenhum risco de perder o controle sempre que utiliza sua habilidade de 11º nível."}], "Oráculo": [{"nv": 1, "n": "Olhos no Futuro e Eterna Mudança", "t": "Olhos no Futuro\nLogo no 1º nível, seu cérebro se conecta à uma zona desconhecida da Fenda, que está diretamente ligada à forma como o tempo flui a partir do Fluxo que conecta ambos os mundos.\n\nAo iniciar um Sonho Lúcido durante descanso completo, você obtém pequenos vislumbres de eventos futuros, que surgem em sua Paisagem Mental como fragmentos de imagens borradas, sons e sensações. \n\nConceitualmente, sempre que você dormir, o Mestre da sua campanha pode lhe conceder pequenas previsões de eventos que ocorrerão dentro de no máximo 7 dias. Essas previsões são trazidas à você de forma enigmática, sendo tratadas como representações de possibilidades do futuro, que devem estar relacionadas direta ou indiretamente ao seu personagem ou ao núcleo central de eventos da campanha. \n\nCabe ao Mestre definir de que maneira cada visão será influente ao longo de uma sessão, dependendo da precisão da sua descrição, da natureza dos eventos visualizados e do tempo que se passará até que eles ocorram. Por serem possibilidades, esses eventos podem ou não vir a ocorrer. \n\nPor exemplo, ao iniciar uma investigação prevista, o mestre pode permitir que você saiba onde e o que exatamente procurar. Alternativamente, o mestre pode te informar se determinadas situações previstas te causam boas ou más sensações; se um evento ou escolha tem tendência a dar certo ou errado; ou mesmo se algo está prestes a acontecer com você ou um de seus aliados. \n\nEterna Mudança\nTambém no 1º nível, suas visões permitem que você seja capaz de interferir no futuro, usufruindo do poder inato de sua Psique para tentar mudar o destino daquilo que já foi visualizado. \n\nUma vez por rodada, quando você ou uma criatura dentro do seu campo de visão fizer uma rolagem qualquer em um alcance igual ao dobro do seu atributo de Psique, você pode consumir 1 P.A e 5 de Fluxo reativamente para influenciar na jogada, aumentando ou reduzindo o resultado em um valor equivalente ao seu atributo de Psique.\n\nO bônus ou penalidade aplicados por essa habilidade acumula com outras habilidades que apliquem efeitos iguais.\n\nEssa habilidade pode ser utilizada uma quantidade de vezes igual ao seu atributo de Psique por descanso completo."}, {"nv": 6, "n": "Clarividência", "t": "No 6º nível, seu olhar sobre o futuro pode ser ampliado temporariamente para aprimorar a precisão de suas previsões. Durante o seu turno, você pode consumir 1 ponto de ação e 10 pontos de Fluxo para entrar em um estado de hiperconsciência, no qual seus olhos brilham à medida que sua psique recebe visões caóticas do desconhecido, lhe concedendo uma clarividência temporária sobre tudo o que ocorre ao seu redor.\n\nEssas visões lhe concedem os seguintes benefícios:\n\nVocê tem vislumbres claros de todos os eventos e resultados que irão ocorrer dentro dos próximos 6 segundos [1 rodada].\n\nVocê é capaz de se preparar para esses eventos antes que eles aconteçam, recebendo vantagem em todas as suas rolagens até o início do seu próximo turno.\n\nVocê sofre 1d6 de [In]sanidade sempre que utiliza esse recurso. \n\nEssa habilidade pode ser utilizada uma quantidade de vezes igual à metade do seu atributo de Psique por descanso completo."}, {"nv": 11, "n": "Adivinhação", "t": "A partir do 11º nível você se torna capaz de manipular parte das visões recebidas em sua mente, determinando quais imagens, sons e sensações serão obtidas em sua Paisagem Mental. \n\nDurante um Sonho Lúcido, você pode consumir 1 P.A para ampliar sua conexão com o desconhecido, procurando visões que revelem a localização de determinadas criaturas ou objetos em tempo real, independe da distância entre vocês. \n\nSeus vislumbres informam a posição em que o alvo da adivinhação estava no momento em que a habilidade foi utilizada, ou seja, caso ele eventualmente se mova após o sonho, será necessário rastreá-lo novamente para atualizar a localização. \n\nEssa capacidade só pode ser usada desde que você já tenha visto a criatura ou objeto pelo menos uma vez, seja pessoalmente ou através de fotos e ilustrações que reflitam à imagem do que está sendo procurado.\n\nEssa habilidade pode ser utilizada uma quantidade de vezes igual à metade do seu atributo de Psique por descanso completo. Você pode rastrear múltiplas criaturas ou objetos simultaneamente em um único sonho, consumindo um uso individual da habilidade para cada alvo rastreado."}, {"nv": 16, "n": "Destino Traçado", "t": "No 16º nível, você amplifica seu domínio sobre as visões obtidas em seus sonhos, sendo capaz de determinar qual das possibilidades visualizadas irá se concretizar.\n\nUma vez por rodada, ao influenciar no resultado de uma rolagem através da habilidade Eterna Mudança, você pode fazer com que o dado seja tratado como uma Falha Crítica ou Acerto Crítico.\n\nO alvo deve rolar o d12 adicional que normalmente é provocado por falhas e acertos críticos, subtraindo ou adicionando ao valor final final da rolagem, dependendo da opção escolhida por você.\n\nAo utilizar esse recurso, você faz com que a ativação da Mudança Eterna consuma dois usos ao invés de apenas um."}]};
const TALENTOS={"Desarmado": [{"n": "Desarmar", "t": "Ação", "d": "Ao atingir um Ataque Desarmado em um alvo que esteja empunhando uma arma ou um objeto, você pode tentar desarmá-lo como parte da mesma ação. Ambos realizam um teste de habilidade de Força; se você conseguir um resultado superior ao do alvo, ele derruba o objeto ou você o toma de sua mão."}, {"n": "Golpe Doloroso", "t": "Passiva", "d": "O primeiro Ataque Desarmado que você acertar no seu turno reduz o deslocamento do alvo atingido em um valor igual ao seu atributo de Força em metros até o final do próximo turno dele."}, {"n": "Versátil", "t": "Passiva", "d": "Você pode usar Agilidade no lugar de Força para as rolagens e dano dos seus Ataques Desarmados."}, {"n": "Derrubada", "t": "[Reação]", "d": "Imediatamente após esquivar ou bloquear um ataque, você pode utilizar a ação de Empurrar/Derrubar de forma reativa, fazendo com que o peso do ataque inimigo se vire contra ele mesmo, na intenção de levá-lo ao chão."}, {"n": "Mestre em Agarrão", "t": "Ação", "d": "Uma vez por rodada, ao acertar um ataque desarmado contra um alvo, você pode, como parte desse mesmo ataque, utilizar a ação de Agarrar para tentar prendê-lo, sem consumir Pontos de Ação adicionais. Você não sofre nenhuma penalidade de deslocamento por agarrar uma criatura dessa forma."}, {"n": "Golpe Pesado", "t": "Ação", "d": "Uma vez por rodada, ao realizar uma jogada de Ataque Desarmado, você pode declarar de forma prévia que irá utilizar essa habilidade. Se acertar, seu ataque derruba automaticamente a criatura atingida, deixando-a caída. Você só pode utilizar essa técnica se a Força for o atributo principal das suas jogadas de ataque desarmado."}, {"n": "Em Guarda", "t": "Passiva", "d": "Você recebe um bônus de +1 em suas jogadas de esquiva e defesa. Esse bônus se torna +2 a partir do nível 7 e +3 a partir do nível 13. Esse bônus não acumula com habilidades psíquicas e outras especializações que concedam bônus de esquiva ou defesa direta ou indiretamente."}, {"n": "Sentinela", "t": "[Reação]", "d": "Você pode realizar um Ataque Reativo toda vez que uma criatura entrar voluntariamente em seu alcance corpo a corpo."}, {"n": "Interrupção", "t": "Passiva", "d": "Ao atingir um Ataque Reativo em uma criatura, ela não poderá se mover novamente até o final do turno dela."}, {"n": "Fantasma", "t": "Passiva", "d": "Seu primeiro Ataque Reativo ou Técnica de Combate Desarmado com Propriedade de [Reação] não consome Pontos de Ação na primeira vez em que você o utiliza em uma rodada."}, {"n": "Um por todos", "t": "[Reação]", "d": "Uma vez por rodada, quando uma criatura à sua escolha for atingida por um ataque, você pode consumir 1 P.A para se mover até ela e se jogar na frente do golpe, sendo atingido no lugar dela. A criatura deve estar a uma distância que não seja superior à metade do seu Deslocamento base, cujo os metros são consumidos normalmente durante o movimento. Você pode fazer uma jogada de defesa com desvantagem para tentar bloquear o golpe após se jogar na frente dele."}, {"n": "Aparo Perfeito", "t": "[Reação]", "d": "Uma vez por rodada, declarando de forma prévia antes de saber o resultado da rolagem de um ataque inimigo, você pode escolher aparar o golpe. Ao utilizar esse recurso, você consome 2 Pontos de Ação, mas reduz o dano levado para zero. Adicionalmente, você pode fazer um Ataque Reativo imediato contra seu oponente. Essa técnica pode ser usada 2 vezes por descanso completo. Essa técnica consome P.A mesmo caso você possua Fantasma."}, {"n": "Contra Ataque", "t": "[Reação]", "d": "Uma vez por rodada, ao ser alvejado por um ataque corpo a corpo, você pode realizar um Ataque Reativo contra seu oponente, em vez de fazer uma jogada de defesa ou esquiva. Caso o resultado do seu ataque seja superior ao do seu oponente, você não recebe nenhum dano e seu ataque atinge o inimigo. Seu golpe não causa nenhum dano pela diferença dos dados e não causa nenhum dano adicional em acertos críticos."}, {"n": "Golpe Atordoante", "t": "Ação", "d": "Uma vez por rodada, ao acertar uma jogada de ataque desarmado em um oponente, você pode forçá-lo a fazer um teste de resistência de corpo. Caso o resultado dele seja inferior ao valor do seu ataque, o alvo ficará desnorteado pelo golpe, recebendo desvantagem na próxima jogada de esquiva que realizar."}, {"n": "Troca Tática", "t": "Ação", "d": "Consumindo 1 P.A no seu turno, você pode trocar de posição com uma criatura aliada que esteja a até 1m de distância da sua posição. Essa troca não provoca ataques reativos e ambos recebem vantagem na próxima jogada de esquiva/defesa que realizarem."}, {"n": "Refletir Projéteis", "t": "[Reação]", "d": "Ao ser alvo de um ataque à distância realizado à partir de uma arma marcial arremessável ou à distância, você pode realizar um Ataque Reativo contra o projétil em vez de uma jogada de esquiva ou defesa. Se o resultado da sua rolagem for superior ao da rolagem inimiga, você não recebe nenhum dano, sendo capaz de agarrar o projétil/arma e jogá-lo de volta em um alvo à sua escolha dentro de um alcance igual à 10 + o dobro do seu atributo de Força. Ao jogar o projétil, você deve realizar uma jogada de ataque com seu atributo de Força [armas médias ou pesadas] ou Agilidade [armas leves ou flechas/virotes], essa jogada não consome nenhum ponto de ação adicional."}], "Corpo a Corpo": [{"n": "Combate com Duas Armas", "t": "Ação", "d": "Uma vez por rodada, desde que você esteja empunhando armas leves em ambas as suas mãos, ao consumir 2 Pontos de Ação para realizar uma jogada de ataque físico corpo a corpo com uma das armas, você pode realizar um segundo ataque com a arma da segunda mão, sem consumir nenhum P.A. Caso você possua a mutação de Braços Extras e use uma arma média, esse ataque custará 1 P.A."}, {"n": "Equilíbrio", "t": "Passiva", "d": "Enquanto empunhar uma arma média em sua mão e nenhuma arma na outra mão, você recebe um bônus de +1 nas suas jogadas de ataque."}, {"n": "Segunda Chance", "t": "A
