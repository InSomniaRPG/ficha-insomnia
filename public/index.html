   Eventos
   ============================================================ */
document.addEventListener('input', ev=>{
  const t=ev.target, ds=t.dataset;
  const num = t.type==='number';
  if(t.id==='cNome'){ CH.nome=t.value; return persist(); }
  if(t.id==='pvAtual'){ CH.pvAtual=+t.value; return (vitals(),side(),alerts(),persist()); }
  if(t.id==='fluxoGasto'){ CH.fluxoGasto=+t.value; return (vitals(),alerts(),persist()); }
  if(t.id==='insan'){ CH.insanidade=+t.value; return persist(); }

  if(ds.ch!==undefined){
    CH[ds.ch] = num ? +t.value : t.value;
    if(ds.ch==='nivel') CH.nivel=+t.value;
    if(ds.ch==='historia'||ds.ch==='inventario'||ds.ch==='notas'){ return persist(); }
    return render();
  }
  if(ds.est!==undefined){ CH.estigma[ds.est]= num?Math.max(0,+t.value||0):t.value; return render(); }
  if(ds.espt!==undefined){
    const s=CH.esp[ds.espt]; s.tal=s.tal||[]; s.tal[+ds.ix]=t.value;
    s.tal=s.tal.filter((v,i)=>v||i<s.nv*2); return render();
  }
  if(ds.ecoh!==undefined){
    const s=CH.ecos[ds.ecoh]; s.hab=s.hab||[]; s.hab[+ds.ix]=t.value;
    s.hab=s.hab.filter((v,i)=>v||i<s.nv*2); return render();
  }
  if(ds.prof!==undefined){
    const p=CH.esp.cac.prof||[]; const i=p.indexOf(ds.prof);
    if(t.checked && i<0) p.push(ds.prof); if(!t.checked && i>=0) p.splice(i,1);
    CH.esp.cac.prof=p; return render();
  }
  if(ds.sub!==undefined){
    const id=ds.sub, sb=(SUBS[CH.origem]||[]).find(x=>x.id===id)||{};
    if(sb.especial==='veratemEco'){ CH.veratemEco = t.checked?ds.item:''; return render(); }
    const arr=CH.subs[id]||[]; const i=arr.indexOf(ds.item);
    if(t.checked && i<0) arr.push(ds.item); if(!t.checked && i>=0) arr.splice(i,1);
    CH.subs[id]=arr; return render();
  }
  if(ds.uso!==undefined){ CH.usos[ds.uso]=Math.max(0,+t.value||0); return persist(); }
  if(ds.sig!==undefined){ CH.sigilo[ds.sig]= t.type==='checkbox'?t.checked:t.value;
    return (ds.sig==='nome')?persist():render(); }
  if(ds.sigop!==undefined){ CH.sigilo.op[ds.sigop]= t.value===''?null:+t.value; return render(); }
  if(ds.arma!==undefined){ CH.armas[+ds.arma].n=t.value; return render(); }
  if(ds.vinc!==undefined){ CH.armas[+ds.vinc].v=t.checked; return render(); }

  const h=curHab();
  if(h && ds.fn!==undefined && ds.op!==undefined){ h.fns[+ds.fn].op[ds.op]=+t.value; return num?(ledger(),alerts()):render(); }
  if(h && ds.fn!==undefined && ds.hab==='id'){ h.fns[+ds.fn]={id:t.value,op:{},ap:1}; return render(); }
  if(h && ds.fn!==undefined && ds.hab==='ap'){ h.fns[+ds.fn].ap=+t.value; return render(); }
  if(h && ds.hab!==undefined){
    if(t.type==='checkbox'){
      h[ds.hab]=t.checked;
      if(ds.hab==='comb'){ if(t.checked){ if(h.fns.length<2) h.fns.push({id:'',op:{},ap:1}); } else h.fns=[h.fns[0]]; }
      return render();
    }
    h[ds.hab]= num?+t.value:t.value;
    return (ds.hab==='nome'||ds.hab==='desc') ? (view0(),ledger(),persist()) : render();
  }
});
function view0(){ /* atualiza só a lista lateral de habilidades sem redesenhar o editor */
  const slots=document.querySelectorAll('.slot');
  CH.estigma.habs.forEach((x,i)=>{ if(!slots[i])return;
    const b=slots[i].querySelector('.nm b');
    if(b) b.textContent = x.nome || (x.tipo==='estigma'?'Estigma sem nome':'Runa sem nome');
  });
}

document.addEventListener('click', ev=>{
  const t=ev.target.closest('[data-tab],[data-attr],[data-esp],[data-eco],[data-arq],[data-sigv],[data-sel],[data-rmfn],#bAdd,#bDelHab,#bNew,#bSave,#bLoad,#bFolha');
  if(!t) return;
  const ds=t.dataset;
  if(ds.tab){ CH.tab=ds.tab; return render(); }
  if(ds.attr){
    const d=D(), k=ds.attr, delta=+ds.delta;
    const nv=(CH.attrs[k]||0)+delta;
    if(nv<0 || nv>d.limAtr || (delta>0 && d.atrDisp<=0)) return;
    CH.attrs[k]=nv; return render();
  }
  if(ds.esp){ const s=CH.esp[ds.esp]; s.nv=+ds.nv;
    if((s.prof||[]).length>s.nv) s.prof=(s.prof||[]).slice(0,s.nv);
    return render(); }
  if(ds.eco){ CH.ecos[ds.eco].nv=+ds.nv; return render(); }
  if(ds.sigv){ if(CH.sigilo.v!==ds.sigv){ CH.sigilo.v=ds.sigv; CH.sigilo.op={}; CH.sigilo.ativo=false; }
    return render(); }
  if(ds.arq){
    const k=ds.arq, E=CH.estigma, i=E.arqs.indexOf(k);
    if(i>=0){
      if(E.habs.some(h=>h.fns.some(sf=>FN[sf.id]&&FN[sf.id].arq===k)) &&
         !confirm('Há habilidades usando funções de '+CAT[k].n+'. Remover o arquétipo mesmo assim?')) return;
      E.arqs.splice(i,1);
    } else if(E.arqs.length<4) E.arqs.push(k);
    return render();
  }
  if(ds.sel){ CH.estigma.sel=ds.sel; return render(); }
  if(ds.rmfn){ const h=curHab(); h.fns=[h.fns[0]]; h.comb=false; return render(); }
  if(t.id==='bAdd'){ const n=novaHab('runa'); CH.estigma.habs.push(n); CH.estigma.sel=n.k; return render(); }
  if(t.id==='bDelHab'){ const h=curHab(); if(h.tipo==='estigma')return;
    CH.estigma.habs=CH.estigma.habs.filter(x=>x.k!==h.k); CH.estigma.sel=CH.estigma.habs[0].k; return render(); }
  if(t.id==='bNew'){ if(!confirm('Começar uma ficha nova? A atual será descartada.'))return;
    CH=novaFicha(); return boot(); }
  if(t.id==='bSave'){
    const nome=(CH.nome||'medium').replace(/[^\w\-]+/g,'_');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(CH,null,1)],{type:'application/json'}));
    a.download='insomnia_'+nome+'.json'; a.click(); URL.revokeObjectURL(a.href); return;
  }
  if(t.id==='bLoad'){ $('#fIn').click(); return; }
  if(t.id==='bFolha'){ folha(); return; }
});

$('#fIn').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(d.habs && !d.estigma){ // arquivo salvo pela oficina antiga
        CH=novaFicha(); CH.nivel=d.lvl||7;
        CH.estigma={arqs:d.arqs||[],tipoDano:d.tipoDano||'Psíquico',trade:d.trade||0,habs:d.habs,sel:d.sel||d.habs[0].k};
        CH.tab='estigma'; alert('Arquivo da oficina importado para a aba Estigma e Runas.');
      } else if(d.attrs){ CH=Object.assign(novaFicha(),d); }
      else throw 0;
      boot();
    }catch(_){ alert('Arquivo inválido. Use um .json salvo por esta ficha ou pela oficina de Estigma.'); } };
  r.readAsText(f); e.target.value='';
});

/* ---------- persistência ---------- */
function persist(){ try{ localStorage.setItem('insomnia_ficha',JSON.stringify(CH)); }catch(_){} }
function carregar(){ try{
  const d=JSON.parse(localStorage.getItem('insomnia_ficha'));
  if(d&&d.attrs&&d.estigma&&d.estigma.habs&&d.estigma.habs.length) CH=Object.assign(novaFicha(),d);
}catch(_){} }

/* ============================================================
   Folha completa para impressão
   ============================================================ */
function folha(){
  const d=D(), E=CH.estigma;
  const yn=v=>v?'Sim':'Não';
  const armas = CH.armas.map(w=>{const x=acharArma(w.n); if(!x)return'';
    const at=atqArma(x), dn=danoArma(x,w.v);
    return `<tr><td>${x.n}${w.v?' <em>(vinculada)</em>':''}</td><td>${x.cat}</td><td>${alcanceArma(x)}</td>
      <td class="c">${at.prof?'+'+at.mod:'—'}</td><td class="c">${dn.txt}</td></tr>`;}).join('');
  const habs = E.habs.map(h=>{
    const c=custo(h), fs=h.fns.map(sf=>FN[sf.id]).filter(Boolean), res=resolucao(h);
    return `<article><h3>${esc(h.nome)||(h.tipo==='estigma'?'Estigma':'Runa')}
      <em>${h.tipo==='estigma'?'marca principal':'runa'}${h.comb?' · combinada':''}${h.passiva?' · passiva':''}</em></h3>
      <table><tr><th>Arquétipo</th><td>${fs.map(f=>CAT[f.arq].n).filter((v,i,a)=>a.indexOf(v)===i).join(' + ')||'—'}</td>
        <th>Função</th><td>${fs.map(f=>f.n).join(' + ')||'—'}</td></tr>
      <tr><th>Alvos</th><td>${h.mira==='area'?'Área':MIRA[h.mira].l}</td>
        <th>Alcance</th><td>${ignoraAlcance(h)?'próprio da função':ALC[h.alc].l}</td></tr>
      <tr><th>Área</th><td>${h.mira==='area'?AREA[h.area].l+(AREA[h.area].tam?' '+TAM[h.tam].l.split(' —')[0]:''):'—'}</td>
        <th>Duração</th><td>${h.passiva?'sempre ativa':DUR[h.dur].l}</td></tr>
      <tr><th>Atributo</th><td>${fazTeste(res)?(h.attr||'—'):'—'}</td><th>Tipo de dano</th><td>${E.tipoDano}</td></tr>
      <tr><th>Custo P.F</th><td class="c">${c.total}</td><th>Custo P.A</th><td class="c">${h.passiva?0:c.pa}</td></tr>
      <tr><th>Prolongado</th><td class="c">${c.prol||'—'}</td><th>Runas gastas</th><td class="c">${runasGastas(h)}</td></tr></table>
      <p class="fl">Aprimorável: ${yn(fs.some(f=>f.ap))} · Teste de Res.: ${yn(fazTeste(res))} · Causa Dano: ${yn(fs.some(f=>f.dano))} ·
        C. Condição: ${yn(fs.some(f=>f.cond))} · Prop. Reação: ${yn(fs.some(f=>f.rc==='s'||f.rc==='x'))} ·
        Uso Passivo: ${yn(h.passiva)} · Runa Comb.: ${yn(h.comb)}</p>
      ${h.desc?'<p class="dd">'+esc(h.desc)+'</p>':''}</article>`;
  }).join('');
  const listaEsp = Object.keys(ESP).map(k=>{const s=CH.esp[k];
    return `<tr><td>${ESP[k].n}</td><td class="c">${s.nv}</td>
      <td>${(s.tal||[]).filter(Boolean).join(', ')||'—'}</td></tr>`;}).join('');
  const listaEco = Object.keys(ECO).map(k=>{const s=CH.ecos[k];
    return `<tr><td>Eco de ${ECO[k].n}</td><td class="c">${s.nv}</td>
      <td>${(s.hab||[]).filter(Boolean).join(', ')||'—'}</td></tr>`;}).join('');

  const w=window.open('','_blank');
  if(!w){ alert('O navegador bloqueou a nova janela. Libere pop-ups para gerar a folha.'); return; }
  w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(CH.nome||'Médium')} — [In]somnia</title>
  <style>
  body{font:12px/1.45 system-ui,sans-serif;color:#111;max-width:820px;margin:22px auto;padding:0 16px}
  h1{font-size:20px;margin:0} .meta{color:#555;font-size:11.5px;margin:2px 0 16px}
  h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#444;border-bottom:1px solid #ccc;
     padding-bottom:3px;margin:18px 0 8px}
  table{width:100%;border-collapse:collapse;margin-bottom:8px}
  th,td{border:1px solid #ddd;padding:3px 6px;text-align:left;font-size:11.5px;vertical-align:top}
  th{background:#f3f3f5;font-weight:600;white-space:nowrap;width:14%}
  td.c{font-variant-numeric:tabular-nums;font-weight:600;text-align:center;width:9%}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
  .box{border:1px solid #ddd;border-radius:5px;padding:5px 7px}
  .box u{display:block;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:#777;text-decoration:none}
  .box b{font-size:15px;font-variant-numeric:tabular-nums}
  article{border:1px solid #bbb;border-radius:6px;padding:9px 11px;margin-bottom:10px;break-inside:avoid}
  article h3{font-size:13px;margin:0 0 7px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  article h3 em{font-style:normal;font-weight:400;color:#666;font-size:10.5px}
  .fl{color:#555;font-size:10.5px;margin:0} .dd{margin:5px 0 0;font-size:11.5px;white-space:pre-wrap}
  .tx{white-space:pre-wrap;font-size:11.5px;border:1px solid #ddd;border-radius:5px;padding:7px;min-height:40px}
  @media print{body{margin:0}}
  </style>
  <h1>${esc(CH.nome||'Médium sem nome')}</h1>
  <p class="meta">${CH.jogador?esc(CH.jogador)+' · ':''}Nível ${CH.nivel} ${d.p.cl} ·
    ${CH.origem||'sem origem'} · Afinidade ${CH.afinidade||'—'} · Psique ${d.psique}</p>

  <h2>Atributos e derivados</h2>
  <div class="grid">
    ${ATR.map(k=>`<div class="box"><u>${ATRN[k]}</u><b>${CH.attrs[k]}</b></div>`).join('')}
    <div class="box"><u>Psique</u><b>${d.psique}</b></div>
    <div class="box"><u>P.A</u><b>${d.p.pa}</b></div>
    <div class="box"><u>Pontos de Vida</u><b>${d.pvAtual} / ${d.pvTotal}</b></div>
    <div class="box"><u>Fluxo</u><b>${d.fluxoDisp - CH.fluxoGasto} / ${d.fluxoDisp}</b></div>
    <div class="box"><u>[In]Sanidade</u><b>${CH.insanidade}</b></div>
    <div class="box"><u>Iniciativa</u><b>+${d.inic}</b></div>
    <div class="box"><u>Esquiva</u><b>+${d.esquiva}</b></div>
    <div class="box"><u>Defesa</u><b>+${d.defesa}</b></div>
    <div class="box"><u>Atq. Psíquico / ND</u><b>+${d.atqPsi}</b></div>
    <div class="box"><u>Desarmado</u><b>+${d.atqDes} · ${d.danoDes}</b></div>
    <div class="box"><u>Deslocamento</u><b>${d.desloc} m</b></div>
    <div class="box"><u>Levant. / Carga</u><b>${d.levant} / ${d.carga}</b></div>
    <div class="box"><u>Detecção / ND passivo</u><b>${d.detPassiva} m · +${d.ndPassiva}</b></div>
  </div>

  <h2>Armas</h2>
  <table><tr><th style="width:auto">Arma</th><th>Categoria</th><th>Alcance</th><th>Ataque</th><th>Dano</th></tr>
  ${armas||'<tr><td colspan="5">—</td></tr>'}</table>

  <h2>Especializações e Ecos</h2>
  <table><tr><th style="width:22%">Trilha</th><th>Nv</th><th style="width:auto">Habilidades</th></tr>
  ${listaEsp}${listaEco}
  ${d.temVinc?`<tr><td>Eco de Vínculo</td><td class="c">${d.nvVinculo}</td><td>herdado de Manipulação · +${d.nvVinculo} de dano · limite ${d.nvVinculo} arma(s)</td></tr>`:''}
  </table>

  <h2>Estigma e Runas — ${E.arqs.map(a=>CAT[a].n).join(', ')||'sem arquétipos'} ·
    ${d.runasUso}/${d.runasDisp} runas · ${d.passUso}/${d.passLim} passivas</h2>
  ${habs}

  ${subsFolha()}
  ${sigiloFolha()}
  ${CH.historia?'<h2>História e objetivos</h2><div class="tx">'+esc(CH.historia)+'</div>':''}
  ${CH.inventario?'<h2>Inventário</h2><div class="tx">'+esc(CH.inventario)+'</div>':''}
  ${CH.notas?'<h2>Anotações</h2><div class="tx">'+esc(CH.notas)+'</div>':''}
  `);
  w.document.close(); w.focus(); setTimeout(()=>w.print(),350);
}

function subsFolha(){
  const d=D(), ls=subsDaOrigem().filter(sb=>!sb.ref && subSel(sb.id).length);
  const us=Object.keys((USOS[CH.origem]||{})).filter(nv=>CH.nivel>=+nv);
  if(!ls.length && !us.length) return '';
  let h='<h2>Origem — '+esc(CH.origem)+'</h2><table>';
  ls.forEach(sb=>{
    h+='<tr><th style="width:24%">'+esc(sb.n)+'</th><td>'+subSel(sb.id).map(x=>{
      const it=listaSub(sb).find(y=>(y.k||y.n)===x); return esc(it?it.n:x);
    }).join(', ')+' <em>('+subSel(sb.id).length+' de '+limSub(sb,d.psique)+')</em></td></tr>';
  });
  us.forEach(nv=>{const u2=USOS[CH.origem][nv], tot=limUsos(u2.f,d.psique), g=CH.usos[CH.origem+nv]||0;
    h+='<tr><th>'+esc(u2.l)+'</th><td class="c" style="width:auto;text-align:left">'+
       Math.max(0,tot-g)+' de '+tot+' usos por descanso completo</td></tr>';});
  return h+'</table>';
}
function sigiloFolha(){
  const d=D(); if(!d.sigLib || !CH.sigilo.v) return '';
  const S=SIGILOS[CH.sigilo.v], c=custoSigilo();
  let extra='';
  (S.op||[]).forEach(o=>{const it=o.it[CH.sigilo.op[o.id]];
    if(it) extra+='<tr><th>'+esc(o.l)+'</th><td colspan="3">'+esc(it.l)+'</td></tr>';});
  let val='';
  if(CH.sigilo.v==='transformacao') val='<tr><th>PV da transformação</th><td class="c">'+d.sigPV+
    '</td><th>Psique ativa</th><td class="c">'+(d.p.limAtr+2)+'</td></tr>';
  if(CH.sigilo.v==='territorio') val='<tr><th>Raio</th><td class="c">'+d.sigRaio+
    ' m</td><th>Limite do totem</th><td class="c">'+d.limFluxo+'</td></tr>';
  if(CH.sigilo.v==='invocacao') val='<tr><th>Fluxo da invocação</th><td class="c">'+d.sigInvFluxo+
    '</td><th>Runas</th><td class="c">'+Math.floor(d.runasDisp/2)+'</td></tr>';
  return '<h2>Sigilo — '+esc(S.n)+(CH.sigilo.nome?' · "'+esc(CH.sigilo.nome)+'"':'')+'</h2>'+
    '<table><tr><th>Ativação</th><td class="c">'+S.pa+' P.A</td><th>Fluxo</th><td class="c">'+
    (c!=null?c:'—')+'</td></tr><tr><th>Duração</th><td colspan="3">'+esc(S.dur)+'</td></tr>'+
    extra+val+'<tr><th>Colateral</th><td colspan="3">'+esc(S.col)+'</td></tr></table>';
}

/* ---------- boot ---------- */
function boot(){
  $('#cNome').value = CH.nome||'';
  render();
}
carregar(); boot();

</script>
