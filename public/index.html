<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>[In]somnia — Ficha do Médium</title>
    <style>
      :root {
        --ink: #0b0a11;
        --panel: #14121d;
        --panel2: #1c1929;
        --panel3: #241f34;
        --line: #2c2740;
        --line2: #403859;
        --txt: #eae6f5;
        --dim: #9c94b6;
        --dim2: #6d6689;
        --fluxo: #4fd1c5;
        --pa: #f5b544;
        --runa: #a78bfa;
        --pass: #f28bc1;
        --pv: #ff7a8a;
        --ok: #5fd48f;
        --warn: #f0b34a;
        --err: #ff6b81;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas,
          monospace;
        --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--ink);
        color: var(--txt);
        font-family: var(--ui);
        font-size: 14px;
        line-height: 1.5;
        background-image: radial-gradient(
            circle at 12% -8%,
            rgba(167, 139, 250, 0.1),
            transparent 55%
          ),
          radial-gradient(
            circle at 92% 0%,
            rgba(79, 209, 197, 0.055),
            transparent 50%
          );
        background-attachment: fixed;
      }
      button,
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--runa);
        outline-offset: 2px;
      }
      select,
      input[type="text"],
      input[type="number"],
      textarea {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 8px;
      }
      select:hover,
      input:hover {
        border-color: var(--line2);
      }
      textarea {
        width: 100%;
        resize: vertical;
        line-height: 1.45;
      }
      .mono {
        font-family: var(--mono);
      }

      /* ---------- header ---------- */
      header {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(11, 10, 17, 0.93);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .hwrap {
        max-width: 1680px;
        margin: 0 auto;
        padding: 9px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .brand {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }
      .brand b {
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      .brand b i {
        color: var(--runa);
        font-style: normal;
      }
      .brand span {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.17em;
        text-transform: uppercase;
        color: var(--dim2);
      }
      .hsep {
        width: 1px;
        align-self: stretch;
        background: var(--line);
      }
      .who {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 150px;
      }
      .who input {
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        padding: 2px 0;
        font-size: 15px;
        font-weight: 600;
      }
      .who input:focus {
        border-color: var(--runa);
      }
      .who span {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--dim2);
      }
      .vitals {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-left: auto;
        align-items: stretch;
      }
      .vital {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 4px 9px;
        border-radius: 6px;
        background: var(--panel2);
        border: 1px solid var(--line);
        min-width: 62px;
      }
      .vital u {
        font-family: var(--mono);
        font-size: 8.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim2);
        text-decoration: none;
        white-space: nowrap;
      }
      .vital b {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 600;
        display: flex;
        align-items: baseline;
        gap: 3px;
      }
      .vital b small {
        font-size: 10px;
        color: var(--dim2);
        font-weight: 400;
      }
      .vital input {
        width: 44px;
        background: transparent;
        border: none;
        padding: 0;
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 600;
        color: inherit;
      }
      .vital.pv b,
      .vital.pv input {
        color: var(--pv);
      }
      .vital.fx b,
      .vital.fx input {
        color: var(--fluxo);
      }
      .vital.pa b {
        color: var(--pa);
      }
      .vital.ins b,
      .vital.ins input {
        color: var(--pass);
      }
      .vital.bad {
        border-color: var(--err);
      }
      .btn {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .btn:hover {
        border-color: var(--line2);
        color: var(--txt);
        background: var(--panel3);
      }
      .btn.pri {
        background: linear-gradient(180deg, #6d4fd8, #5a3fbd);
        border-color: #7d5ff0;
        color: #fff;
      }
      .btn.pri:hover {
        background: linear-gradient(180deg, #7d5ff0, #6849cf);
      }
      .btn.dz {
        color: var(--err);
        border-color: #4b2434;
      }
      .btn.dz:hover {
        background: #2a1520;
        border-color: var(--err);
      }
      .btn.sm {
        padding: 3px 7px;
        font-size: 9px;
      }

      /* ---------- layout ---------- */
      main {
        max-width: 1680px;
        margin: 0 auto;
        padding: 14px 16px 60px;
        display: grid;
        gap: 14px;
        grid-template-columns: 212px minmax(0, 1fr) 330px;
        align-items: start;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .card > h3 {
        margin: 0;
        padding: 9px 12px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--dim);
        background: var(--panel2);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-weight: 600;
      }
      .card > h3 em {
        font-style: normal;
        color: var(--dim2);
        letter-spacing: 0.05em;
        text-transform: none;
        font-size: 10.5px;
      }
      .cbody {
        padding: 12px;
      }
      .sticky {
        position: sticky;
        top: 62px;
      }

      /* ---------- nav ---------- */
      .nav {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 7px;
      }
      .nb {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 9px;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid transparent;
        background: transparent;
        text-align: left;
        width: 100%;
      }
      .nb:hover {
        background: var(--panel2);
      }
      .nb.on {
        background: #241d3d;
        border-color: var(--runa);
      }
      .nb i {
        font-style: normal;
        font-family: var(--mono);
        font-size: 9.5px;
        color: var(--dim2);
        width: 13px;
        flex: none;
      }
      .nb.on i {
        color: var(--runa);
      }
      .nb span {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
      }
      .nb b {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 600;
        color: var(--dim2);
        white-space: nowrap;
      }
      .nb b.ok {
        color: var(--ok);
      }
      .nb b.bad {
        color: var(--err);
      }
      .nb b.warn {
        color: var(--warn);
      }

      /* ---------- comuns ---------- */
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .grp {
        flex: 1;
        min-width: 150px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .grp.sm {
        min-width: 110px;
        flex: 0 1 130px;
      }
      .grp > label,
      .lbl {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim2);
      }
      .grp select,
      .grp input {
        width: 100%;
      }
      .hr {
        height: 1px;
        background: var(--line);
        margin: 14px -12px;
      }
      .sub {
        font-family: var(--ui);
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: var(--txt);
        margin: 0 0 11px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      .sub:before {
        content: "";
        width: 4px;
        height: 17px;
        background: linear-gradient(180deg, var(--runa), #6d4fd8);
        border-radius: 2px;
        flex: none;
      }
      .card > h3 {
        font-size: 11.5px !important;
        letter-spacing: 0.13em;
        color: var(--txt) !important;
      }
      .blkh h4 {
        font-size: 15px;
        font-weight: 700;
      }
      .note {
        font-size: 11.5px;
        color: var(--dim2);
        margin: 5px 0 0;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel2);
        cursor: pointer;
        font-size: 12.5px;
        user-select: none;
      }
      .check:hover {
        border-color: var(--line2);
      }
      .check.on {
        border-color: var(--runa);
        background: #241d3d;
      }
      .check.on.p {
        border-color: var(--pass);
        background: #301d2b;
      }
      .check input {
        accent-color: #7d5ff0;
        margin: 0;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      details.more {
        margin-top: 8px;
      }
      details.more > summary {
        cursor: pointer;
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--dim2);
        list-style: none;
      }
      details.more > summary:hover {
        color: var(--txt);
      }
      details.more > summary::-webkit-details-marker {
        display: none;
      }
      details.more > summary:before {
        content: "▸ ";
        color: var(--runa);
      }
      details.more[open] > summary:before {
        content: "▾ ";
      }
      .bdg {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 2.5px 6px;
        border-radius: 4px;
        background: var(--panel3);
        color: var(--dim);
        border: 1px solid var(--line);
        display: inline-block;
      }
      .bdg.y {
        color: var(--pa);
        border-color: #4a3a1c;
      }
      .bdg.g {
        color: var(--ok);
        border-color: #22482f;
      }
      .bdg.v {
        color: var(--runa);
        border-color: #3a2f5e;
      }
      .bdg.t {
        color: var(--fluxo);
        border-color: #1c4a46;
      }
      .bdg.r {
        color: var(--err);
        border-color: #4b2434;
      }
      .longtext {
        font-size: 12.5px;
        color: var(--dim);
        white-space: pre-wrap;
        line-height: 1.5;
        max-height: 340px;
        overflow: auto;
        padding: 10px;
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      /* ---------- atributos ---------- */
      .attrs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
        gap: 8px;
      }
      .attr {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 9px;
        text-align: center;
      }
      .attr.af {
        border-color: var(--runa);
        background: #241d3d;
      }
      .attr u {
        display: block;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--dim2);
        text-decoration: none;
        margin-bottom: 5px;
      }
      .attr .st {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .attr .st button {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        border: 1px solid var(--line);
        background: var(--panel3);
        cursor: pointer;
        color: var(--dim);
        font-family: var(--mono);
        line-height: 1;
        padding: 0;
      }
      .attr .st button:hover:not(:disabled) {
        color: var(--txt);
        border-color: var(--line2);
      }
      .attr .st button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .attr .st b {
        font-family: var(--mono);
        font-size: 22px;
        min-width: 26px;
      }
      .attr.over .st b {
        color: var(--err);
      }
      .attr small {
        display: block;
        color: var(--dim2);
        font-size: 10.5px;
        margin-top: 4px;
        font-family: var(--mono);
      }

      /* ---------- blocos de especialização/eco ---------- */
      .blk {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel2);
        padding: 11px;
        margin-bottom: 10px;
      }
      .blkh {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 9px;
      }
      .blkh h4 {
        margin: 0;
        font-size: 14px;
        flex: 1;
        min-width: 120px;
      }
      .nvsel {
        display: flex;
        gap: 3px;
      }
      .nvsel button {
        padding: 4px 9px;
        border: 1px solid var(--line);
        background: var(--panel3);
        border-radius: 5px;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--dim);
      }
      .nvsel button:hover {
        border-color: var(--line2);
        color: var(--txt);
      }
      .nvsel button.on {
        background: #3a2b56;
        border-color: var(--runa);
        color: #fff;
      }
      .slotlist {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .slotrow {
        display: flex;
        gap: 7px;
        align-items: flex-start;
      }
      .slotrow select {
        flex: 1;
        min-width: 0;
      }
      .slotrow .tp {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 5px 6px;
        border-radius: 4px;
        background: var(--panel3);
        color: var(--dim2);
        white-space: nowrap;
        border: 1px solid var(--line);
      }
      .tdesc {
        font-size: 11.5px;
        color: var(--dim2);
        padding: 2px 0 4px 2px;
        line-height: 1.45;
      }
      .subrow {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        padding: 7px 9px;
      }
      .subrow.on {
        border-color: var(--runa);
        background: #241d3d;
      }
      .subrow.off {
        opacity: 0.42;
      }
      .subhead {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        cursor: pointer;
        user-select: none;
      }
      .subrow.off .subhead {
        cursor: not-allowed;
      }
      .subhead input {
        accent-color: #7d5ff0;
        margin: 0;
        flex: none;
      }
      .subhead b {
        font-size: 12.5px;
        font-weight: 600;
      }
      .subhead .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--runa);
        flex: none;
      }
      .subrow .tdesc {
        padding: 4px 0 0 22px;
      }

      /* ---------- tabela ---------- */
      table.t {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      table.t th {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--dim2);
        text-align: left;
        padding: 5px 7px;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
        white-space: nowrap;
      }
      table.t td {
        padding: 5px 7px;
        border-bottom: 1px solid rgba(44, 39, 64, 0.55);
        vertical-align: middle;
      }
      table.t td.n {
        font-family: var(--mono);
        font-weight: 600;
        text-align: center;
        white-space: nowrap;
      }
      table.t tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }
      table.t td small {
        color: var(--dim2);
        font-size: 11px;
      }

      /* ---------- painel direito ---------- */
      .ledger {
        display: flex;
        flex-direction: column;
      }
      .lrow {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 4.5px 12px;
        font-size: 12.5px;
        align-items: baseline;
      }
      .lrow:nth-child(odd) {
        background: rgba(255, 255, 255, 0.017);
      }
      .lrow span {
        color: var(--dim);
      }
      .lrow span em {
        font-style: normal;
        color: var(--dim2);
      }
      .lrow b {
        font-family: var(--mono);
        font-weight: 600;
        white-space: nowrap;
      }
      .lrow.neg b {
        color: var(--ok);
      }
      .lrow.sum {
        border-top: 1px solid var(--line2);
        background: var(--panel2);
        padding: 9px 12px;
      }
      .lrow.sum span {
        color: var(--txt);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .lrow.sum b {
        font-size: 20px;
        color: var(--fluxo);
      }
      .bigrow {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
      }
      .big {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        text-align: center;
      }
      .big u {
        display: block;
        font-family: var(--mono);
        font-size: 8.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim2);
        text-decoration: none;
        margin-bottom: 2px;
      }
      .big b {
        font-family: var(--mono);
        font-size: 18px;
      }
      .big.pa b {
        color: var(--pa);
      }
      .big.pr b {
        color: var(--fluxo);
      }
      .alerts {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px;
      }
      .al {
        display: flex;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12.5px;
        line-height: 1.45;
        border: 1px solid;
      }
      .al i {
        font-style: normal;
        flex: none;
        font-family: var(--mono);
        font-weight: 700;
      }
      .al.e {
        background: #2a1219;
        border-color: #5c2434;
        color: #ffc6cf;
      }
      .al.e i {
        color: var(--err);
      }
      .al.w {
        background: #2a2211;
        border-color: #5c4a1e;
        color: #ffe4b3;
      }
      .al.w i {
        color: var(--warn);
      }
      .al.i {
        background: #111f2a;
        border-color: #1e455c;
        color: #c3e6f5;
      }
      .al.i i {
        color: #5fc4f0;
      }
      .al.g {
        background: #122a1c;
        border-color: #22522f;
        color: #c4f0d4;
      }
      .al.g i {
        color: var(--ok);
      }
      .sheet {
        font-family: var(--mono);
        font-size: 11.5px;
      }
      .srow {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 3.5px 12px;
        border-bottom: 1px solid rgba(44, 39, 64, 0.5);
      }
      .srow u {
        color: var(--dim2);
        text-decoration: none;
        white-space: nowrap;
      }
      .srow b {
        text-align: right;
        font-weight: 500;
      }
      .srow b.y {
        color: var(--ok);
      }
      .srow b.n {
        color: var(--dim2);
      }
      pre.out {
        margin: 0;
        padding: 12px;

or água.\n• Antena: Você possui uma pequena antena na sua cabeça, que detecta as vibrações do\n ambiente. Você recebe um bônus de +1 em jogadas de Esquiva.\n• Pernas Superdesenvolvidas: Suas pernas são finas e esguias, com um formado\n aprimorado para melhorar sua movimentação. Você recebe um bônus de +3 de\n deslocamento.\n• Pele Adaptada: Sua pele possui uma cor única, diferente de seres humanos comuns.\n Você recebe resistência a um tipo de dano à sua escolha, dentre as opções disponíveis\n na página de Estigma.\n• Camuflagem Natural: Sua pele possui um aspecto vítreo, como se possuísse pequenos\n cristais translúcidos capazes de refletir parte da luz ambiente. Você possui vantagem\n em testes para se esconder.\n• Pele Turva: Sua pele possui um aspecto enevoado, como se não fosse inteiramente\n física, tornando difícil medir suas verdadeiras proporções. Criaturas possuem uma\n penalidade de -1 em jogadas de ataque contra você.\n• Olhos Extras: Você tem um ou mais olhos adicionais na parte frontal do seu rosto,\n aprimorando sua captação de informações visuais do ambiente. Você recebe um bônus\n de +1 em jogadas de ataque à distância ou com armas de arremesso.\n• Pestilência: Seu corpo tem um cheiro podre e um aspecto mórbido. Uma vez por\n rodada, qualquer criatura que iniciar um turno em um quadrado adjacente ao seu\n recebe 1 de dano tóxico que não pode ser mitigado.\n• Perpétuo: Seu corpo deixa de envelhecer quando alcança o início da idade adulta. Você\n ainda pode morrer por conta de uma doença, ferimento ou degradação mental, mas não\n sofre nenhum efeito de envelhecimento.",

            t: "Já no 16º nível, você aprende a manipular a última e mais perigosa variante do material\nutilizado para forjar artefatos: o Somnium Negativo. Com ele, você se torna capaz de fabricar\nArtefatos de Contenção, equipamentos projetados especificamente para neutralizar e suprimir o\nFluxo.\nAssim como no caso da variante pura, Somnium Negativo não pode ser obtido através de\nOníricos. Você deve comprá-lo no Mercado de Somnium utilizando Créditos.\nO Somnium Negativo não pode ser transportado ou manuseado no interior da sua Forja Viva,\nalém disso, ele é completamente invulnerável à ferramentas feitas de Somnium Forjado.\nPara moldá-lo, você precisa primeiro fabricar um conjunto de Ferramentas de Forja de\nSomnium Puro [único material imune aos efeitos negativos do minério]. Essas ferramentas são\nconsideradas Artefatos sem Rank, e o conjunto completo exige a criação de 3 peças\nespecíficas: um Martelo de Forja, uma Bigorna e uma Luva de Proteção. Cada uma dessas 3\nferramentas consome exatamente 1 Unidade de Somnium Puro para ser fabricada, com VF 1.\nO próprio calor gerado pelo impacto do martelo é o que derrete o Somnium Negativo.\nUma vez que você possua o trio de ferramentas de Somnium Puro, você pode consumir\nUnidades de Somnium Negativo compradas no mercado para forjar os Artefatos de Contenção.\nCada artefato possui um VF diferente, que representa a quantidade de material necessária\npara forjá-lo.\nPor conta das características do material, o processo de forja precisa ser feito no mundo real.\nEm compensação, o tempo prático que precisa ser dedicado na confecção é bem menor,\nsendo necessário dedicar 8 horas de trabalho contínuo para criar um Artefato de Contenção.\n\nNos casos onde o artefato pode ser integrado a um outro artefato de Somnium Puro, mais 8\nhoras são necessárias para fazer a integração de forma eficaz.\n\nArtefatos de Contenção\n• Algemas de Supressão [VF 5]: Um par de algemas pesadas forjadas com elos de\n Somnium Negativo. Quando trancadas nos pulsos ou tornozelos de um Médium ou\n Onírico, a criatura é imediatamente impedida de utilizar qualquer habilidade que\n consuma Fluxo e todas as suas habilidas ativas são imediatamente desativadas\n [incluindo passivas]. Para colocar a algema em um alvo involuntário, você deve fazer\n um Teste de Habilidade com seu atributo de Força ou Agilidade.O alvo, por sua vez,\n pode também fazer um Teste de Habilidade com um dos atributos.Aquele que obtiver o\n maior resultado consegue um sucesso, colocando a algema ou evitando ser preso pela\n algema.\n• Placa de Blindagem [VF 10]: Uma placa fina e maleável, que pode ser integrada a uma\n superfície qualquer [parede, piso, grade, etc]. Alternativamente ela pode ser modelada\n em torno de um Escudo Pesado de Somnium Puro para torná-lo invulnerável à dano\n causado por fontes com fluxo.\n• Revestimento Negativo [VF 40]: Uma camada fina de Somnium Negativo que precisa\n ser cuidadosamente moldada em torno da lâmina ou ponta de um artefato de Somnium\n Puro do tipo Arma Corpo a Corpo, que cause dano cortante ou perfurante e tenha uma\n empunhadura isolada [como uma espada ou lança]. A arma perde qualquer runa\n gravada em sua construção, mas em compensação, recebe os seguintes efeitos: Um\n alvo atingido por um ataque da lâmina desativa automaticamente qualquer habilidade\n de duração prolongada que ele esteja usando. A arma não pode ter seu dano\n redirecionado, reduzido ou neutralizado por habilidades com essas capacidades.\n Oníricos feridos por uma arma com esse revestimento não podem regenerar suas\n feridas utilizando Fluxo até que realizem um descanso completo.\n• Projétil Anulador [VF 1]: Um projétil ou virote com a ponta esculpida em Somnium\n Negativo, que pode ser inserido em uma arma à distância feita de Somnium Puro,\n substituindo temporariamente a produção automática de munições. A arma perde\n qualquer runa gravada em sua construção enquanto o projétil estiver inserido nela, mas\n depois do disparo, as runas voltam ao normal e o projétil é consumido. O disparo possui\n os seguintes efeitos: Um alvo atingido desativa automaticamente qualquer habilidade de\n duração prolongada ou passiva que ele esteja usando.O projétil fica alojado no corpo,\n impedindo o uso de qualquer habilidade que consuma fluxo até ser removido. O alvo\n atingido pode consumir 1 P.A para remover um ou mais projéteis alojados no seu corpo.\n O disparo não pode ter seu dano redirecionado, reduzido ou neutralizado por\n habilidades com essas capacidades. Oníricos feridos pelo disparo não podem regenerar\n suas feridas utilizando Fluxo até que realizem um descanso completo.\n• Âncora Territorial [VF 1 - 40]: Uma pesada estaca de contenção que pode ser cravada\n no solo ou em uma parede. Ao fixar a estaca, é possível ativar um mecanismo por\n botão, que libera milhões de partículas minúsculas de Somnium Negativo no ambiente,\n gerando um campo de supressão em formato de esfera que neutraliza qualquer\n habilidade psíquica dentro do alcance [incluindo passivas] e impede a ativação de\n novas habilidades que consumam Fluxo. O raio da esfera varia de acordo com seu VF,\n que define a quantidade de material usado em sua construção. A esfera tem a estaca\n como ponto central e pode ser desativada apertar novamente o botão de ativação.\n• Armadilha de Pressão [VF 8]: Um pequeno mecanismo achatado em formato de disco\n que pode ser fixado de forma discreta em qualquer superfície sólida do solo. Quando\n uma criatura pisa no disco, o mecanismo é acionado instantaneamente, disparando\n\n pesadas correntes de Somnium Negativo que se enrolam rapidamente ao redor de seus\n membros e tronco.No momento em que a armadilha é acionada, o alvo deve realizar um\n teste de Esquiva contra um ND 16. Em caso de sucesso, ele consegue saltar para fora\n do alcance do mecanismo antes de ser pego.Em caso de falha, o alvo é completamente\n imobilizado pelas correntes. Uma vez preso, é impossível se soltar por conta própria,\n visto que o material anula qualquer habilidade psíquica e é indestrutível por força\n física.Enquanto estiver preso, o alvo não pode utilizar habilidades que consumam Fluxo\n e qualquer habilidade ativa é imediatamente desativada [incluindo passivas]. A vítima só\n pode ser libertada se o mecanismo for desativado externamente por outro indivíduo ao\n apertar um botão na parte inferior do disco, ou quebrado com uma Ferramenta de Forja\n de Somnium Puro.",

          }
        } else {
          f.afinidade = pai.afinidade; // pode ser trocada
          f.origem = pai.origem; // Origem inalterada
        }
        return f;
      }
      /* Mantém sincronizado o que o guia diz ser herdado do personagem principal */
      function sincSec() {
        const f = ROOT.sec;
        if (!f) return;
        f.nivel = ROOT.nivel;
        if (f.secTipo === "invocacao") {
          f.afinidade = ROOT.afinidade;
          f.origem = "";
          f.subs = {};
          f.usos = {};
          f.estigma.arqs = [...ROOT.estigma.arqs];
          f.estigma.tipoDano = ROOT.estigma.tipoDano;
        } else {
          f.origem = ROOT.origem;
          f.subs = ROOT.subs;
          f.usos = ROOT.usos;
          f.veratemEco = ROOT.veratemEco;
        }
        f.sigilo = { nome: "", v: "", op: {}, ativo: false }; // nenhuma das duas tem Sigilo próprio
      }

      /* ============================================================
   Motor de valores derivados — segue o Guia de Referência
   ============================================================ */
      function temTalento(nome) {
        return Object.keys(ESP).some((k) =>
          (CH.esp[k].tal || []).some((t) => t && t.startsWith(nome))
        );
      }
      function contaMaestria(eco, nome) {
        return (CH.ecos[eco].hab || []).filter((t) => t && t.startsWith(nome))
          .length;
      }
      function custoEsp(k) {
        const s = CH.esp[k],
          perm = s.nv * 2;
        const gratis = CH.origem === "Mercenário" ? subSel("gratis") : [];
        const esc = (s.tal || []).filter(
          (t) => t && !gratis.includes(t)
        ).length;
        return CUSTO_NV[s.nv] + Math.max(0, esc - perm) * 2;
      }
      function custoEco(k) {
        const s = CH.ecos[k],
          perm = s.nv * 2,
          esc = (s.hab || []).filter(Boolean).length;
        const tab =
          CH.origem === "Veratem" && CH.veratemEco === k
            ? CUSTO_NV_V
            : CUSTO_NV;
        return tab[s.nv] + Math.max(0, esc - perm) * 2;
      }

      function mercLim(base) {
        return (
          base +
          (CH.nivel >= 6 ? 1 : 0) +
          (CH.nivel >= 11 ? 1 : 0) +
          (CH.nivel >= 16 ? 1 : 0)
        );
      }
      function limSub(s, psi) {
        if (s.ref) return Infinity;
        if (typeof s.lim === "number") return s.lim;
        if (s.lim === "psique") return psi;
        if (s.lim === "1+half") return 1 + half(psi);
        if (s.lim === "half") return half(psi);
        if (s.lim === "merc4") return mercLim(1);
        if (s.lim === "merc3") return mercLim(0);
        return 0;
      }
      function limUsos(f, psi) {
        return f === "1"
          ? 1
          : f === "half"
          ? half(psi)
          : f === "psique"
          ? psi
          : 1 + half(psi);
      }
      function subsDaOrigem() {
        return (SUBS[CH.origem] || []).filter((s) => CH.nivel >= s.nv);
      }
      function subSel(id) {
        const sb = (SUBS[CH.origem] || []).find((x) => x.id === id);
        if (sb && sb.especial === "veratemEco")
          return CH.veratemEco ? [CH.veratemEco] : [];
        return CH.subs[id] || [];
      }
      function listaSub(s) {
        if (s.fonte === "talentos") {
          const mapa = {};
          Object.keys(TALENTOS).forEach((c) =>
            TALENTOS[c].forEach((t) => {
              const k = t.n.trim();
              if (mapa[k]) mapa[k].cats.push(c);
              else mapa[k] = { n: k, cats: [c], d: t.d, c: t.t };
            })
          );
          return Object.values(mapa).map((x) => ({
            n: x.n,
            cat: x.cats.join(" · "),
            c: x.c,
            d: x.d,
          }));
        }
        return s.lista || [];
      }

      /* Bônus vindos de habilidades ativas ou passivas do Estigma (Modo Mesa) */
      function efeitosAtivos(psique) {
        const E = {
          atr: {},
          desloc: 0,
          deslocDobro: false,
          deslocMeio: false,
          inic: 0,
          carga: 1,
          reducao: 0,
          escudo: 0,
          dano: 0,
          rol: {},
          ignoraFerido: false,
          lista: [],
        };
        CH.estigma.habs.forEach((h) => {
          const ligada = h.passiva || h.ativa;
          if (!ligada) return;
          h.fns.forEach((sf) => {
            const f = FN[sf.id];
            if (!f || !f.efeito) return;
            const v = (f.op || []).find((o) => o.id === "v");
            const idx = v ? sf.op[v.id] ?? 0 : 0;
            const grau = idx + 1; // +1 / +2 / +3
            const rot = (h.nome || f.n) + (h.passiva ? " (passiva)" : "");
            switch (f.efeito.tipo) {
              case "atr": {
                const k = (sf.par && sf.par.atr) || "";
                if (!k) {
                  E.lista.push({ l: rot, t: f.n + ": defina o atributo" });
                  break;
                }
                const key = AF2ATR[k];
                if (!key) break;
                E.atr[key] = (E.atr[key] || 0) + grau * f.efeito.sinal;
                E.lista.push({
                  l: rot,
                  t: (f.efeito.sinal > 0 ? "+" : "−") + grau + " em " + k,
                });
                break;
              }
              case "carga":
                E.carga = E.carga * 2;
                E.lista.push({ l: rot, t: "carga e levantamento dobrados" });
                break;
              case "desloc_psi": {
                const o = (f.op || [])[0];
                const n = o ? (sf.op[o.id] ?? 0) + 1 : 1;
                E.desloc += psique * n;
                E.lista.push({
                  l: rot,
                  t: "+" + psique * n + " m de deslocamento",
                });
                break;
              }
              case "desloc_dobro":
                E.deslocDobro = true;
                E.lista.push({ l: rot, t: "deslocamento dobrado" });
                break;
              case "inic_psi":
                E.inic += psique;
                E.lista.push({ l: rot, t: "+" + psique + " de iniciativa" });
                break;
              case "tamanho": {
                const o = (f.op || []).find((x) => x.id === "cat");
                const it = o ? o.it[sf.op[o.id] ?? 2] : null;
                const m = {
                  0: [-2, 2],
                  1: [-1, 1],
                  2: [0, 0],
                  3: [1, -1],
                  4: [2, -2],
                }[(sf.op && sf.op.cat) ?? 2] || [0, 0];
                if (m[0] || m[1]) {
                  E.atr.forca = (E.atr.forca || 0) + m[0];
                  E.atr.agilidade = (E.atr.agilidade || 0) + m[1];
                  E.lista.push({
                    l: rot,
                    t:
                      (m[0] > 0 ? "+" : "") +
                      m[0] +
                      " Força · " +
                      (m[1] > 0 ? "+" : "") +
                      m[1] +
                      " Agilidade",
                  });
                }
                break;
              }
              case "dano": {
                const o = (f.op || []).find((x) => x.id === "v");
                const n = ((sf.op && sf.op.v) ?? 0) + 1;
                E.dano += n;
                E.lista.push({ l: rot, t: "+" + n + " de dano" });
                break;
              }
              case "rolagem": {
                const k = (sf.par && sf.par.rol) || "";
                const n = (((sf.op && sf.op.v) ?? 0) + 1) * f.efeito.sinal;
                if (!k) {
                  E.lista.push({
                    l: rot,
                    t: f.n + ": defina o tipo de rolagem",
                  });
                  break;
                }
                E.rol[k] = (E.rol[k] || 0) + n;
                E.lista.push({
                  l: rot,
                  t: (n > 0 ? "+" : "") + n + " em " + k,
                });
                break;
              }
              case "desloc_fixo": {
                const v2 = half(psique) * (f.efeito.sinal || 1);
                E.desloc += v2;
                E.lista.push({
                  l: rot,
                  t: (v2 > 0 ? "+" : "") + v2 + " m de deslocamento",
                });
                break;
              }
              case "desloc_meio":
                E.deslocMeio = true;
                E.lista.push({ l: rot, t: "deslocamento reduzido à metade" });
                break;
              case "ignoraFerido":
                E.ignoraFerido = true;
                E.lista.push({
                  l: rot,
                  t: "ignora Ferido e Gravemente Ferido",
                });
                break;
              case "nota":
                E.lista.push({ l: rot, t: f.efeito.txt });
                break;
              case "resist": {
                const arr = (sf.par || {}).dmg || [];
                E.lista.push({
                  l: rot,
                  t: arr.length
                    ? "resistência a " + arr.join(", ")
                    : "defina os tipos de dano",
                });
                break;
              }
              case "imune": {
                const arr = (sf.par || {}).cd || [];
                E.lista.push({
                  l: rot,
                  t: arr.length
                    ? "imune a " + arr.join(", ")
                    : "defina as condições",
                });
                break;
              }
              case "reducao": {
                const o = (f.op || []).find((x) => x.id === "v");
                const n = ((sf.op && sf.op.v) ?? 0) + 1;
                E.reducao = Math.max(E.reducao, n);
                E.lista.push({ l: rot, t: "−" + n + " de dano sofrido" });
                break;
              }
              case "escudo": {
                const n = ((sf.op && sf.op.e) ?? 0) + 1;
                E.escudo = Math.max(E.escudo, psique * n);
                E.lista.push({ l: rot, t: "escudo de " + psique * n });
                break;
              }
            }
          });
        });
        return E;
      }

      function D0() {
        const temVinc = contaMaestria("manipulacao", "Vínculo Psíquico") > 0;
        return { nvVinculo: temVinc ? CH.ecos.manipulacao.nv : 0 };
      }
      function D() {
        const p = PROG[CH.nivel],
          a = CH.attrs,
          af = CH.afinidade;
        const sec = CH.secTipo || "";
        const tamPV =
          sec === "invocacao" ? { p: -1, m: 0, g: 1 }[CH.secTam] || 0 : 0;
        const afd = AFIN[af] || {
          hp: 0,
          dmg: 0,
          desl: 1,
          carga: 1,
          esq: 0,
          atk: 0,
          eco: 0,
          txt: "",
        };
        /* Sigilo de Transformação ativo: +2 em Psique e na Afinidade */
        const sigLib = CH.nivel >= SIGILO_NV && !CH.secTipo;
        const sigAtivo =
          sigLib && CH.sigilo.ativo && CH.sigilo.v === "transformacao";
        const bonusSig = sigAtivo ? 2 : 0;
        const psique = p.limAtr + bonusSig;
        const EF = efeitosAtivos(p.limAtr + bonusSig);
        /* Penalidades e bônus marcados à mão no Modo Mesa */
        (CH.mods || []).forEach((m) => {
          const v = +m.valor || 0;
          if (!v) return;
          if (ATR.includes(m.alvo)) {
            EF.atr[m.alvo] = (EF.atr[m.alvo] || 0) + v;
          } else if (m.alvo === "desloc") EF.desloc += v;
          else if (m.alvo === "inic") EF.inic += v;
          else if (m.alvo === "reducao") EF.reducao += v;
          else if (m.alvo) EF.rol[m.alvo] = (EF.rol[m.alvo] || 0) + v;
          EF.lista.push({
            l: m.nota || "ajuste manual",
            t:
              (v > 0 ? "+" : "") +
              v +
              " em " +
              (ATRN[m.alvo] || ROT_MOD[m.alvo] || m.alvo),
          });
        });
        const aE = Object.assign({}, a);
        if (bonusSig && AF2ATR[af])
          aE[AF2ATR[af]] = (a[AF2ATR[af]] || 0) + bonusSig;
        ATR.forEach((k) => {
          if (EF.atr[k]) aE[k] = Math.max(0, (aE[k] || 0) + EF.atr[k]);
        });

        /* Aptidão Natural do Comum */
        const apt = CH.origem === "Comum" ? subSel("aptidao") : [];
        const aptAtr = apt.includes("Evolução Natural") ? 3 : 0;
        const aptApr = apt.includes("Treinamento Intensivo") ? 3 : 0;
        const aptRun = apt.includes("Expansão de Estigma") ? 2 : 0;
        const aptFlx = apt.includes("Limite Aumentado") ? 40 : 0;
        const aptPA = CH.origem === "Comum" && CH.nivel >= 16 ? 2 : 0;

        /* mutações do Mestiço com efeito numérico */
        const mut = subSel("mut");
        const mEsq = mut.includes("Antena") ? 1 : 0;
        const mDef = mut.includes("Pele Escamosa") ? 1 : 0;
        const mDesl = mut.includes("Pernas Superdesenvolvidas") ? 3 : 0;
        const mRed = mut.includes("Pele Endurecida") ? 1 : 0;

        /* pontos de atributo (sempre pelos valores brutos) */
        const gastoAtr = ATR.reduce((s, k) => s + (a[k] || 0), 0);
        const ptsAtr = p.ptsAtr + aptAtr;

        /* pontos de aprimoramento */
        const gEsp = Object.keys(ESP).reduce((s, k) => s + custoEsp(k), 0);
        const gEco = Object.keys(ECO).reduce((s, k) => s + custoEco(k), 0);
        const bonusEco = af === "Mente" ? 3 : 0;
        const usadosApr = gEsp + Math.max(0, gEco - bonusEco);
        const aprTotal = p.apr + aptApr;
        const aprSobra = aprTotal - usadosApr;
        const ecoSobra = Math.max(0, bonusEco - gEco);

        /* maestrias que mexem em recursos globais */
        const limExp = contaMaestria("manipulacao", "Limite Expandido");
        const runaAd = contaMaestria("manipulacao", "Runa Adicional");
        const temVinc = contaMaestria("manipulacao", "Vínculo Psíquico") > 0;
        const nvVinculo = temVinc ? CH.ecos.manipulacao.nv : 0;

        /* Veratem — mestre no eco escolhido */
        const veratemMestre =
          CH.origem === "Veratem" &&
          CH.veratemEco &&
          CH.ecos[CH.veratemEco].nv === 3;

        /* PV */
        const pvTotal =
          CH.nivel < 1
            ? 0
            : Math.max(
                1,
                Math.floor(
                  10 +
                    aE.corpo +
                    (CH.nivel - 1) * (5 + half(aE.corpo)) +
                    CH.nivel * afd.hp +
                    CH.nivel *
                      (CH.secTipo === "invocacao"
                        ? { p: -1, m: 0, g: 1 }[CH.secTam] || 0
                        : 0)
                )
              );
        const pvAtual =
          CH.pvAtual == null ? pvTotal : Math.min(CH.pvAtual, pvTotal);
        const sit =
          pvAtual <= 0
            ? "INCONSCIENTE"
            : pvAtual <= pvTotal * 0.25
            ? "GRAVEMENTE FERIDO"
            : pvAtual <= pvTotal * 0.5
            ? "FERIDO"
            : "NORMAL";
        const penFerido =
          sit === "GRAVEMENTE FERIDO" ? -4 : sit === "FERIDO" ? -2 : 0;
        const ignoraFerido = af === "Corpo" || EF.ignoraFerido;

        /* defesas */
        const guarda = temTalento("Em Guarda") ? p.guarda : 0;
        const inic = Math.max(
          aE.agilidade + half(aE.instinto),
          aE.instinto + half(aE.agilidade)
        );
        const rolAtk = EF.rol["Jogada de Ataque"] || 0;
        const rolEsq =
          (EF.rol["Jogada de Esquiva/Defesa"] || 0) +
          (EF.rol["Jogada de Esquiva"] || 0);
        const esquiva = inic + afd.esq + guarda + mEsq + rolEsq;
        const inicTot = inic + EF.inic;
        const defesa =
          aE.forca +
          half(Math.max(aE.agilidade, aE.instinto)) +
          guarda +
          mDef +
          rolEsq;

        /* ataque psíquico / ND */
        const atqPsi = psique + half(aE[AF2ATR[af]] || 0) + afd.atk + rolAtk;

        /* combate desarmado */
        const versatil = (CH.esp.desarmado.tal || []).some(
          (t) => t && t.startsWith("Versátil")
        );
        const atrDes = versatil ? Math.max(aE.forca, aE.agilidade) : aE.forca;
        const atqDes = atrDes + p.bonusEsp + rolAtk;
        const danoDes = CH.esp.desarmado.nv + half(atrDes);

        /* ecos */
        const revBonus =
          CH.ecos.revestimento.nv > 0
            ? veratemMestre &&
              CH.veratemEco === "revestimento" &&
              CH.ecos.revestimento.nv === 3
              ? 4
              : CH.ecos.revestimento.nv
            : 0;
        const revTeste = CH.ecos.revestimento.nv > 0 ? half(psique) : 0;
        const manBonus =
          CH.ecos.manipulacao.nv > 0
            ? veratemMestre &&
              CH.veratemEco === "manipulacao" &&
              CH.ecos.manipulacao.nv === 3
              ? 4
              : CH.ecos.manipulacao.nv
            : 0;
        const detMult =
          CH.ecos.deteccao.nv > 0
            ? veratemMestre &&
              CH.veratemEco === "deteccao" &&
              CH.ecos.deteccao.nv === 3
              ? 10
              : CH.ecos.deteccao.nv * 2 + 1
            : 0;
        const detAlc = psique * detMult;

        /* fluxo */
        const descPass = CH.estigma.habs
          .filter((h) => h.passiva)
          .reduce((s, h) => s + custo(h).total, 0);
        /* Invocação: metade do Limite. Sobreposição: mesmo Limite Base, aumentos de Eco são próprios. */
        const baseFluxo = sec === "invocacao" ? half(p.fluxo) : p.fluxo;
        const custoInvoc =
          !sec && CH.sigilo && CH.sigilo.v === "invocacao" && CH.sigilo.ativo
            ? [50, 60, 70][
                CH.sigilo.op && CH.sigilo.op.tam != null ? CH.sigilo.op.tam : 1
              ] || 60
            : 0;
        const limFluxo = baseFluxo + 40 * limExp + aptFlx - custoInvoc;
        const fluxoDisp = limFluxo - descPass;
        const sobrecarga = Math.max(0, CH.fluxoGasto - fluxoDisp);

        /* runas e passivas */
        const runasDisp =
          (sec === "invocacao" ? half(p.runas) : p.runas) + runaAd + aptRun;
        const runasUso =
          CH.estigma.habs.reduce((s, h) => s + runasGastas(h), 0) +
          (+CH.estigma.trade || 0);
        const passLim = 1 + half(psique);
        const passUso = CH.estigma.habs.filter((h) => h.passiva).length;

        return {
          p,
          a,
          aE,
          af,
          afd,
          psique,
          sigLib,
          sigAtivo,
          bonusSig,
          mRed,
          mEsq,
          mDef,
          mDesl,
          EF,
          gastoAtr,
          ptsAtr,
          atrDisp: ptsAtr - gastoAtr,
          limAtr: p.limAtr,
          aptAtr,
          aptApr,
          aptRun,
          aptFlx,
          aptPA,
          paTotal: p.pa + aptPA,
          aprTotal,
          gEsp,
          gEco,
          bonusEco,
          usadosApr,
          aprSobra,
          ecoSobra,
          limExp,
          runaAd,
          temVinc,
          nvVinculo,
          veratemMestre,
          pvTotal,
          pvAtual,
          sit,
          penFerido,
          ignoraFerido,
          inic: inicTot,
          inicBase: inic,
          esquiva,
          defesa,
          guarda,
          atqPsi,
          reducaoTotal: mRed + EF.reducao,
          escudoAtivo: EF.escudo,
          rolAtk,
          rolEsq,
          bonusDanoAtivo: EF.dano,
          versatil,
          atrDes,
          atqDes,
          danoDes,
          revBonus,
          revTeste,
          manBonus,
          detAlc,
          detMult,
          limFluxo,
          fluxoDisp,
          descPass,
          sobrecarga,
          sec,
          tamPV,
          custoInvoc,
          baseFluxo,
          bonusVinculo:
            veratemMestre &&
            CH.veratemEco === "manipulacao" &&
            CH.ecos.manipulacao.nv === 3
              ? 4
              : nvVinculo,
          runasDisp,
          runasUso,
          passLim,
          passUso,
          desloc: Math.max(
            0,
            Math.round(
              ((10 + aE.agilidade * afd.desl + mDesl) *
                (EF.deslocDobro ? 2 : 1)) /
                (EF.deslocMeio ? 2 : 1) +
                EF.desloc
            )
          ),
          levant: (120 + 50 * aE.forca) * afd.carga * EF.carga,
          carga: (60 + 10 * aE.forca) * afd.carga * EF.carga,
          detPassiva: 3 * aE.instinto,
          ndPassiva: 6 + aE.instinto,
          idiomas: 1 + half(aE.mente),
          insAcum: Math.ceil(sobrecarga / 5),
          paLivre: p.pa + aptPA - (CH.paGasto || 0),
          prolRodada: CH.estigma.habs
            .filter((h) => h.ativa && h.dur === "prol" && !h.passiva)
            .reduce((s2, h) => s2 + custo(h).prol, 0),
          sigPV: (p.limAtr + 2) * 10,
          sigRaio: psique * (SIGILOS.territorio.raio || 8),
          sigInvFluxo: half(p.fluxo + 40 * limExp),
        };
      }

      /* ============================================================
   Armas
   ============================================================ */
      function acharArma(n) {
        return ARMAS.find((x) => x.n === n);
      }
      function alcanceArma(x) {
        if (!x) return "—";
        const a = CH.attrs,
          al = x.alc || {};
        if (al.calc === "agi") return al.base + 2 * a.agilidade + " m";
        if (al.calc === "for") return al.base + 2 * a.forca + " m";
        if (al.calc === "maxAgiFor")
          return al.base + 2 * Math.max(a.agilidade, a.forca) + " m";
        return al.txt || "—";
      }
      function proficiente(x, vinc) {
        if (!x) return false;
        if (vinc && D0().nvVinculo) return true; // arma de vínculo
        if (CH.origem === "Mercenário") return true; // Senhor da Guerra
        if (x.tipo === "Desarmado" || x.tipo === "Explosivos Arremessáveis")
          return true;
        if (x.tipo === "Corpo a Corpo")
          return (CH.esp.cac.prof || []).includes(x.cat);
        if (
          x.tipo === "Marciais Arremessáveis" ||
          x.tipo === "Armas à Distância"
        )
          return CH.esp.dist.nv >= 1;
        if (x.tipo === "Armas de Fogo")
          return (
            CH.esp.dist.nv >= ({ Leve: 1, Média: 2, Pesada: 3 }[x.cat] || 1)
          );
        return false;
      }
      function atqArma(x, vinculada) {
        const d = D(),
          a = CH.attrs;
        if (!x) return { mod: 0, base: "—" };
        if (x.tipo === "Desarmado")
          return {
            mod: d.atqDes,
            base: (d.versatil ? "FOR/AGI" : "FOR") + " + " + d.p.bonusEsp,
            prof: true,
          };
        if (x.tipo === "Explosivos Arremessáveis")
          return {
            mod: a.agilidade,
            base: "AGI (ND do explosivo)",
            prof: true,
          };
        const prof = proficiente(x, vinculada);
        let attr = 0,
          base = "";
        if (x.tipo === "Corpo a Corpo") {
          if (x.cat === "Leve") {
            attr = a.agilidade;
            base = "AGI";
          } else if (x.cat === "Média") {
            attr = Math.max(a.agilidade, a.forca);
            base = "AGI ou FOR";
          } else {
            attr = a.forca;
            base = "FOR";
          }
        } else if (x.tipo === "Marciais Arremessáveis") {
          if ((x.alc || {}).calc === "for") {
            attr = a.forca;
            base = "FOR";
          } else {
            attr = a.agilidade;
            base = "AGI";
          }
        } else {
          attr = a.agilidade;
          base = "AGI";
        }
        const esp = x.tipo === "Corpo a Corpo" ? CH.esp.cac.nv : CH.esp.dist.nv;
        const bonus = esp > 0 || CH.origem === "Mercenário" ? d.p.bonusEsp : 0;
        if (!prof) return { mod: 0, base: "sem proficiência", prof: false };
        return {
          mod: attr + bonus,
          base: base + (bonus ? " + " + bonus : ""),
          prof: true,
          attr,
          bonus,
        };
      }
      function bonusOrigemArma(x, tipoLabel) {
        const out = [];
        if (CH.origem === "Mercenário") {
          const assin = subSel("assin");
          const nome =
            x.tipo === "Desarmado"
              ? "Combate Desarmado"
              : x.tipo === "Corpo a Corpo"
              ? "Marciais Corpo a Corpo — " + x.cat
              : x.tipo === "Armas de Fogo"
              ? "Armas de Fogo — " + x.cat
              : x.tipo === "Armas à Distância"
              ? "Marciais à Distância — " + x.cat
              : x.tipo === "Marciais Arremessáveis"
              ? "Marciais Arremessáveis — " + x.cat
              : "";
          if (assin.includes(nome) && CH.nivel >= 6) {
            if (x.tipo === "Armas de Fogo" && x.cat === "Pesada")
              out.push({ l: "Arma de Assinatura", v: 1 });
            if (x.tipo === "Marciais Arremessáveis" && x.cat === "Média")
              out.push({ l: "Arma de Assinatura", v: 1 });
          }
        }
        return out;
      }
      function modsArma(x) {
        const out = [];
        (CH.artefatos || []).forEach((a) => {
          if (
            !a.assimilado ||
            a.forma !== "arma" ||
            !a.arma ||
            !x ||
            a.arma !== x.n
          )
            return;
          (a.mods || []).forEach((nome) => {
            const m = ART_MODS.find((z) => z.n === nome);
            if (m && m.dano) out.push({ l: "Modificação: " + m.n, v: m.dano });
          });
        });
        return out;
      }
      function danoArma(x, vinculada) {
        const d = D();
        if (!x) return { txt: "—", comp: [] };
        const comp = [];
        if (x.tipo === "Desarmado") {
          comp.push({
            l: "Especialização (nível " + CH.esp.desarmado.nv + ")",
            v: CH.esp.desarmado.nv,
          });
          comp.push({
            l: "metade de " + (d.versatil ? "FOR/AGI" : "FOR"),
            v: half(d.atrDes),
          });
          const punho = CH.armas.some((w) => {
            const q = acharArma(w.n);
            return q && (q.car || "").includes("Arma de Punho");
          });
          if (punho) comp.push({ l: "Arma de Punho equipada", v: 1 });
          if (d.revBonus)
            comp.push({ l: "Revestimento (golpe revestido)", v: d.revBonus });
          if (CH.afinidade === "Força")
            comp.push({ l: "Afinidade Força", v: 1 });
        } else {
          if (typeof x.dano === "number")
            comp.push({ l: "Dano base da arma", v: x.dano });
          else
            return {
              txt: String(x.dano || "—") + " " + (x.dtipo || ""),
              comp: [],
            };
          const cc =
            x.tipo === "Corpo a Corpo" || x.tipo === "Marciais Arremessáveis";
          if (CH.afinidade === "Força" && cc)
            comp.push({ l: "Afinidade Força", v: 1 });
          if (vinculada && d.nvVinculo)
            comp.push({
              l: "Eco de Vínculo (nível " + d.nvVinculo + ")",
              v: d.bonusVinculo,
            });
          bonusOrigemArma(x).forEach((b) => comp.push(b));
          modsArma(x).forEach((b) => comp.push(b));
        }
        if (d.bonusDanoAtivo)
          comp.push({ l: "Aumento de Dano ativo", v: d.bonusDanoAtivo });
        const tot = comp.reduce((s, c) => s + c.v, 0);
        return { txt: tot + " " + (x.dtipo || ""), tot, comp };
      }

      /* ============================================================
   Motor de custo do Estigma
   ============================================================ */
      function fnPA(hab, i) {
        const f = FN[hab.fns[i].id];
        if (!f) return 0;
        let pa = f.pa;
        (f.op || []).forEach((o) => {
          if (o.num) return;
          const it = o.it[hab.fns[i].op[o.id] ?? 0];
          if (it && it.pa != null) pa = it.pa;
        });
        if (pa == null) pa = 0;
        return pa;
      }
      const FIS = ["Cortante", "Perfurante", "Contundente"];
      function baseFisico() {
        return FIS.includes(CH.estigma.tipoDano);
      }
      function tiposPermitidos() {
        if (baseFisico()) return FIS.slice();
        const extra = CH.multiDano ? CH.tiposDano || [] : [];
        return [CH.estigma.tipoDano, ...extra].filter(
          (v, i, a) => v && a.indexOf(v) === i
        );
      }
      function tipoDaRuna(hab) {
        const perm = tiposPermitidos();
        if (hab.tipoDano && perm.includes(hab.tipoDano)) return hab.tipoDano;
        return CH.estigma.tipoDano;
      }
      function temDano(hab) {
        return hab.fns.some((sf) => FN[sf.id] && FN[sf.id].dano);
      }
      function ignoraAlcance(hab) {
        return hab.fns.some((sf) => FN[sf.id] && FN[sf.id].ig);
      }
      const fazAtaque = (r) => r === "ataque" || r === "ambos";
      const fazTeste = (r) => r === "teste" || r === "ambos";
      function mostraCombOpt(hab) {
        if (!hab.comb || hab.mira === "area") return false;
        const fs = hab.fns.map((sf) => FN[sf.id]).filter(Boolean);
        if (fs.length < 2) return false;
        return (
          fs.some((f) => f.dano) &&
          fs.some((f) => f.cond || f.arq === "enfraquecimento")
        );
      }
      function resolucao(hab) {
        const fs = hab.fns.map((sf) => FN[sf.id]).filter(Boolean);
        if (!fs.length) return "nenhuma";
        if (hab.mira === "area")
          return fs.some((f) => f.t === "s" || f.t === "o")
            ? "teste"
            : "nenhuma";
        if (mostraCombOpt(hab))
          return hab.combOpt === "ataque_teste" ? "ambos" : "teste";
        if (fs.some((f) => f.ataque)) return "ataque";
        if (fs.some((f) => f.t === "s")) return "teste";
        if (fs.some((f) => f.t === "o"))
          return hab.modo === "teste" ? "teste" : "ataque";
        return "nenhuma";
      }
      function escolhaAlvo(hab) {
        return hab.fns.some((sf) => FN[sf.id] && FN[sf.id].taAlvo);
      }
      function attrsTeste(hab) {
        const set = [];
        hab.fns.forEach((sf) => {
          const f = FN[sf.id];
          if (f && f.ta)
            f.ta.forEach((x) => {
              if (!set.includes(x)) set.push(x);
            });
        });
        return set;
      }
      function runasGastas(hab) {
        if (!hab.fns.some((sf) => sf.id)) return 0;
        let extra = 0;
        hab.fns.forEach((sf) => {
          const f = FN[sf.id];
          if (f && f.ap) extra = Math.max(extra, (sf.ap || 1) - 1);
        });
        if (
          hab.marioMult &&
          hab.fns.some((sf) => FN[sf.id] && FN[sf.id].apRunas)
        )
          extra += 2;
        if (hab.tipo === "estigma") return extra;
        return (hab.comb ? 2 : 1) + extra;
      }
      /* Fluxo Eficiente: reduz o consumo prolongado em até 5, conforme a Psique */
      function redPassiva(hab) {
        if (!contaMaestria("manipulacao", "Fluxo Eficiente")) return 0;
        const psi = PROG[CH.nivel] ? PROG[CH.nivel].limAtr : 0;
        return Math.min(5, psi);
      }
      function custo(hab) {
        let base = 0,
          pa = 0,
          det = [];
        hab.fns.forEach((sf, i) => {
          const f = FN[sf.id];
          if (!f) return;
          let sub = f.b ?? 0,
            rot = [];
          if (f.b != null) rot.push("base " + f.b);
          else if (f.bv && !(f.op || []).length) rot.push(f.bv);
          (f.op || []).forEach((o) => {
            if (o.num) {
              const v = sf.op[o.id] ?? o.def;
              let m = o.mult || 1;
              if (f.calc === "cura") m = sf.ap >= 3 ? 1 : 2;
              if (f.calc === "fluxo") m = 1;
              if (f.calc === "quadrados") m = (sf.op.esc ?? 0) === 1 ? 1 : 2;
              sub += v * m;
              rot.push(
                v +
                  (f.calc === "quadrados"
                    ? m === 1
                      ? " objeto(s) × 1"
                      : " quadrado(s) × 2"
                    : " × " + m)
              );
            } else {
              const it = o.it[sf.op[o.id] ?? 0];
              if (it && it.c) {
                sub += it.c;
                rot.push(
                  (it.c > 0 ? "+" : "") + it.c + " " + o.l.toLowerCase()
                );
              }
            }
          });
          base += sub;
          det.push({ n: f.n, v: sub, r: rot.join(" · ") });
          pa = Math.max(pa, fnPA(hab, i));
        });
        const baseBruta = base;
        if (hab.passiva) base = base * 2;

        let mods = [];
        const add = (l, v) => {
          if (v) mods.push({ l, v });
        };
        if (hab.mira === "multiplos") add("Múltiplos alvos", 5);
        if (hab.mira === "area") {
          const ar = AREA[hab.area];
          add("Área — " + ar.l, ar.c);
          if (ar.tam)
            add("Tamanho — " + TAM[hab.tam].l.split(" —")[0], TAM[hab.tam].c);
        }
        if (!ignoraAlcance(hab))
          add("Alcance — " + ALC[hab.alc].l, ALC[hab.alc].c);
        if (!hab.passiva) add("Duração — " + DUR[hab.dur].l, DUR[hab.dur].c);
        if (hab.testeFim && hab.dur === "prol" && fazTeste(resolucao(hab)))
          add("Teste no fim do turno", 5);
        if (hab.comb && mostraCombOpt(hab) && hab.combOpt === "ataque_teste")
          add("Ataque + Teste separados", -3);
        if (!hab.passiva && !hab.arte) {
          if (hab.verbal) add("Requisito Verbal", -1);
          if (hab.gestual) add("Requisito Gestual", -3);
        }
        const modSum = mods.reduce((s, m) => s + m.v, 0);
        const bruto = base + modSum;
        const temFn = hab.fns.some((sf) => FN[sf.id]);
        let total = temFn ? Math.max(1, bruto) : Math.max(0, bruto);
        const piso = temFn && bruto < 1;
        let prol = hab.dur === "prol" && !hab.passiva ? 10 : 0;
        if (prol && hab.concentracao) prol = 0;
        else if (prol) prol = Math.max(0, prol - redPassiva(hab));
        return {
          det,
          baseBruta,
          base,
          mods,
          modSum,
          total,
          piso,
          pa: hab.passiva ? 0 : pa,
          prol,
        };
      }

      /* ============================================================
   Validação
   ============================================================ */
      const LISTA = {
        al: { unico: "Alvo único", multiplos: "Múltiplos alvos", area: "Área" },
        ac: {
          pessoal: "Pessoal",
          corpo: "Corpo a corpo/Toque",
          curto: "Curto",
          medio: "Médio",
          longo: "Longo",
        },
        du: {
          inst: "Instantânea",
          inicio: "Até o início do próximo turno",
          fim: "Até o fim do próximo turno",
          prol: "Prolongada",
        },
        ar: {
          esfera: "Esfera",
          cubo: "Cubo",
          cilindro: "Cilindro",
          linha: "Linha",
          cone: "Cone",
        },
      };
      const nmL = (k, v) => v.map((x) => LISTA[k][x]).join(" ou ");

      function validaHab(hab) {
        const A = [],
          e = (t) => A.push({ l: "e", t }),
          w = (t) => A.push({ l: "w", t }),
          i = (t) => A.push({ l: "i", t });
        const fs = hab.fns.map((sf) => FN[sf.id]).filter(Boolean);
        if (!fs.length) {
          i("Escolha uma Função Mecânica para começar.");
          return A;
        }
        const d = D();

        fs.forEach((f) => {
          if (!CH.estigma.arqs.includes(f.arq))
            w(
              f.n +
                ": o arquétipo " +
                CAT[f.arq].n +
                " não está entre os atribuídos ao Estigma."
            );
          if (f.se && hab.tipo !== "estigma")
            e(
              f.n +
                " só pode ser atribuída ao Estigma (marca principal), nunca como Runa."
            );
          if (f.sc && !hab.comb)
            e(
              f.n +
                " só existe dentro de uma Runa Combinada, junto de outra função."
            );
          if (hab.comb && f.nc)
            e(f.n + " não pode ser atribuída a Runa Combinada.");
          if (f.r && f.r.al && !f.r.al.includes(hab.mira))
            e(
              f.n +
                " exige " +
                nmL("al", f.r.al) +
                " — está como " +
                LISTA.al[hab.mira] +
                "."
            );
          if (f.r && f.r.ac && !f.ig && !f.r.ac.includes(hab.alc))
            e(
              f.n +
                " exige alcance " +
                nmL("ac", f.r.ac) +
                " — está como " +
                LISTA.ac[hab.alc] +
                "."
            );
          if (f.r && f.r.du && !hab.passiva && !f.r.du.includes(hab.dur))
            e(
              f.n +
                " exige duração " +
                nmL("du", f.r.du) +
                " — está como " +
                LISTA.du[hab.dur] +
                "."
            );
          if (
            f.r &&
            f.r.ar &&
            hab.mira === "area" &&
            !f.r.ar.includes(hab.area)
          )
            e(f.n + " exige área em " + nmL("ar", f.r.ar) + ".");
          if (hab.passiva && f.ps !== "s" && f.ps !== "x")
            e(f.n + " não pode ser atribuída como Passiva.");
          if (f.ps === "x" && !hab.passiva)
            e(f.n + " só funciona como Passiva — marque Uso Passivo.");
          if (f.ataque && hab.mira === "area")
            e(
              f.n +
                " exige Jogada de Ataque, e toda habilidade em área usa Teste de Resistência."
            );
          if (f.ataque && resolucao(hab) === "teste" && !mostraCombOpt(hab))
            e(
              f.n +
                " exige Jogada de Ataque, mas a habilidade resolve por Teste de Resistência."
            );
          if (f.exigeReq && !hab.verbal && !hab.gestual)
            e(
              f.n +
                " exige sempre requisito Verbal ou Gestual para poder ser ativada."
            );
          if (f.dano && !hab.passiva && DUR[hab.dur].semDano)
            w(
              f.n +
                ' causa dano direto, e a duração "' +
                DUR[hab.dur].l +
                '" não vale para dano direto.'
            );
          if (f.id === "aumento_dano" && hab.passiva && hab.mira === "area")
            e("Aumento de Dano como passiva não pode ser em área.");
          const sf = hab.fns.find((x) => x.id === f.id) || {};
          if (f.id === "ampliar_musc" && hab.passiva && (sf.ap || 1) > 1)
            e("Ampliar Musculatura só pode ser Passiva na opção de 1 runa.");
          if (
            (f.id === "visao_aprim" || f.id === "pulmao") &&
            hab.passiva &&
            (sf.ap || 1) > 1
          )
            w(
              f.n +
                " passiva: cada runa adicional ocupa uma passiva a mais no seu limite."
            );
        });

        if (hab.comb) {
          if (hab.tipo === "estigma")
            e(
              "A marca principal do Estigma nunca pode ser fundida em Runa Combinada."
            );
          if (fs.length < 2) w("Runa Combinada precisa de duas funções.");
          if (fs.length > 2)
            e("Uma habilidade nunca pode ter mais de duas funções.");
          if (fs.length === 2) {
            const [x, y] = fs;
            if (x.id === y.id)
              e("As duas funções da Runa Combinada são idênticas.");
            [
              [x, y],
              [y, x],
            ].forEach(([m, o]) => {
              if (m.semArq && m.semArq.includes(o.arq))
                e(
                  m.n +
                    " não pode ser combinada com uma função do arquétipo " +
                    CAT[o.arq].n +
                    "."
                );
              if (m.conflita && m.conflita.includes(o.id))
                e(m.n + " não combina com " + o.n + ".");
            });
            const ctr = fs.filter(
              (f) => f.arq === "controle" || f.arq === "enfraquecimento"
            );
            if (ctr.length === 2 && ctr[0].ta && ctr[1].ta)
              i(
                "Duas funções de Controle/Enfraquecimento: o atributo do teste deve ser o mesmo para as duas."
              );
            if (x.exigeDano || y.exigeDano) {
              const outra = x.exigeDano ? y : x;
              if (!outra.dano)
                e(
                  (x.exigeDano ? x.n : y.n) +
                    " exige estar combinada com uma função que cause dano."
                );
            }
            if (
              (x.id === "roubo_fluxo" || y.id === "roubo_fluxo") &&
              resolucao(hab) === "nenhuma"
            )
              e(
                "Roubo de Fluxo exige que a habilidade faça jogada de ataque ou peça teste de resistência."
              );
          }
          if (hab.passiva)
            e("Funções passivas não podem entrar em Runas Combinadas.");
        }
        if (
          fs.some((f) => f.id === "red_desloc_fixa") &&
          !fazAtaque(resolucao(hab))
        )
          e(
            "Redução Fixa de Deslocamento exige uma habilidade que faça jogadas de ataque."
          );
        if (
          fs.some((f) => f.id === "corta_cura") &&
          resolucao(hab) === "nenhuma"
        )
          e("Corta Cura exige jogada de ataque ou teste de resistência.");
        if (fs.some((f) => f.id === "escudo") && hab.dur === "prol")
          i(
            "Em Duração Prolongada o escudo se reestabelece sozinho no início do seu turno — a tabela de esforço extra vale para durações menores."
          );

        const c = custo(hab);
        if (hab.passiva)
          i(
            "Passiva: sempre ativa, não gasta P.A e não consome Fluxo por rodada. Custo dobrado e descontado permanentemente do Limite de Fluxo."
          );
        else if (c.total > d.fluxoDisp)
          w(
            "Custo de " +
              c.total +
              " acima do Fluxo disponível (" +
              d.fluxoDisp +
              "). Ativar assim gera sobrecarga: 1 de [In]Sanidade a cada 5 de Fluxo além do limite."
          );
        if (!A.some((x) => x.l === "e"))
          A.push({ l: "g", t: "Habilidade válida pelas regras do Guia." });
        return A;
      }

      function validaFicha() {
        const A = [],
          e = (t) => A.push({ l: "e", t }),
          w = (t) => A.push({ l: "w", t }),
          i = (t) => A.push({ l: "i", t });
        const d = D();

        if (d.atrDisp < 0)
          e(
            "Atributos: " +
              d.gastoAtr +
              " pontos distribuídos, o total disponível é " +
              d.ptsAtr +
              (d.aptAtr
                ? " (" +
                  d.p.ptsAtr +
                  " do nível + " +
                  d.aptAtr +
                  " da Aptidão Natural)"
                : " no nível " + CH.nivel) +
              "."
          );
        ATR.forEach((k) => {
          if (CH.attrs[k] > d.limAtr)
            e(
              ATRN[k] +
                " está em " +
                CH.attrs[k] +
                ", acima do Limite de Atributo do nível (" +
                d.limAtr +
                ")."
            );
        });
        if (!CH.afinidade)
          w(
            "Escolha a Afinidade do Fluxo — ela entra no Ataque Psíquico e nos derivados."
          );
        if (!CH.origem && !CH.secTipo)
          w("Escolha a Origem para liberar as habilidades de origem.");
        if (CH.secTipo === "invocacao") {
          i(
            "Invocação: nível, Afinidade e Estigma vêm da ficha principal. Runas e Limite de Fluxo são a metade do que o nível daria, e ela não tem Origem nem Sigilo."
          );
          if (d.custoInvoc === 0)
            i(
              'Enquanto a Invocação estiver ativa, o Limite de Fluxo do personagem principal cai pelo custo de conjuração — marque "Sigilo ativo" na aba Sigilo dele para ver o efeito.'
            );
        }
        if (CH.secTipo === "sobreposicao")
          i(
            "Sobreposição: a Origem é a mesma da ficha principal e o Limite Base de Fluxo é compartilhado — gastar numa ficha desconta da outra. Atributos, Especializações, Ecos, Afinidade e Estigma podem ser totalmente diferentes."
          );
        if (d.aprSobra < 0)
          e(
            "Pontos de Aprimoramento: " +
              d.usadosApr +
              " usados, o total disponível é " +
              d.aprTotal +
              (d.aptApr
                ? " (" +
                  d.p.apr +
                  " do nível + " +
                  d.aptApr +
                  " da Aptidão Natural)"
                : "") +
              "."
          );

            : "");

      /* Modificadores de ataque corpo a corpo e à distância, pela especialização e pelas armas */
      function ataquesArma(L) {
        const d = D(),
          out = [];
        const bonus =
          CH.esp.cac.nv > 0 || CH.origem === "Mercenário" ? d.p.bonusEsp : 0;
        const bonusD =
          CH.esp.dist.nv > 0 || CH.origem === "Mercenário" ? d.p.bonusEsp : 0;
        const cc = [
          ["leve", "Leve", "AGI", d.aE.agilidade],
          [
            "media",
            "Média",
            "AGI ou FOR",
            Math.max(d.aE.agilidade, d.aE.forca),
          ],
          ["pesada", "Pesada", "FOR", d.aE.forca],
        ];
        out.push(
          L(
            '<b style="color:var(--txt)">Corpo a corpo</b>',
            CH.esp.cac.nv ? "nível " + CH.esp.cac.nv : "sem especialização"
          )
        );
        cc.forEach(([k, lab, src, at]) => {
          const prof =
            (CH.esp.cac.prof || []).includes(lab) || CH.origem === "Mercenário";
          out.push(
            L(
              "&nbsp;↳ " + lab + " <em>(" + src + ")</em>",
              prof ? "+" + (at + bonus + d.rolAtk) : "sem proficiência"
            )
          );
        });
        out.push(
          L(
            '<b style="color:var(--txt)">À distância</b>',
            CH.esp.dist.nv ? "nível " + CH.esp.dist.nv : "sem especialização"
          )
        );
        out.push(
          L(
            "&nbsp;↳ Arremesso / arco <em>(AGI)</em>",
            CH.esp.dist.nv > 0 || CH.origem === "Mercenário"
              ? "+" + (d.aE.agilidade + bonusD + d.rolAtk)
              : "sem proficiência"
          )
        );
        ["Leve", "Média", "Pesada"].forEach((cat, ix) => {
          const ok = CH.origem === "Mercenário" || CH.esp.dist.nv >= ix + 1;
          out.push(
            L(
              "&nbsp;↳ Fogo " + cat + " <em>(AGI)</em>",
              ok
                ? "+" + (d.aE.agilidade + bonusD + d.rolAtk)
                : "sem proficiência"
            )
          );
        });
        if (d.bonusDanoAtivo)
          out.push(L("Bônus de dano ativo", "+" + d.bonusDanoAtivo));
        return out.join("");
      }

      function blocoSub(sb, d) {
        if (emSec()) sb = Object.assign({}, sb, { ref: true }); // herdadas: só consulta
        const lib = CH.nivel >= sb.nv;
        const sel = subSel(sb.id),
          lim = limSub(sb, d.psique),

        const aberto = PICKER && PICKER.tipo === "sub" && PICKER.id === sb.id;
        let h = `<div class="blk" style="border-color:${
          lib ? "var(--runa)" : "var(--line)"

          lib ? "" : " · bloqueado"

      sb.ref

        : `<span class="bdg ${
            sel.length > lim ? "r" : sel.length === lim ? "g" : "y"
          }">${sel.length} de ${lim}</span>`
    }</div>`;
        if (!lib)
          return h + `<p class="note">Liberada no nível ${sb.nv}.</p></div>`;
        if (sb.nota)
          h += `<p class="note" style="margin:0 0 9px">${esc(sb.nota)}</p>`;

          const vendo = PICKER && PICKER.tipo === "ref" && PICKER.id === sb.id;

          h += `<p class="note" style="margin:0">Nada escolhido ainda.</p>`;

          const it = lista.find((y) => (y.k || y.n) === x) || { n: x };

            it.c ? `<span class="bdg t">${esc(it.c)}</span>` : ""

          h += `<p class="note" style="margin-top:8px">Limite atingido. Remova uma escolha para trocar.</p>`;
